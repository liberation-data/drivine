# Lints, builds and tests Drivine. The tests run on test containers (see TEST_CONTAINERS.md): Neo4j, Memgraph, FalkorDB,
# Postgres and SQLite, and Oracle, whose image is large, with ORACLE_TESTS=true. A local `npm test` leaves Oracle out
# unless you set that, and says so. CI runs `npm test` twice, with Oracle and without, each split over parallel jobs
# with containers of their own: test/run-tests.ts says what each part runs.
#
# A pull request's run leaves out the nightly suites (NIGHTLY in test/run-tests.ts): slow ones, and ones that rest on a
# timing or a plan. A full run has them too: a push to master, a pull request labelled `full-ci`, nightly.yml each
# night, and release.yml's gate. release.yml calls this as the gate before a release, unless a full push or
# pull_request run of it has already passed on the same tree.
name: CI

on:
    push:
        branches: [master]
    pull_request:
        # As the default, and labeled, so that labelling a pull request `full-ci` runs the full set on it.
        types: [opened, synchronize, reopened, labeled]
    workflow_call:
        inputs:
            full:
                description: Run the nightly suites too, as a release and the nightly do.
                type: boolean
                default: false

# A pull request's newer run, of a later push or a label, takes the place of the one still going. Any other run, and
# this workflow called by another, is a group of its own.
concurrency:
    group: ${{ github.workflow == 'CI' && github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}-{1}', github.workflow, github.run_id) }}
    cancel-in-progress: true

# FalkorDB is held at a release that passes: a pull request's run takes falkordb/falkordb:6.0.3. The nightly run
# (nightly.yml, whose schedule this sees as its event) takes
# ghcr.io/falkordb/falkordb:latest, FalkorDB's newest release, and not the falkordb/falkordb:latest DrivineTestContainers
# names: Docker Hub's latest is whichever release FalkorDB pushed last, and that can be an older line's backport, as
# v4.22.3 took it after 6.0.3 (no =~, FalkorDB/FalkorDB#3551). Drop the nightly's ghcr.io image once Docker Hub's
# latest follows FalkorDB's newest line again; move the pin, or drop it, once the nightly passes.
env:
    FALKORDB_TEST_IMAGE: ${{ github.event_name == 'schedule' && 'ghcr.io/falkordb/falkordb:latest' || 'falkordb/falkordb:6.0.3' }}

jobs:
    # Records the git tree this run tests, as an artifact named ci-tree-<tree>, so a release of the same tree can trust
    # this run and skip its gate (scripts/ci-trust.js). It matters on a pull request, which tests its merge ref, not the
    # head commit the run names. A run of the pull request set alone, without the nightly suites, names it
    # ci-tree-pr-set-<tree>, which a release doesn't trust. It has no condition, as no job here may: release.yml trusts
    # a run only when every job in it passed, and a job skipped by a condition doesn't.
    tree:
        name: record the tree
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Work out the tree
              id: tree
              run: |
                  tree=$(git rev-parse 'HEAD^{tree}')
                  echo "tree=$tree" >> "$GITHUB_OUTPUT"
                  echo "$tree $(git rev-parse HEAD)" > ci-tree.txt
                  echo "This run tests tree $tree, of commit $(git rev-parse HEAD)." >> "$GITHUB_STEP_SUMMARY"
            # Overwritten when the run is re-run, as an artifact's name is unique within a run.
            - uses: actions/upload-artifact@v7
              with:
                  name: ci-tree-${{ !(inputs.full || github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && 'pr-set-' || '' }}${{ steps.tree.outputs.tree }}
                  path: ci-tree.txt
                  if-no-files-found: error
                  overwrite: true

    # The Cypher spec's copies in test/cypher are the tag VERSION names, unchanged, and a later tag is shown as a
    # warning.
    cypher-spec:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Check the Cypher spec
              run: scripts/check-cypher-spec.sh

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run lint:ci
            - run: npm run build
            - name: The built package loads
              run: node -e 'require("./dist/index.js"); require("./dist/testing/index.js")'

    # `npm test` without Oracle, as it runs locally by default, in parts: test/run-tests.ts says what each runs. The
    # parts of a pull request's run hold every suite but the nightly ones once; a full run's add those. The parts are
    # picked by the same test as `tree`'s record: a full run is a push, a call with `full`, or a pull request labelled
    # `full-ci`.
    test:
        name: test (${{ matrix.part }})
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                part: ${{ fromJSON((inputs.full || github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '["parallel 1/3", "parallel 2/3", "parallel 3/3", "cypher spec", "serial", "nightly", "write loop"]' || '["parallel 1/3", "parallel 2/3", "parallel 3/3", "cypher spec", "serial"]') }}
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/test-part
              with:
                  part: ${{ matrix.part }}
                  oracle: false

    # The whole suite again, with Oracle, in the same parts, but the Cypher spec over two: on Oracle it is the longest
    # part. Oracle has few suites of its own: most of its tests are the shared suites, which run on each configured store
    # (allStores(), sqlStores()) beside the graph engines.
    oracle-part:
        name: test (Oracle, ${{ matrix.part }})
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                part: ${{ fromJSON((inputs.full || github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '["parallel 1/3", "parallel 2/3", "parallel 3/3", "cypher spec on oracle", "cypher spec on the rest", "serial", "nightly", "write loop"]' || '["parallel 1/3", "parallel 2/3", "parallel 3/3", "cypher spec on oracle", "cypher spec on the rest", "serial"]') }}
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/test-part
              with:
                  part: ${{ matrix.part }}
                  oracle: true

    # The check the single Oracle job gave before it was split: it passes when every part with Oracle passed. It runs
    # whatever they concluded, as no job here may be skipped (see `tree`).
    oracle:
        name: test (Oracle)
        needs: oracle-part
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Every part passed
              run: |
                  echo "The parts with Oracle concluded ${{ needs.oracle-part.result }}."
                  [ "${{ needs.oracle-part.result }}" = success ]
