# Lints, builds and tests Drivine on every push to master and every pull request. The tests run on test containers
# (see TEST_CONTAINERS.md): Neo4j, Memgraph, FalkorDB and Postgres. Oracle, whose image is large, runs in a job of its
# own with ORACLE_TESTS=true. A local `npm test` leaves it out unless you set that, and says so. release.yml calls it
# as the gate before a release.
name: CI

on:
    push:
        branches: [master]
    pull_request:
    workflow_call:

jobs:
    # The Cypher spec's copies in test/cypher are the tag VERSION names, unchanged, and a later tag is shown as a
    # warning.
    cypher-spec:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Check the Cypher spec
              run: scripts/check-cypher-spec.sh

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run lint:ci
            - run: npm run build
            - name: The built package loads
              run: node -e 'require("./dist/index.js"); require("./dist/testing/index.js")'
            - run: npm test

    # The whole suite again, with Oracle. Oracle has few suites of its own to run alone: most of its tests are the
    # shared suites, which run on each configured store (allStores(), sqlStores()) beside the graph engines.
    oracle:
        name: test (Oracle)
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            # The Oracle image and the other four leave the runner short of disk: drop toolchains Drivine doesn't use.
            - name: Free disk space
              run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            # Pulled here and not by the test setup, so the pull isn't counted against the container's startup
            # timeout. The image is the one DrivineTestContainers names.
            - name: Pull the Oracle image
              run: docker pull gvenzl/oracle-free:23-faststart
            - run: npm test
              env:
                  ORACLE_TESTS: true
