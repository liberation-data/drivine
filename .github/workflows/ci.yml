# Lints, builds and tests Drivine on every push to master and every pull request. The tests run on test containers
# (see TEST_CONTAINERS.md): Neo4j, Memgraph, FalkorDB and Postgres. Oracle, whose image is large, runs in a job of its
# own with ORACLE_TESTS=true. A local `npm test` leaves it out unless you set that, and says so. release.yml calls it
# as the gate before a release, unless a push or pull_request run of it has already passed on the same tree.
name: CI

on:
    push:
        branches: [master]
    pull_request:
    workflow_call:
    # Each night on the latest images, without the pin below, so an engine's new release shows up here and not in a
    # pull request's run.
    schedule:
        - cron: '17 4 * * *'

# FalkorDB is held at a release that passes: a pull request's run takes falkordb/falkordb:6.0.3. The nightly run takes
# ghcr.io/falkordb/falkordb:latest, FalkorDB's newest release, and not the falkordb/falkordb:latest DrivineTestContainers
# names: Docker Hub's latest is whichever release FalkorDB pushed last, and that can be an older line's backport, as
# v4.22.3 took it after 6.0.3 (no =~, FalkorDB/FalkorDB#3551). Drop the nightly's ghcr.io image once Docker Hub's
# latest follows FalkorDB's newest line again; move the pin, or drop it, once the nightly passes.
env:
    FALKORDB_TEST_IMAGE: ${{ github.event_name == 'schedule' && 'ghcr.io/falkordb/falkordb:latest' || 'falkordb/falkordb:6.0.3' }}

jobs:
    # Records the git tree this run tests, as an artifact named ci-tree-<tree>, so a release of the same tree can trust
    # this run and skip its gate (scripts/ci-trust.js). It matters on a pull request, which tests its merge ref, not the
    # head commit the run names. It has no condition, as no job here may: release.yml trusts a run only when every job
    # in it passed, and a job skipped by a condition doesn't.
    tree:
        name: record the tree
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Work out the tree
              id: tree
              run: |
                  tree=$(git rev-parse 'HEAD^{tree}')
                  echo "tree=$tree" >> "$GITHUB_OUTPUT"
                  echo "$tree $(git rev-parse HEAD)" > ci-tree.txt
                  echo "This run tests tree $tree, of commit $(git rev-parse HEAD)." >> "$GITHUB_STEP_SUMMARY"
            # Overwritten when the run is re-run, as an artifact's name is unique within a run.
            - uses: actions/upload-artifact@v7
              with:
                  name: ci-tree-${{ steps.tree.outputs.tree }}
                  path: ci-tree.txt
                  if-no-files-found: error
                  overwrite: true

    # The Cypher spec's copies in test/cypher are the tag VERSION names, unchanged, and a later tag is shown as a
    # warning.
    cypher-spec:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Check the Cypher spec
              run: scripts/check-cypher-spec.sh

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run lint:ci
            - run: npm run build
            - name: The built package loads
              run: node -e 'require("./dist/index.js"); require("./dist/testing/index.js")'
            - run: npm test

    # The whole suite again, with Oracle. Oracle has few suites of its own to run alone: most of its tests are the
    # shared suites, which run on each configured store (allStores(), sqlStores()) beside the graph engines.
    oracle:
        name: test (Oracle)
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            # The Oracle image and the other four leave the runner short of disk: drop toolchains Drivine doesn't use.
            - name: Free disk space
              run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            # Pulled here and not by the test setup, so the pull isn't counted against the container's startup
            # timeout. The image is the one DrivineTestContainers names.
            - name: Pull the Oracle image
              run: docker pull gvenzl/oracle-free:23-faststart
            - run: npm test
              env:
                  ORACLE_TESTS: true
