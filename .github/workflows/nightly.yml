# Each night, the full CI on master: every suite, the nightly ones a pull request leaves out among them (NIGHTLY in
# test/run-tests.ts), on every store, and on the engines' latest images, so that an engine's new release shows up here
# and not in a pull request's run. At 17:00 UTC, 03:00 in Brisbane. FalkorDB is the exception: ci.yml holds it at 6.0.3
# in every run, this one too, for #717, so a red nightly means something new. falkordb-canary runs FalkorDB's newest
# release beside it, on the FalkorDB tests alone, and never fails the nightly: once it passes, the pin can go.
#
# A failure opens an issue labelled `nightly`, or comments on the one open, naming the failed jobs, their failing
# tests, and the commits since the last nightly that passed, among which is the one that broke it. A pass closes it.
# A run on a branch other than master writes what it would say to its summary instead.
#
# compiler-bench compares the shared Cypher compiler's warm compile and each store's first compile with the last
# nightly's on master that passed (scripts/bench-regression.js), and fails when a store's warm median or first compile
# rose by more than half, in a run and its rerun.
# Its numbers are the run's `compiler-bench` artifact, which the next night compares with. A slowdown that is accepted
# never passes that, so run the nightly by hand with `record-bench` to record that night's numbers without comparing.
name: Nightly

on:
    schedule:
        - cron: '0 17 * * *'
    workflow_dispatch:
        inputs:
            record-bench:
                description: Record the compiler bench's numbers as the next baseline, without comparing them with the last nightly's.
                type: boolean
                default: false

# Read only, so the tests run with a token that can't write to the repository; the report job asks for what it needs.
permissions:
    contents: read

jobs:
    ci:
        uses: ./.github/workflows/ci.yml
        with:
            full: true

    # The bench at its default runs and rounds, against the last nightly's numbers: see scripts/bench-regression.js.
    # Without them (the first night, theirs have expired, or a run by hand with `record-bench`), it records tonight's and
    # passes.
    compiler-bench:
        name: compiler bench against the last nightly
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            actions: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run build
            - name: Find the last nightly's numbers
              id: last
              env:
                  GH_TOKEN: ${{ github.token }}
                  RECORD: ${{ inputs.record-bench }}
              run: |
                  if [ "$RECORD" = true ]; then
                      echo "Run with record-bench: tonight's numbers are recorded, and not compared with the last nightly's."
                      exit 0
                  fi
                  run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nightly.yml/runs?branch=master&status=success&per_page=1" \
                      -q '.workflow_runs[0].id // empty')
                  found=0
                  if [ -n "$run" ]; then
                      found=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?name=compiler-bench" \
                          -q '[.artifacts[] | select(.expired | not)] | length')
                  fi
                  if [ "$found" -gt 0 ]; then
                      echo "run=$run" >> "$GITHUB_OUTPUT"
                  else
                      echo "No numbers left by a nightly that passed on master${run:+: the last, run $run, has none}."
                  fi
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              if: steps.last.outputs.run != ''
              with:
                  name: compiler-bench
                  path: last-nightly
                  run-id: ${{ steps.last.outputs.run }}
                  github-token: ${{ github.token }}
            - name: Bench the compiler against the last nightly
              run: node scripts/bench-regression.js last-nightly/compiler-bench.json compiler-bench.json
            # Not uploaded when it failed, so a regression is compared with the same numbers again until a nightly passes.
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: compiler-bench
                  path: compiler-bench.json
                  if-no-files-found: error
                  # Overwritten when the run is re-run, as an artifact's name is unique within a run.
                  overwrite: true

    # FalkorDB's newest release on the tests that run on FalkorDB (DRIVINE_TEST_PART=falkordb, test/run-tests.ts),
    # as ci.yml holds FalkorDB at 6.0.3 for #717. It takes ghcr.io's latest and not Docker Hub's: Docker Hub's is
    # whichever release FalkorDB pushed last, and that was once an older line's backport, v4.22.3 after 6.0.3, which has
    # no =~ (FalkorDB/FalkorDB#3551), while ghcr.io's is FalkorDB's newest release.
    #
    # It never fails the nightly: the tests' step continues on error, so the job passes whatever they concluded, and the
    # report doesn't wait for it, count it or list it. What they concluded is in the job's summary and an annotation on
    # the run, with the image's digest: a pass is the sign that a FalkorDB release has fixed #717 and ci.yml's pin can
    # go; a failure of #717's test alone is the bug still there; any other failure is a new break to look at before the
    # pin goes.
    falkordb-canary:
        name: FalkorDB latest canary
        runs-on: ubuntu-latest
        timeout-minutes: 30
        # Only for a step before the tests, such as npm ci, failing, which the tests' step can't cover.
        continue-on-error: true
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - name: Test on FalkorDB latest
              id: test
              continue-on-error: true
              # Short of the job's 30, so a test that hangs ends here, as a failure, and the summary still says so.
              timeout-minutes: 20
              env:
                  FALKORDB_TEST_IMAGE: ghcr.io/falkordb/falkordb:latest
                  DRIVINE_TEST_PART: falkordb
              run: |
                  set -o pipefail
                  npm test 2>&1 | tee falkordb-canary.log
            - name: Say how FalkorDB latest did
              if: always()
              env:
                  OUTCOME: ${{ steps.test.outcome }}
              run: |
                  # The digest npm test prints for each container (#702): "FALKORDB: <image> is <digest>".
                  ran=$(grep -m1 '^FALKORDB: ' falkordb-canary.log 2> /dev/null | sed 's/^FALKORDB: .* is //' || true)
                  image="FalkorDB latest (${ran:-no digest, as no container started})"
                  # Jest's line for each failed test, as the report job reads them.
                  failing=$(sed -E 's/\x1b\[[0-9;]*m//g' falkordb-canary.log 2> /dev/null | grep -E '^  ● ' |
                      grep -v '● Console' | awk '!seen[$0]++' | head -40 || true)
                  test717='StatelessGraphObjectManager saves on FALKORDB › should save a nested view, with its own relationships'
                  if [ "$OUTCOME" = success ]; then
                      level=notice
                      line="$image passes every FalkorDB test: the 6.0.3 pin in ci.yml can go (drivine#717)."
                  elif [ "$OUTCOME" != failure ]; then
                      level=warning
                      line="The canary's tests concluded $OUTCOME: a step before them failed, or the run was cancelled."
                  elif [ -z "$failing" ]; then
                      level=warning
                      line="$image fails with no failing test in its log: before the tests, or at one that hangs past the step's 20 minutes; the step's log says where."
                  elif grep -qxF "  ● $test717" <<< "$failing"; then
                      level=warning
                      others=$(grep -cvxF "  ● $test717" <<< "$failing" || true)
                      line="$image still fails drivine#717's test, so ci.yml keeps FalkorDB at 6.0.3."
                      [ "$others" -eq 0 ] || line="$line It fails $others other test(s) too, below: new breaks to look at."
                  else
                      level=warning
                      line="$image fails, but not drivine#717's test: a new break, to look at before the 6.0.3 pin goes."
                  fi
                  echo "::$level title=FalkorDB latest canary::$line"
                  {
                      echo "$line"
                      [ -z "$failing" ] || printf '\n```\n%s\n```\n' "$failing"
                  } >> "$GITHUB_STEP_SUMMARY"

    report:
        # Not the canary, which says how it did in its own summary and never fails the nightly.
        needs: [ci, compiler-bench]
        if: always()
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
            issues: write
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: Open, update or close the nightly issue
              env:
                  GH_TOKEN: ${{ github.token }}
                  # Failed when either failed, then cancelled when either was.
                  RESULT: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
                  EVENT: ${{ github.event_name }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  POST: ${{ github.ref == 'refs/heads/master' }}
              run: |
                  repo="$GITHUB_REPOSITORY"
                  open=$(gh issue list --repo "$repo" --label nightly --state open --json number -q '.[0].number')
                  # Writes to the issue on master, and to the summary alone elsewhere. An issue's body or comment holds
                  # 65,536 characters at most, and GitHub refuses a longer one, so the issue gets the first 60,000, and the
                  # summary the whole report.
                  post() {
                      echo "$1"
                      echo "$1" >> "$GITHUB_STEP_SUMMARY"
                      [ "$POST" = true ] || return 0
                      local text=$1
                      if [ "${#text}" -gt 60000 ]; then
                          text="${text:0:60000}"$'\n\n'"Cut short, as an issue holds 65,536 characters: the run's summary has the whole report, $RUN_URL"
                      fi
                      if [ "$2" = close ]; then
                          gh issue close "$open" --repo "$repo" --comment "$text"
                      elif [ -n "$open" ]; then
                          gh issue comment "$open" --repo "$repo" --body "$text"
                      else
                          gh label create nightly --repo "$repo" --color B60205 --description "The nightly CI failed" 2> /dev/null || true
                          gh issue create --repo "$repo" --label nightly --title "Nightly CI fails" --body "$text"
                      fi
                  }
                  # A run cancelled by hand says nothing of the tree. A scheduled run is never cancelled by hand, and a job
                  # past its timeout-minutes can conclude cancelled, so there a cancelled run or job is a hanging test: a
                  # failure.
                  [ "$RESULT" != cancelled ] || [ "$EVENT" = schedule ] || exit 0
                  picked='.conclusion == "failure" or .conclusion == "timed_out"'
                  [ "$EVENT" != schedule ] || picked="$picked or .conclusion == \"cancelled\""
                  if [ "$RESULT" = success ]; then
                      [ -z "$open" ] || post "The nightly passed again on $GITHUB_SHA: $RUN_URL" close
                      exit 0
                  fi
                  body=$(mktemp)
                  {
                      echo "The nightly on $GITHUB_SHA concluded $RESULT: $RUN_URL"
                      echo
                      # Never the canary, whatever it concluded: it doesn't fail the nightly.
                      gh api --paginate "repos/$repo/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
                          -q ".jobs[] | select(.name != \"FalkorDB latest canary\") | select($picked) | \"\\(.id)\\t\\(.name)\\t\\(.conclusion)\\t\\(.html_url)\"" |
                          while IFS=$'\t' read -r id name conclusion url; do
                              if [ "$conclusion" = cancelled ]; then
                                  echo "### [$name]($url), cancelled or timed out"
                              else
                                  echo "### [$name]($url)"
                              fi
                              echo
                              # Jest's lines for a failed suite and each failed test, and the compiler bench's for a
                              # regression or its load over budget, without the log's timestamps.
                              failing=$(gh api --allow-escape-sequences "repos/$repo/actions/jobs/$id/logs" |
                                  sed -E 's/^[^ ]+ //; s/\x1b\[[0-9;]*m//g' | grep -E '^(FAIL |  ● |\*\*(Regressed|Over budget):\*\*)' |
                                  grep -v '● Console' | awk '!seen[$0]++' | head -40 || true)
                              if [ -n "$failing" ]; then
                                  printf '```\n%s\n```\n' "$failing"
                              elif [ "$conclusion" = cancelled ]; then
                                  echo "No failing test in its log: it was stopped before jest's summary, at a test that hangs or past its time."
                              else
                                  echo "No failing test in its log: it failed in a step around the tests, or waits for jobs above."
                              fi
                              echo
                          done
                      green=$(gh api "repos/$repo/actions/workflows/nightly.yml/runs?branch=master&status=success&per_page=1" \
                          -q '.workflow_runs[0].head_sha // empty')
                      if [ -n "$green" ] && git cat-file -e "$green^{commit}" 2> /dev/null; then
                          echo "### Commits since the last nightly that passed, on $green"
                          echo
                          git log --format='- %h %s (%an)' "$green..$GITHUB_SHA"
                          [ -n "$(git log --format=%h "$green..$GITHUB_SHA")" ] || echo "None: the same commit passed before, so look at the images and the runners."
                      else
                          echo "No nightly has passed on master yet, so there are no commits to compare with."
                      fi
                  } > "$body"
                  post "$(cat "$body")"
