# Builds the website (website/) and publishes it to GitHub Pages. Its docs are generated from the docs/ of this
# repository, drivine-python and drivine4j (or their READMEs, where they have none), so it also runs daily, to pick up
# the other two's changes. A pull request that touches the site or what it is built from builds it, and checks the dev
# server, without publishing it.
name: Website

on:
    push:
        branches: [master]
        paths: ['website/**', 'docs/**', 'README.md', 'src/**', 'package.json', 'package-lock.json', 'tsconfig.json', '.github/workflows/website.yml']
    pull_request:
        paths: ['website/**', 'docs/**', 'README.md', 'src/**', 'package.json', 'package-lock.json', 'tsconfig.json', '.github/workflows/website.yml']
    schedule:
        - cron: '17 3 * * *'
    workflow_dispatch:

permissions:
    contents: read

# One publish at a time, never cut short; a pull request's build is cut short by its next push.
concurrency:
    group: ${{ github.event_name == 'pull_request' && format('website-{0}', github.ref) || 'pages' }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      website/package-lock.json
            # The playground is bundled from Drivine's own source and packages (scripts/bundle-playground.mjs).
            - run: npm ci
            - run: npm ci
              working-directory: website
            # The build cuts the video into HLS segments with ffmpeg (scripts/segment-video.mjs), where the runner lacks it.
            - name: Install ffmpeg
              run: command -v ffmpeg || { sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg; }
            - run: npm run build
              working-directory: website
              env:
                  # For the repositories' star counts and the docs/ listings, without the anonymous API's rate limit.
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            # The dev server serves the playground as the built site does (astro.config.mjs).
            - run: npm run check:dev
              working-directory: website
            - if: github.event_name != 'pull_request'
              uses: actions/upload-pages-artifact@v5
              with:
                  path: website/dist

    deploy:
        if: github.event_name != 'pull_request'
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5
