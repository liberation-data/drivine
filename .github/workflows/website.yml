# Builds the website (website/) and publishes it to GitHub Pages. Its docs are generated from the docs/ of this
# repository, drivine-python and drivine4j (or their READMEs, where they have none), so it also runs daily, to pick up
# the other two's changes.
name: Website

on:
    push:
        branches: [master]
        paths: ['website/**', 'docs/**', 'README.md', '.github/workflows/website.yml']
    schedule:
        - cron: '17 3 * * *'
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: website/package-lock.json
            - run: npm ci
              working-directory: website
            - run: npm run build
              working-directory: website
              env:
                  # For the repositories' star counts and the docs/ listings, without the anonymous API's rate limit.
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - uses: actions/upload-pages-artifact@v5
              with:
                  path: website/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5
