# The Cypher spec's cases of liberation-data/drivine-cypher-spec#42 (v0.17.0), copied unchanged, for drivine#497, and
# drivine4j's own cases of the same (liberation-data/drivine4j#503) that the spec does not hold. Drivine runs the spec at
# v0.14.0 until #495 and #496 are ported, which v0.15.0's and v0.16.0's cases need; this file goes when it moves to
# v0.17.0 or later. Each case runs as the spec's do: the queries over queries.yaml's graph, the writes from an empty one.
queries:
  - name: "A null in a map and a missing key are one null"
    description: "A map's or a list's null, written or given, and a key or an item that is missing are the same null: grouped as one, kept once by DISTINCT and UNION, and tied in an order."
    steps:
      - note: "On the SQL stores a map's null is JSON's null, and a missing key SQL's: they are grouped, kept distinct and sorted as one."
        cypher: "UNWIND [{a: null}, {b: 1}] AS x RETURN x.a, count(*)"
        only: [neo4j, sql]
        rows: [[null, 2]]
      - cypher: "UNWIND [{a: null}, {b: 1}, {a: 1}] AS x RETURN x.a AS a, count(*) AS c ORDER BY a"
        only: [neo4j, sql]
        rows: [[1, 1], [null, 2]]
      - cypher: "UNWIND [{a: null}, {b: 1}] AS x WITH x.a AS a, count(*) AS c RETURN a, c"
        only: [neo4j, sql]
        rows: [[null, 2]]
      - cypher: "UNWIND [{a: null}, {b: 1}] AS x WITH x.a AS a RETURN a, count(*) AS c"
        only: [neo4j, sql]
        rows: [[null, 2]]
      - cypher: "UNWIND [{a: null}, {b: 1}] AS x RETURN x['a'] AS a, count(*) AS c"
        only: [neo4j, sql]
        rows: [[null, 2]]
      - cypher: "UNWIND [{a: {b: null}}, {a: {}}] AS x RETURN x.a.b AS v, count(*) AS c"
        only: [neo4j, sql]
        rows: [[null, 2]]
      - cypher: "UNWIND [[null], []] AS l RETURN l[0] AS v, count(*) AS c"
        only: [neo4j, sql]
        rows: [[null, 2]]
      - cypher: "UNWIND [{a: null}, {b: 1}, {c: 2}] AS x RETURN CASE WHEN x.c IS NULL THEN x.a ELSE null END AS v, count(*) AS c"
        only: [neo4j, sql]
        rows: [[null, 3]]
      - cypher: "UNWIND [{a: null}, {b: 1}] AS x WITH collect(x) AS xs UNWIND xs AS y RETURN y.a AS a, count(*) AS c"
        only: [neo4j, sql]
        rows: [[null, 2]]
      - cypher: "UNWIND $p AS x RETURN x.a AS a, count(*) AS c"
        only: [neo4j, sql]
        parameters: {p: [{a: null}, {b: 1}]}
        rows: [[null, 2]]
      - cypher: "UNWIND [{b: 1}, $p] AS x RETURN x.a AS a, count(*) AS c"
        only: [neo4j, sql]
        parameters: {p: {a: null}}
        rows: [[null, 2]]
      - cypher: "UNWIND [{a: null}, {b: 1}] AS x RETURN x.a = $p AS e, x.a AS a, count(*) AS c"
        only: [neo4j, sql]
        parameters: {p: null}
        rows: [[null, null, 2]]
      - note: "DISTINCT keeps the one null once."
        cypher: "UNWIND [{a: null}, {b: 1}] AS x RETURN DISTINCT x.a"
        only: [neo4j, sql]
        rows: [null]
      - cypher: "UNWIND [{a: null}, {b: 1}] AS x WITH DISTINCT x.a AS a RETURN count(*)"
        only: [neo4j, sql]
        rows: [1]
      - cypher: "UNWIND $p AS x RETURN DISTINCT x.a AS a"
        only: [neo4j, sql]
        parameters: {p: [{a: null}, {b: 1}]}
        rows: [null]
      - note: "So does UNION."
        cypher: "UNWIND [{a: null}] AS x RETURN x.a AS v UNION UNWIND [{b: 1}] AS x RETURN x.a AS v"
        only: [neo4j, sql]
        rows: [null]
      - cypher: "UNWIND [{b: 1}] AS x RETURN x.a AS v UNION RETURN $p.a AS v"
        only: [neo4j, sql]
        parameters: {p: {a: null}}
        rows: [null]
      - cypher: "UNWIND [{b: 1}] AS x RETURN x.a AS v UNION RETURN $p[0] AS v"
        only: [neo4j, sql]
        parameters: {p: [null, 1]}
        rows: [null]
      - cypher: "UNWIND [{b: 1}] AS x RETURN x.a AS v UNION RETURN null AS v"
        only: [neo4j, sql]
        rows: [null]
      - cypher: "UNWIND [null] AS v RETURN v UNION MATCH (p:Person {name: 'Keanu'}) RETURN p.nickname AS v"
        only: [neo4j, sql]
        rows: [null]
      - cypher: "RETURN $p.a AS a UNION RETURN $q.a AS a"
        only: [neo4j, sql]
        parameters: {p: {a: null}, q: {}}
        rows: [null]
      - note: "A null written is the same null as a property a node has not."
        cypher: "MATCH (p:Person) RETURN CASE WHEN p.born > 1960 THEN p.nickname ELSE null END AS v, count(*) AS c"
        only: [neo4j, sql]
        rows: [[null, 4]]
      - cypher: "MATCH (p:Person) RETURN DISTINCT CASE WHEN p.born > 1960 THEN null END AS v"
        only: [neo4j, sql]
        rows: [null]
      - cypher: "MATCH (p:Person) WITH p ORDER BY CASE WHEN p.born > 1964 THEN null ELSE p.nickname END, p.name DESC RETURN collect(p.name) AS l"
        only: [neo4j, sql]
        rows: [["Laurence", "Keanu", "Hugo", "Carrie"]]
      - cypher: "UNWIND [1, null] AS v WITH v RETURN CASE WHEN v = 1 THEN {}.a ELSE v END AS w, count(*) AS c"
        only: [neo4j, sql]
        rows: [[null, 2]]
      - cypher: "UNWIND [{a: null}, {b: 1}] AS x RETURN reduce(s = null, t IN [1] | x.a) AS v, count(*) AS c"
        only: [neo4j, sql]
        rows: [[null, 2]]
      - note: "An order ties them, so the next term decides."
        cypher: "UNWIND [{a: null, i: 1}, {b: 1, i: 2}, {a: 0, i: 3}] AS x RETURN x.i AS i ORDER BY x.a, x.i DESC"
        only: [neo4j, sql]
        rows: [3, 2, 1]
      - cypher: "UNWIND [{a: null, i: 1}, {b: 1, i: 2}, {a: 0, i: 3}] AS x RETURN x.i AS i ORDER BY x.a DESC, x.i DESC"
        only: [neo4j, sql]
        rows: [2, 1, 3]
      - cypher: "UNWIND [{a: null, i: 1}, {b: 1, i: 2}, {a: 0, i: 3}] AS x WITH x ORDER BY x.a, x.i DESC RETURN collect(x.i) AS l"
        only: [neo4j, sql]
        rows: [[3, 2, 1]]
      - note: "count(DISTINCT), collect(DISTINCT), = and IN read the one null as null already."
        cypher: "UNWIND [{a: null, k: 1}, {b: 1, k: 1}] AS x RETURN x.k AS k, collect(DISTINCT x.a) AS l, count(DISTINCT x.a) AS n"
        only: [neo4j, sql]
        rows: [[1, [], 0]]
      - cypher: "UNWIND [{a: null}, {b: 1}] AS x UNWIND [{a: null}, {b: 1}] AS y RETURN x.a = y.a AS e, x.a <> y.a AS ne, count(*) AS n"
        only: [neo4j, sql]
        rows: [[null, null, 4]]
      - cypher: "UNWIND [{a: null}, {a: 2}] AS x RETURN x.a IN [1] AS i, x.a IN [null] AS j, x.a IN [2, null] AS k, x.a = 1 AS e ORDER BY e"
        only: [neo4j, sql]
        rows: [[false, null, true, false], [null, null, null, null]]

  - name: "A null in a map and a missing key are one null, beyond the spec"
    description: "drivine4j's CypherQueryContract cases of #500 that the spec does not hold. The rows are Neo4j's (2026.10)."
    steps:
      - note: "A UNION in a CALL, and a part beside a CALL's UNION ALL, which leaves the part's rows compared."
        cypher: "CALL { UNWIND [{a: null}] AS x RETURN x.a AS v UNION UNWIND [{b: 1}] AS x RETURN x.a AS v } RETURN v, count(*) AS c"
        rows: [[null, 1]]
      - cypher: "CALL { RETURN null AS v UNION RETURN {}.a AS v } RETURN v, count(*) AS c"
        rows: [[null, 1]]
      - cypher: "UNWIND [{a: null}] AS x CALL { RETURN 1 AS z UNION ALL RETURN 2 AS z } RETURN x.a AS v UNION UNWIND [{b: 1}] AS x RETURN x.a AS v"
        rows: [null]
      - note: "An order ties a value kept distinct, which on Oracle may be JSON's null still."
        cypher: "UNWIND [{a: null, i: 1}, {b: 1, i: 2}, {a: 0, i: 3}] AS x WITH DISTINCT x.a AS a, x.i AS i RETURN i ORDER BY a, i DESC"
        rows: [3, 2, 1]
      - note: "A value kept distinct, on Oracle JSON's null, is still the same null as a property a node has not."
        cypher: "UNWIND [{a: null}] AS x WITH DISTINCT x.a AS a RETURN a AS v UNION MATCH (p:Person {name: 'Hugo'}) RETURN p.nickname AS v"
        rows: [null]
      - cypher: "UNWIND [{a: null}, {b: 1}] AS x WITH DISTINCT x.a AS a MATCH (p:Person) RETURN CASE WHEN p.born IS NULL THEN p.nickname ELSE a END AS v, count(*) AS c"
        rows: [[null, 4]]
      - note: "Grouped by a value of an unwound list that holds a null, and sorted by it."
        cypher: "UNWIND [null, 1, null] AS v RETURN v, count(*) AS c ORDER BY v"
        rows: [[1, 1], [null, 2]]
      - note: "A grouped or kept null comes back as null, not as JSON's null or its text."
        cypher: "UNWIND [{a: null}, {b: 1}] AS x WITH x.a AS a, count(*) AS c RETURN {a: a, c: c} AS m"
        rows: [{a: null, c: 2}]
      - cypher: "UNWIND [{a: null}, {a: null}] AS x WITH DISTINCT x.a AS a RETURN [a, a IS NULL] AS l"
        rows: [[null, true]]

writes:
  - name: "A null in a written row and a missing key are one null"
    description: "A write's rows, read after it, group a map's null and a missing key as one null, and keep it once by DISTINCT."
    steps:
      - cypher: "UNWIND $rows AS r CREATE (:CyWrite {b: 9}) RETURN r.a AS a, count(*) AS c"
        only: [neo4j, sql]
        parameters: {rows: [{a: null}, {b: 1}]}
        rows: [[null, 2]]
      - cypher: "UNWIND [{a: null}, {b: 1}] AS r CREATE (:CyWrite {b: 9}) WITH r RETURN DISTINCT r.a AS a"
        only: [neo4j, sql]
        rows: [null]
      - cypher: "MATCH (n:CyWrite) RETURN n.b AS b, count(*) AS c"
        only: [neo4j, sql]
        rows: [[9, 4]]

  - name: "A null in a written row and a missing key are one null, beyond the spec"
    description: "drivine4j's CypherWriteContract case of #500 that the spec does not hold. The rows are Neo4j's (2026.10)."
    steps:
      - cypher: "UNWIND [{a: 1}, {a: 1}] AS r CREATE (:CyWrite {b: 9}) RETURN r.a AS a, count(*) AS c"
        rows: [[1, 2]]
