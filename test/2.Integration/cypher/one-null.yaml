# drivine4j's own cases of liberation-data/drivine#497 (liberation-data/drivine4j#503) that the Cypher spec does not
# hold, and Drivine's own beside them, for what this port does its own way. The spec's own cases of it
# (liberation-data/drivine-cypher-spec#42, v0.17.0) run from test/cypher. Each case runs as the spec's do: the queries
# over queries.yaml's graph, the writes from an empty one.
queries:
  - name: "A null in a map and a missing key are one null, beyond the spec"
    description: "drivine4j's CypherQueryContract cases of #500 that the spec does not hold. The rows are Neo4j's (2026.10)."
    steps:
      - note: "A UNION in a CALL, and a part beside a CALL's UNION ALL, which leaves the part's rows compared."
        cypher: "CALL { UNWIND [{a: null}] AS x RETURN x.a AS v UNION UNWIND [{b: 1}] AS x RETURN x.a AS v } RETURN v, count(*) AS c"
        rows: [[null, 1]]
      - cypher: "CALL { RETURN null AS v UNION RETURN {}.a AS v } RETURN v, count(*) AS c"
        rows: [[null, 1]]
      - cypher: "UNWIND [{a: null}] AS x CALL { RETURN 1 AS z UNION ALL RETURN 2 AS z } RETURN x.a AS v UNION UNWIND [{b: 1}] AS x RETURN x.a AS v"
        rows: [null]
      - note: "An order ties a value kept distinct, which on Oracle may be JSON's null still."
        cypher: "UNWIND [{a: null, i: 1}, {b: 1, i: 2}, {a: 0, i: 3}] AS x WITH DISTINCT x.a AS a, x.i AS i RETURN i ORDER BY a, i DESC"
        rows: [3, 2, 1]
      - note: "A value kept distinct, on Oracle JSON's null, is still the same null as a property a node has not."
        cypher: "UNWIND [{a: null}] AS x WITH DISTINCT x.a AS a RETURN a AS v UNION MATCH (p:Person {name: 'Hugo'}) RETURN p.nickname AS v"
        rows: [null]
      - cypher: "UNWIND [{a: null}, {b: 1}] AS x WITH DISTINCT x.a AS a MATCH (p:Person) RETURN CASE WHEN p.born IS NULL THEN p.nickname ELSE a END AS v, count(*) AS c"
        rows: [[null, 4]]
      - note: "Grouped by a value of an unwound list that holds a null, and sorted by it."
        cypher: "UNWIND [null, 1, null] AS v RETURN v, count(*) AS c ORDER BY v"
        rows: [[1, 1], [null, 2]]
      - note: "A grouped or kept null comes back as null, not as JSON's null or its text."
        cypher: "UNWIND [{a: null}, {b: 1}] AS x WITH x.a AS a, count(*) AS c RETURN {a: a, c: c} AS m"
        rows: [{a: null, c: 2}]
      - cypher: "UNWIND [{a: null}, {a: null}] AS x WITH DISTINCT x.a AS a RETURN [a, a IS NULL] AS l"
        rows: [[null, true]]

  - name: "A null in a map and a missing key are one null, in Drivine's own cases"
    description: "Cases neither the spec nor drivine4j holds, for what this port does its own way. The rows are Neo4j's (2026.10)."
    steps:
      - note: "A CALL's UNION ALL gives a value that may be JSON's null where any query's may be, not only the first's."
        cypher: "CALL { RETURN {}.a AS v UNION ALL RETURN [null][0] AS v } RETURN DISTINCT v"
        rows: [null]
      - cypher: "CALL { RETURN 1 AS v UNION ALL RETURN [null][0] AS v UNION ALL RETURN {}.a AS v } RETURN v, count(*) AS c ORDER BY v"
        rows: [[1, 1], [null, 2]]
      - cypher: "CALL { RETURN {}.a AS v UNION ALL RETURN [null][0] AS v } RETURN v UNION RETURN {}.a AS v"
        rows: [null]
      - note: "A subquery's UNION compares its queries' rows with the two nulls as one."
        cypher: "UNWIND [{a: null}] AS x RETURN COUNT { RETURN x.a AS v UNION RETURN {}.a AS v } AS n"
        rows: [1]
      - note: "head(), last(), a parameter's entry by its key, and a parameter that is null."
        cypher: "UNWIND [[null], []] AS l RETURN head(l) AS h, last(l) AS t, count(*) AS c"
        rows: [[null, null, 2]]
      - cypher: "RETURN $p['a'] AS a UNION RETURN $q.a AS a"
        parameters: {p: {a: null}, q: {}}
        rows: [null]
      - cypher: "UNWIND [{b: 1}, {b: 2}] AS x RETURN CASE WHEN x.b = 1 THEN $p ELSE x.a END AS v, count(*) AS c"
        parameters: {p: null}
        rows: [[null, 2]]

writes:
  - name: "A null in a written row and a missing key are one null, beyond the spec"
    description: "drivine4j's CypherWriteContract case of #500 that the spec does not hold. The rows are Neo4j's (2026.10)."
    steps:
      - cypher: "UNWIND [{a: 1}, {a: 1}] AS r CREATE (:CyWrite {b: 9}) RETURN r.a AS a, count(*) AS c"
        rows: [[1, 2]]
