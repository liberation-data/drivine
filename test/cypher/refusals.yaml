        error: "A relationship variable bound before its pattern is Cypher, and is not compiled to SQL yet."
      - cypher: "MATCH ()-[r1]->()-[r2]->() WITH [r1, r2] AS rs LIMIT 1 RETURN [(first)-[rs*]->(second) | labels(second)] AS c"
        error: "A relationship variable bound before its pattern is Cypher, and is not compiled to SQL yet."
      - note: "Bound by a walk before, in a MATCH of its own or the same one."
        cypher: "MATCH ()-[rs*]->() MATCH (first)-[rs*]->(second) RETURN labels(first), labels(second)"
