  - name: "Variable a write makes, read inside a pattern or a comprehension in its properties"
    description: "A variable a CREATE or a MERGE makes, named at any depth inside a pattern, a pattern comprehension, a list comprehension, a quantifier, reduce() or a subquery in its own properties, where Neo4j 2026.10.1 does not refuse it (see \"Values a write makes, by position and form\" for 42N29 and 42I58), is refused as not compiled yet: Neo4j reads such a name as a variable bound anew there and stores the row it gives (its rows are in each note), and compiled, the SQL stores read it as the node made (liberation-data/drivine4j#814)."
    steps:
      - note: "CREATE, a node made alone; a pattern comprehension naming a variable the clause makes: Neo4j stores [[\"a\", 3], [\"b\", 3], [\"c\", 3], [\"d\", 3]]."
        cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'x'}), (m:CyMade {f: size([(a)-[:NEXT]->(x) | x])}) RETURN [n.id, m.f] ORDER BY n.id"
        error: "A variable a CREATE or a MERGE makes, read inside a pattern or a comprehension in its own properties, is Cypher, and is not compiled to SQL yet."
