  - name: "Pattern or subquery in the properties of a CREATE or a MERGE"
    description: "A pattern, a pattern comprehension, EXISTS { } or COUNT { }, at any depth, in the properties of any node or relationship a CREATE or a MERGE makes, within a FOREACH too, is refused as not compiled yet, whatever it reads (liberation-data/drivine4j#814): Neo4j 2026.10.1 reads a CREATE's before it writes any of its rows, and a MERGE's after it makes the node or the relationship, where a SQL store reads each a row at a time, before it writes it (see \"When a write reads its own properties\"). Each note gives the rows Neo4j stores, each from the graph of writevalues.yaml; the steps were writes.yaml's, under the case each note names. Where Neo4j refuses it, its own refusal comes first. The value worked out in a WITH before the write is compiled (see writes.yaml, \"Work a read out in a WITH before the write\")."
    steps:
      - note: "Pattern or subquery in the properties a CREATE or a MERGE makes: Neo4j stores [[\"a\", true, 2], [\"b\", true, 1], [\"c\", false, 0], [\"d\", false, 0]]."
        cypher: "MATCH (n:CyWrite) CREATE (m:CyMade {id: n.id, e: EXISTS { (n)-->() }, c: COUNT { (n)-->() }}) RETURN [m.id, m.e, m.c] ORDER BY m.id"
