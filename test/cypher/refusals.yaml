  - name: "Pattern in the properties of a node made alone"
    description: "A pattern in the properties of a node a CREATE or a MERGE makes with no relationship, (m {f: NOT (n)-->()}), that names a variable bound before it, is refused, as Neo4j 2026.10.1 refuses it (its 42N59, \"Variable `n` already declared\"), which reads it as declaring the variable again: as a condition or as a value, and a pattern comprehension's pattern or a pattern in its WHERE. A variable a comprehension around it binds is bound before it too. Compiled, it was stored (liberation-data/drivine4j#814). Neo4j takes a pattern of new variables alone, EXISTS { … } and COUNT { … } in a CREATE, a relationship's properties, a node of a pattern with a relationship, and the same within a FOREACH (the steps of writes.yaml that pinned it are now in \"Pattern or subquery in the properties of a CREATE or a MERGE\", where the SQL stores refuse them). A MERGE refuses a subquery first: see \"Subquery in a MERGE\"."
    steps:
      - note: "Bare, as a value, where Neo4j reads it as declaring n again before it is a value (drivine4j#714's capture)."
        cypher: "MATCH (n:Person) CREATE (m {f: (n)-->()})"
        error: "Variable `n` already declared, as in Neo4j: a pattern in the properties of a node that a CREATE or a MERGE makes with no relationship names no variable bound before it. Work the value out in a WITH before, as in WITH n, EXISTS { (n)-->() } AS f CREATE (m {f: f})."
      - cypher: "MATCH (n:Person) MERGE (m {f: (n)-->()})"
        error: "Variable `n` already declared, as in Neo4j: a pattern in the properties of a node that a CREATE or a MERGE makes with no relationship names no variable bound before it. Work the value out in a WITH before, as in WITH n, EXISTS { (n)-->() } AS f CREATE (m {f: f})."
      - note: "As a condition: under NOT, OR, a searched CASE's WHEN, a comprehension's or a quantifier's WHERE."
        cypher: "MATCH (n:Person) CREATE (m {f: NOT (n)-->()})"
        error: "Variable `n` already declared, as in Neo4j: a pattern in the properties of a node that a CREATE or a MERGE makes with no relationship names no variable bound before it. Work the value out in a WITH before, as in WITH n, EXISTS { (n)-->() } AS f CREATE (m {f: f})."
      - cypher: "MATCH (n:Person) MERGE (m {f: NOT (n)-->()})"
        error: "Variable `n` already declared, as in Neo4j: a pattern in the properties of a node that a CREATE or a MERGE makes with no relationship names no variable bound before it. Work the value out in a WITH before, as in WITH n, EXISTS { (n)-->() } AS f CREATE (m {f: f})."
      - cypher: "MATCH (n:Person) CREATE (m {f: NOT (n)-->(:Movie)})"
        error: "Variable `n` already declared, as in Neo4j: a pattern in the properties of a node that a CREATE or a MERGE makes with no relationship names no variable bound before it. Work the value out in a WITH before, as in WITH n, EXISTS { (n)-->() } AS f CREATE (m {f: f})."
      - cypher: "MATCH (n:Person) CREATE (m {f: (n)-->() OR true})"
        error: "Variable `n` already declared, as in Neo4j: a pattern in the properties of a node that a CREATE or a MERGE makes with no relationship names no variable bound before it. Work the value out in a WITH before, as in WITH n, EXISTS { (n)-->() } AS f CREATE (m {f: f})."
      - cypher: "MATCH (n:Person) CREATE (m {f: CASE WHEN (n)-->() THEN 1 ELSE 0 END})"
        error: "Variable `n` already declared, as in Neo4j: a pattern in the properties of a node that a CREATE or a MERGE makes with no relationship names no variable bound before it. Work the value out in a WITH before, as in WITH n, EXISTS { (n)-->() } AS f CREATE (m {f: f})."
      - cypher: "MATCH (n:Person) CREATE (m {f: [x IN [1] WHERE (n)-->()]})"
        error: "Variable `n` already declared, as in Neo4j: a pattern in the properties of a node that a CREATE or a MERGE makes with no relationship names no variable bound before it. Work the value out in a WITH before, as in WITH n, EXISTS { (n)-->() } AS f CREATE (m {f: f})."
      - cypher: "MATCH (n:Person) CREATE (m {f: any(x IN [1] WHERE (n)-->())})"
        error: "Variable `n` already declared, as in Neo4j: a pattern in the properties of a node that a CREATE or a MERGE makes with no relationship names no variable bound before it. Work the value out in a WITH before, as in WITH n, EXISTS { (n)-->() } AS f CREATE (m {f: f})."
      - note: "A pattern comprehension's pattern, and a pattern in its WHERE."
        cypher: "MATCH (n:Person) CREATE (m {f: size([(n)-->(x) | x])})"
        error: "Variable `n` already declared, as in Neo4j: a pattern in the properties of a node that a CREATE or a MERGE makes with no relationship names no variable bound before it. Work the value out in a WITH before, as in WITH n, EXISTS { (n)-->() } AS f CREATE (m {f: f})."
      - cypher: "MATCH (n:Person) MERGE (m {f: size([(n)-->(x) | x])})"
        error: "Variable `n` already declared, as in Neo4j: a pattern in the properties of a node that a CREATE or a MERGE makes with no relationship names no variable bound before it. Work the value out in a WITH before, as in WITH n, EXISTS { (n)-->() } AS f CREATE (m {f: f})."
      - cypher: "MATCH (n:Person) CREATE (m {f: [()-->(x) WHERE (n)-->() | x.name]})"
        error: "Variable `n` already declared, as in Neo4j: a pattern in the properties of a node that a CREATE or a MERGE makes with no relationship names no variable bound before it. Work the value out in a WITH before, as in WITH n, EXISTS { (n)-->() } AS f CREATE (m {f: f})."
      - note: "A comprehension's own variable is bound before the pattern too."
        cypher: "MATCH (n:Person) CREATE (m {f: [x IN [n] WHERE (x)-->() | 1]})"
        error: "Variable `x` already declared, as in Neo4j: a pattern in the properties of a node that a CREATE or a MERGE makes with no relationship names no variable bound before it. Work the value out in a WITH before, as in WITH n, EXISTS { (n)-->() } AS f CREATE (m {f: f})."
      - cypher: "MATCH (n:Person) CREATE (m {f: [(x)-->() WHERE (x)-->() | 1]})"
        error: "Variable `x` already declared, as in Neo4j: a pattern in the properties of a node that a CREATE or a MERGE makes with no relationship names no variable bound before it. Work the value out in a WITH before, as in WITH n, EXISTS { (n)-->() } AS f CREATE (m {f: f})."
      - note: "A relationship, and a variable a WITH binds."
        cypher: "MATCH (n:Person)-[r]->() CREATE (m {f: NOT ()-[r]->()})"
        error: "Variable `r` already declared, as in Neo4j: a pattern in the properties of a node that a CREATE or a MERGE makes with no relationship names no variable bound before it. Work the value out in a WITH before, as in WITH n, EXISTS { (n)-->() } AS f CREATE (m {f: f})."
      - cypher: "MATCH (n:Person) WITH n AS k CREATE (m {f: NOT (k)-->()})"
        error: "Variable `k` already declared, as in Neo4j: a pattern in the properties of a node that a CREATE or a MERGE makes with no relationship names no variable bound before it. Work the value out in a WITH before, as in WITH n, EXISTS { (n)-->() } AS f CREATE (m {f: f})."
      - note: "A node of a CREATE's patterns that is alone in its pattern."
        cypher: "MATCH (n:Person) CREATE (n)-[:R]->(x), (m {f: NOT (n)-->()})"
        error: "Variable `n` already declared, as in Neo4j: a pattern in the properties of a node that a CREATE or a MERGE makes with no relationship names no variable bound before it. Work the value out in a WITH before, as in WITH n, EXISTS { (n)-->() } AS f CREATE (m {f: f})."
      - cypher: "MATCH (n:Person) CREATE (m {f: NOT (n)-->()}), (x)-[:R]->(y)"
        error: "Variable `n` already declared, as in Neo4j: a pattern in the properties of a node that a CREATE or a MERGE makes with no relationship names no variable bound before it. Work the value out in a WITH before, as in WITH n, EXISTS { (n)-->() } AS f CREATE (m {f: f})."

  - name: "Subquery in a MERGE"
    description: "A MERGE holds no subquery, as Neo4j 2026.10.1 has it (its 42I48, \"Subqueries are not allowed in a MERGE clause\"): no EXISTS { … } or COUNT { … } in a property it matches or makes, a node's or a relationship's, and no pattern, pattern comprehension, EXISTS { … } or COUNT { … } in a value its ON CREATE or ON MATCH SETs. Neo4j refuses this before any other reason the MERGE has. Compiled, it was stored (liberation-data/drivine4j#814). A SET after the MERGE takes them (see writes.yaml, \"SET and MERGE with EXISTS { } over UNWIND\"), and Neo4j takes a pattern or a pattern comprehension in a property a MERGE makes, a node's or a relationship's, which the SQL stores refuse as not compiled yet (see \"Pattern or subquery in the properties of a CREATE or a MERGE\")."
    steps:
      - note: "EXISTS { … } and COUNT { … } in a property a MERGE matches, a node's or a relationship's."
        cypher: "MATCH (n:Person) MERGE (m {f: EXISTS { (n)-->() }})"
        error: "Subqueries are not allowed in a MERGE clause, as in Neo4j: no EXISTS { … } or COUNT { … } in what it matches, and no pattern, pattern comprehension or subquery in its ON CREATE or ON MATCH SET. Work the value out in a WITH before the MERGE, or SET it after."
      - cypher: "MATCH (n:Person) MERGE (m {f: EXISTS { MATCH (n)-->() }})"
        error: "Subqueries are not allowed in a MERGE clause, as in Neo4j: no EXISTS { … } or COUNT { … } in what it matches, and no pattern, pattern comprehension or subquery in its ON CREATE or ON MATCH SET. Work the value out in a WITH before the MERGE, or SET it after."
      - cypher: "MATCH (n:Person) MERGE (m {f: COUNT { (n)-->() }})"
        error: "Subqueries are not allowed in a MERGE clause, as in Neo4j: no EXISTS { … } or COUNT { … } in what it matches, and no pattern, pattern comprehension or subquery in its ON CREATE or ON MATCH SET. Work the value out in a WITH before the MERGE, or SET it after."
