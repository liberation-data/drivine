        error: "Creating an entity (a) and referencing that entity in a property definition in the same CREATE is not allowed, as in Neo4j: only reference variables created in earlier clauses. Make it in a clause before, or SET the property after."
      - note: "CREATE, a node made alone; pattern > pattern comprehension > EXISTS: Neo4j's 42N29."
        cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'x'}), (m:CyMade {f: (z)-[:NEXT]->() AND (size([(n)-[:NEXT]->(q) WHERE EXISTS { MATCH (n)-[:NEXT]->(q) WHERE q.id = 'b' } | q]) > 0)}) RETURN [n.id, m.f] ORDER BY n.id"
