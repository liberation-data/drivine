      - cypher: "MATCH (n:Person) RETURN ((n)-[:KNOWS]->()) IS NULL AS p ORDER BY n.name"
        error: "A pattern expression can only be used to test the existence of a pattern, as in Neo4j: as a condition, as in a WHERE. Use a pattern comprehension instead, as in [(a)-->(b) | b], or EXISTS { … } or COUNT { … }."
