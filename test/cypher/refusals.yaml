# Cypher each SQL store's compiler refuses before the store is sent anything, and the message it gives.
# Compiled with no store: a step here has an error and no rows. See README.md.

cases:
  - name: "Unbound parameter"
    description: "A parameter the statement uses but the caller didn't bind is refused, in a read or a write."
    steps:
      - cypher: "MATCH (n) WHERE n.a = $x RETURN n"
        error: "The statement has a parameter $x, and no value is bound to it."
      - cypher: "CREATE (n {a: $x})"
        error: "The statement has a parameter $x, and no value is bound to it."

  - name: "Fractional SKIP"
    description: "SKIP and LIMIT take a whole number."
    steps:
      - cypher: "MATCH (n) RETURN n SKIP 1.5"
        error: "SKIP and LIMIT take a whole number, not 1.5."

  - name: "SKIP or LIMIT that isn't a whole number of 0 or more"
    description: "SKIP and LIMIT take a whole number of 0 or more, written or bound to a parameter, as Neo4j does. A negative one bound to a parameter was taken as no SKIP or LIMIT, and a float bound to one was cut to a whole number (liberation-data/drivine4j#420). Neo4j 2026.10.1 refuses each of these."
    steps:
      - cypher: "UNWIND [1, 2, 3] AS x RETURN x SKIP -1"
        error: "SKIP and LIMIT take a whole number of 0 or more, not -1, as in Neo4j."
      - cypher: "UNWIND [1, 2, 3] AS x RETURN x LIMIT -1"
        error: "SKIP and LIMIT take a whole number of 0 or more, not -1, as in Neo4j."
      - cypher: "UNWIND [1, 2, 3] AS x RETURN x SKIP $s"
        parameters: {s: -1}
        error: "SKIP and LIMIT take a whole number of 0 or more, and $s is -1, as in Neo4j."
      - cypher: "UNWIND [1, 2, 3] AS x RETURN x LIMIT $s"
        parameters: {s: -1}
        error: "SKIP and LIMIT take a whole number of 0 or more, and $s is -1, as in Neo4j."
      - cypher: "UNWIND [1, 2, 3] AS x RETURN x LIMIT $s"
        parameters: {s: 1.5}
        error: "SKIP and LIMIT take a whole number of 0 or more, and $s is 1.5, as in Neo4j."
      - note: "A whole float too, as Neo4j refuses it."
        cypher: "UNWIND [1, 2, 3] AS x RETURN x LIMIT $s"
        parameters: {s: 2.0}
        error: "SKIP and LIMIT take a whole number of 0 or more, and $s is 2.0, as in Neo4j."
      - cypher: "UNWIND [1, 2, 3] AS x RETURN x LIMIT $s"
        parameters: {s: "2"}
        error: "SKIP and LIMIT take a whole number of 0 or more, and $s is a text, as in Neo4j."
      - cypher: "UNWIND [1, 2, 3] AS x RETURN x LIMIT $s"
        parameters: {s: null}
        error: "SKIP and LIMIT take a whole number of 0 or more, and $s is null, as in Neo4j."

  - name: "Arithmetic of a value that isn't a number"
    description: "-, *, /, % and ^ take numbers, and -, * and / temporal values where the store takes them (see temporal.yaml). Where a side is a text, a truth value, a list or a map the statement writes, makes or binds, the statement is refused, as Neo4j refuses it; it gave null (liberation-data/drivine4j#420). + takes numbers, texts, lists and temporal values too, and puts a truth value together with a text or a list alone (queries.yaml's \"A truth value put together with a text or a list\"): where a side is a truth value the statement writes, makes or binds (a condition among them), and the other a number, a truth value, a map or a temporal value, or a side is a map and the other a number, the statement is refused, where it gave null (liberation-data/drivine-cypher-spec#341); so is a map beside a text or a temporal value, either side, and * or / of a temporal value other than a duration (liberation-data/drivine-cypher-spec#345). Neo4j 2026.10.1 refuses each of the -, *, /, % and ^, and Neo4j 2026.10.2 each of the + and true - 1, and each of #345's: Type mismatch: expected String or List<T> but was Integer, and so on. A side whose kind is left open is compiled as before, but for a truth value read beside a number, which fails the statement as it runs (queries.yaml's \"A truth value put together with a text or a list\")."
    steps:
      - cypher: "RETURN 'a' - 1"
        error: "- takes numbers, not a text, as in Neo4j."
      - cypher: "RETURN 'a' * 2"
        error: "* takes numbers, not a text, as in Neo4j."
      - cypher: "RETURN 2 / 'a'"
        error: "/ takes numbers, not a text, as in Neo4j."
      - cypher: "RETURN 'a' ^ 2"
        error: "^ takes numbers, not a text, as in Neo4j."
      - cypher: "RETURN [1] % 2"
        error: "% takes numbers, not a list, as in Neo4j."
      - cypher: "RETURN true % 2"
        error: "% takes numbers, not a truth value, as in Neo4j."
      - cypher: "RETURN {a: 1} - 1"
        error: "- takes numbers, not a map, as in Neo4j."
      - cypher: "WITH 'a' AS s RETURN s % 2"
        error: "% takes numbers, not a text, as in Neo4j."
      - cypher: "RETURN $s % 2"
        parameters: {s: "a"}
        error: "% takes numbers, not a text, as in Neo4j."
      - cypher: "RETURN true - 1"
        error: "- takes numbers, not a truth value, as in Neo4j."
      - cypher: "RETURN true + 1"
        error: "+ of a truth value takes a text or a list, not an integer, as in Neo4j."
      - cypher: "RETURN 1 + true"
        error: "+ of a truth value takes a text or a list, not an integer, as in Neo4j."
      - cypher: "RETURN true + true"
        error: "+ of a truth value takes a text or a list, not a truth value, as in Neo4j."
      - cypher: "RETURN true + 1.5"
        error: "+ of a truth value takes a text or a list, not a float, as in Neo4j."
      - cypher: "RETURN $b + 1"
        parameters: {b: true}
        error: "+ of a truth value takes a text or a list, not an integer, as in Neo4j."
      - cypher: "WITH true AS b RETURN b + 1"
        error: "+ of a truth value takes a text or a list, not an integer, as in Neo4j."
      - cypher: "UNWIND [true, false] AS b RETURN b + 1"
        error: "+ of a truth value takes a text or a list, not an integer, as in Neo4j."
      - note: "A condition is a truth value."
        cypher: "RETURN (1 > 0) + 1"
        error: "+ of a truth value takes a text or a list, not an integer, as in Neo4j."
      - note: "It gave null on SQLite, and so did the date of it."
        cypher: "RETURN toString(date(true + 1))"
        error: "+ of a truth value takes a text or a list, not an integer, as in Neo4j."
      - cypher: "RETURN date('2024-01-01') + true"
        error: "+ of a truth value takes a text or a list, not a temporal value, as in Neo4j."
      - cypher: "RETURN {a: 1} + 1"
        error: "+ of a map takes a map or a list, not an integer, as in Neo4j."
      - cypher: "RETURN {a: 1} + 'a'"
        error: "+ of a map takes a map or a list, not a text, as in Neo4j."
      - cypher: "RETURN 'a' + {a: 1}"
        error: "+ of a map takes a map or a list, not a text, as in Neo4j."
      - cypher: "RETURN {a: 1} + date('2024-01-01')"
        error: "+ of a map takes a map or a list, not a temporal value, as in Neo4j."
      - cypher: "RETURN date('2024-01-01') + {a: 1}"
        error: "+ of a map takes a map or a list, not a temporal value, as in Neo4j."
      - cypher: "RETURN {a: 1} + duration('P1D')"
        error: "+ of a map takes a map or a list, not a temporal value, as in Neo4j."
      - cypher: "RETURN duration('P1D') + {a: 1}"
        error: "+ of a map takes a map or a list, not a temporal value, as in Neo4j."
      - cypher: "RETURN $m + 'a'"
        parameters: {m: {a: 1}}
        error: "+ of a map takes a map or a list, not a text, as in Neo4j."
      - cypher: "UNWIND [{a: 1}] AS m RETURN m + 'a'"
        error: "+ of a map takes a map or a list, not a text, as in Neo4j."
      - cypher: "UNWIND [{a: 1}] AS m RETURN m + 1"
        error: "+ of a map takes a map or a list, not an integer, as in Neo4j."
      - cypher: "UNWIND [{a: 1}] AS m RETURN m - 1"
        error: "- takes numbers, not a map, as in Neo4j."
      - cypher: "UNWIND [true] AS b RETURN b - 1"
        error: "- takes numbers, not a truth value, as in Neo4j."
      - cypher: "UNWIND [true] AS b RETURN b * 2"
        error: "* takes numbers, not a truth value, as in Neo4j."
      - cypher: "UNWIND [true] AS b RETURN b / 2"
        error: "/ takes numbers, not a truth value, as in Neo4j."
      - cypher: "UNWIND [true] AS b RETURN 1 + b"
        error: "+ of a truth value takes a text or a list, not an integer, as in Neo4j."
      - cypher: "UNWIND ['a'] AS b RETURN b - 1"
        error: "- takes numbers, not a text, as in Neo4j."
      - note: "A text put together with a number is a text, which - takes no more than any other."
        cypher: "RETURN ('a' + 1) - 1"
        error: "- takes numbers, not a text, as in Neo4j."
      - cypher: "RETURN date('2024-01-01') * 2"
        error: "* takes numbers or a duration, not a date, as in Neo4j."
      - cypher: "UNWIND [date('2024-01-01')] AS b RETURN b * 2"
        error: "* takes numbers or a duration, not a date, as in Neo4j."
      - cypher: "RETURN localtime('12:00') / 2"
        error: "/ takes numbers or a duration, not a localtime, as in Neo4j."

  - name: "toBoolean() of a list, a map or a float"
    description: "toBoolean() takes a truth value, an integer or a text, and Neo4j refuses another kind it knows: of a list or a map it gave null, and of a float a truth value (liberation-data/drivine4j#420). Neo4j 2026.10.1 refuses each of these."
    steps:
      - cypher: "RETURN toBoolean([])"
        error: "toBoolean() takes a truth value, an integer or a text, not a list, as in Neo4j."
      - cypher: "RETURN toBoolean({a: 1})"
        error: "toBoolean() takes a truth value, an integer or a text, not a map, as in Neo4j."
      - cypher: "RETURN toBoolean(1.5)"
        error: "toBoolean() takes a truth value, an integer or a text, not a float, as in Neo4j."
      - cypher: "RETURN toBoolean($l)"
        parameters: {l: []}
        error: "toBoolean() takes a truth value, an integer or a text, not a list, as in Neo4j."

  - name: "toInteger(), toFloat() or toBoolean() of a node or a relationship"
    description: "toInteger(), toFloat() and toBoolean() of a node or a relationship are refused, as Neo4j refuses them when it plans the statement, even over no rows; they gave null, of its properties (liberation-data/drivine4j#420). Neo4j 2026.10.1 refuses each of these: Type mismatch: expected Boolean, Float, Integer or String but was Node, and so on."
    steps:
      - cypher: "MATCH (n) RETURN toInteger(n)"
        error: "toInteger() takes a truth value, an integer, a float or a text, not a node, as in Neo4j."
      - cypher: "MATCH (n) RETURN toFloat(n)"
        error: "toFloat() takes an integer, a float or a text, not a node, as in Neo4j."
      - cypher: "MATCH (n) RETURN toBoolean(n)"
        error: "toBoolean() takes a truth value, an integer or a text, not a node, as in Neo4j."
      - cypher: "MATCH ()-[r]->() RETURN toInteger(r)"
        error: "toInteger() takes a truth value, an integer, a float or a text, not a relationship, as in Neo4j."
      - cypher: "MATCH ()-[r]->() RETURN toFloat(r)"
        error: "toFloat() takes an integer, a float or a text, not a relationship, as in Neo4j."
      - cypher: "MATCH ()-[r]->() RETURN toBoolean(r)"
        error: "toBoolean() takes a truth value, an integer or a text, not a relationship, as in Neo4j."

  - name: "Arithmetic of the variable of a quantifier, a list comprehension or reduce() over a list written of one kind that isn't a number"
    description: "The variable of none(), any(), all(), single(), a list comprehension or reduce() over a list the statement writes, each of whose items is of one known kind, is of that kind, as Neo4j types it, so arithmetic of it is refused as arithmetic of that kind is (reduce()'s accumulator is left open); it gave null (liberation-data/drivine4j#420). The first four are openCypher's TCK Quantifier1 to Quantifier4, scenarios 15 and 16, which Neo4j refuses when it plans them. A list of items of two kinds, an empty list, a list holding a value whose kind is left open (a parameter, a property, a node) and a list given as a parameter are compiled as before."
    steps:
      - cypher: "RETURN none(x IN ['Clara'] WHERE x % 2 = 0) AS result"
        error: "% takes numbers, not a text, as in Neo4j."
      - cypher: "RETURN any(x IN [false, true] WHERE x % 2 = 0) AS result"
        error: "% takes numbers, not a truth value, as in Neo4j."
      - cypher: "RETURN all(x IN ['Clara', 'Bob', 'Dave', 'Alice'] WHERE x % 2 = 0) AS result"
        error: "% takes numbers, not a text, as in Neo4j."
      - cypher: "RETURN single(x IN [{a: 1}] WHERE x % 2 = 0) AS result"
        error: "% takes numbers, not a map, as in Neo4j."
      - cypher: "RETURN [x IN ['a'] | x % 2] AS result"
        error: "% takes numbers, not a text, as in Neo4j."
      - cypher: "RETURN [x IN [[1], [2]] WHERE x - 1 > 0] AS result"
        error: "- takes numbers, not a list, as in Neo4j."
      - cypher: "RETURN reduce(a = 0, x IN ['a'] | a + x % 2) AS result"
        error: "% takes numbers, not a text, as in Neo4j."

  - name: "toInteger() of a map, and toFloat() of a truth value, a list or a map"
    description: "Neo4j documents toInteger() as taking a truth value, an integer, a float or a text, and toFloat() an integer, a float or a text, and refuses a map, and for toFloat() a truth value or a list, when it plans the statement. Where the statement writes or makes the argument as one, the statement is refused; it gave null (liberation-data/drivine4j#420). toInteger(true) is 1, as Neo4j gives it. A list given to toInteger() Neo4j plans, and refuses only as the row is read, so it is compiled to fail each row (see queries.yaml's \"toInteger() of a list\"); a parameter or a property, whose kind is left open here, is compiled as before; a node or a relationship is refused (above)."
    steps:
      - cypher: "RETURN toInteger({})"
        error: "toInteger() takes a truth value, an integer, a float or a text, not a map, as in Neo4j."
      - cypher: "RETURN toFloat(true)"
        error: "toFloat() takes an integer, a float or a text, not a truth value, as in Neo4j."
      - cypher: "RETURN toFloat({})"
        error: "toFloat() takes an integer, a float or a text, not a map, as in Neo4j."
      - cypher: "WITH {a: 1} AS m RETURN toInteger(m)"
        error: "toInteger() takes a truth value, an integer, a float or a text, not a map, as in Neo4j."
      - cypher: "RETURN toFloat([])"
        error: "toFloat() takes an integer, a float or a text, not a list, as in Neo4j."
      - cypher: "WITH [1] AS l RETURN toFloat(l)"
        error: "toFloat() takes an integer, a float or a text, not a list, as in Neo4j."
      - cypher: "RETURN [x IN [[1]] | toFloat(x)]"
        error: "toFloat() takes an integer, a float or a text, not a list, as in Neo4j."

  - name: "Value used as the wrong kind"
    description: "Using a value as something it isn't (a number as a node, a path's property) is refused."
    steps:
      - cypher: "UNWIND [1] AS x MATCH (x)-->() RETURN x"
        error: "x is not a node, and is used as one in a pattern."
      - cypher: "UNWIND [1] AS x CREATE (x)-[:R]->()"
        error: "x is not a node, and is used as one in a pattern."
      - cypher: "UNWIND [1] AS x RETURN labels(x)"
        error: "labels() takes a node."
      - cypher: "MATCH (n) WHERE n RETURN n"
        error: "A node, a relationship or a path is not a condition."
      - cypher: "MATCH p = (a)-->(b) RETURN p.x"
        error: "A path has no properties."
      - cypher: "MATCH (n) RETURN length(n)"
        error: "length() takes a path."

  - name: "Temporal text that is no such value"
    description: "A temporal value written as text that isn't one, or of a kind there's no function for, is refused."
    steps:
      - cypher: "RETURN date('hello')"
        error: "'hello' is no date."
      - cypher: "RETURN datetime('2024-03-15T10:30:00[Europe/Paris]')"
        error: "'2024-03-15T10:30:00[Europe/Paris]' is no datetime."
      - cypher: "RETURN duration('1 day')"
        error: "'1 day' is no duration."

  - name: "The current moment in a time zone not compiled yet"
    description: "date.statement() and the rest, given a zone the compiler can't read where the statement compiles, are refused rather than given as null (drivine4j#425)."
    steps:
      - note: "A zone by name, which no store's text holds yet."
        cypher: "RETURN date.statement('Europe/Stockholm')"
        error: "The time zone 'Europe/Stockholm' is Cypher, and is not compiled to SQL yet."
      - cypher: "RETURN datetime.transaction('nowhere')"
        error: "'nowhere' is no time zone."
      - note: "A zone an expression gives, which would give null in place of the moment where it is no zone."
        cypher: "WITH '+01:00' AS z RETURN date.statement(z)"
        error: "date.statement() of a time zone an expression gives is Cypher, and is not compiled to SQL yet."
      - cypher: "RETURN localtime.realtime(1)"
        error: "localtime.realtime() takes a time zone, a text, or nothing."
      - cypher: "RETURN time.statement($z)"
        parameters: {z: 1}
        error: "time.statement() takes a time zone, a text, or nothing."
      - cypher: "RETURN datetime.statement('Z', 'Z')"
        error: "datetime.statement() takes a time zone, or nothing."

  - name: "An offset with seconds, or a zone that is no offset, not compiled yet"
    description: "An offset with seconds, which no store's text or Oracle's TIMESTAMP WITH TIME ZONE holds, and a zone by name are refused where a statement writes them or a parameter gives them, in a text or a map, rather than given as null; a text that is no zone is refused as none (drivine4j#424)."
    steps:
      - cypher: "RETURN time({hour: 12, timezone: '+02:05:59'})"
        error: "The offset with seconds '+02:05:59' is Cypher, and is not compiled to SQL yet."
      - cypher: "RETURN datetime({datetime: datetime('2024-03-15T10:00Z'), timezone: '-01:30:15'})"
        error: "The offset with seconds '-01:30:15' is Cypher, and is not compiled to SQL yet."
      - cypher: "RETURN time('12:34:56+02:05:59')"
        error: "The offset with seconds '+02:05:59' is Cypher, and is not compiled to SQL yet."
      - cypher: "RETURN datetime({year: 2024, month: 1, day: 1, timezone: $z})"
        parameters: {z: "+02:05:59"}
        error: "The offset with seconds '+02:05:59' is Cypher, and is not compiled to SQL yet."
      - cypher: "RETURN datetime({year: 2024, month: 1, day: 1, timezone: $z})"
        parameters: {z: "Europe/Stockholm"}
        error: "The time zone 'Europe/Stockholm' is Cypher, and is not compiled to SQL yet."
      - cypher: "RETURN datetime({datetime: datetime('2024-03-15T10:00Z'), timezone: $z})"
        parameters: {z: "Europe/Stockholm"}
        error: "The time zone 'Europe/Stockholm' is Cypher, and is not compiled to SQL yet."
      - note: "A text that is no zone, which gave null."
        cypher: "RETURN datetime({year: 2024, month: 1, day: 1, timezone: 'nowhere'})"
        error: "'nowhere' is no time zone."
      - cypher: "RETURN datetime({year: 2024, month: 1, day: 1, timezone: $z})"
        parameters: {z: 1}
        error: "datetime() takes a time zone, not 1."
      - note: "And one written, which gave null."
        cypher: "RETURN datetime({year: 2024, month: 1, day: 1, timezone: 1})"
        error: "datetime() takes a time zone, not 1."

  - name: "A field of the time beside none of the one above it"
    description: "A map of a moment's fields that gives a minute without an hour, a second without a minute, or a millisecond, a microsecond or a nanosecond without a second is refused, as Neo4j refuses it (\"subsecond cannot be specified without minute\"); the SQL stores made it with the missing field at 0 (drivine-cypher-spec#321)."
    steps:
      - cypher: "RETURN datetime({year: 1984, month: 10, day: 11, hour: 12, nanosecond: 1, timezone: '+01:00'})"
        error: "datetime() takes a nanosecond beside a second."
      - cypher: "RETURN localtime({hour: 12, millisecond: 5})"
        error: "localtime() takes a millisecond beside a second."
      - cypher: "RETURN time({hour: 12, second: 5})"
        error: "time() takes a second beside a minute."
      - cypher: "RETURN localdatetime({year: 1984, month: 10, day: 11, minute: 5})"
        error: "localdatetime() takes a minute beside an hour."
      - note: "Of a date by another calendar."
        cypher: "RETURN localdatetime({year: 2024, week: 1, dayOfWeek: 2, hour: 12, nanosecond: 1})"
        error: "localdatetime() takes a nanosecond beside a second."
      - note: "Beside a base, as before."
        cypher: "WITH localdatetime('1984-10-11T12:00') AS o RETURN localdatetime({date: o, hour: 1, microsecond: 1})"
        error: "localdatetime() takes a microsecond beside a second."

  - name: "A temporal value of a map a parameter or an expression gives"
    description: "Neo4j makes a temporal value of a map however it is given, and refuses one of fields it doesn't take as the statement runs (temporal.yaml, \"A temporal value of a map a parameter or an expression gives\"). The SQL stores make one of a map the statement writes in the call; one a parameter gives, or an expression is known to make, is refused, and one only read as the statement runs fails it by name. It gave null (drivine-cypher-spec#328)."
    steps:
      - cypher: "RETURN localtime($m)"
        parameters: {m: {hour: 12, minute: 30}}
        error: "localtime() of a map a parameter or an expression gives is Cypher, and is not compiled to SQL yet."
      - cypher: "RETURN localtime($p.m)"
        parameters: {p: {m: {hour: 12}}}
        error: "localtime() of a map a parameter or an expression gives is Cypher, and is not compiled to SQL yet."
      - cypher: "WITH {hour: 12, minute: 30} AS m RETURN localtime(m)"
        error: "localtime() of a map a parameter or an expression gives is Cypher, and is not compiled to SQL yet."
      - cypher: "UNWIND [{hour: 1}, {hour: 2, minute: 3}] AS m RETURN localtime(m)"
        error: "localtime() of a map a parameter or an expression gives is Cypher, and is not compiled to SQL yet."
      - cypher: "RETURN date($m)"
        parameters: {m: {year: 2024, month: 3, day: 15}}
        error: "date() of a map a parameter or an expression gives is Cypher, and is not compiled to SQL yet."
      - cypher: "WITH {days: 1} AS m RETURN duration(m)"
        error: "duration() of a map a parameter or an expression gives is Cypher, and is not compiled to SQL yet."

  - name: "A temporal value of a list, a number or a truth value"
    description: "Neo4j fails a temporal function of a list, a number or a truth value, as no text and no map of its fields (temporal.yaml, \"A temporal value of a list, a number or a truth value\"). The SQL stores gave null (drivine-cypher-spec#331): one the compiler knows, written, given as a parameter or its key, or arithmetic of such, which is never null, is refused here, by its kind; any other, which may be null, as Neo4j takes, fails it by name as it runs."
    steps:
      - cypher: "RETURN localtime([1])"
        error: "localtime() takes a text or a map of its fields, not a list, as in Neo4j."
      - cypher: "RETURN date([2024, 3, 15])"
        error: "date() takes a text or a map of its fields, not a list, as in Neo4j."
      - cypher: "RETURN datetime([])"
        error: "datetime() takes a text or a map of its fields, not a list, as in Neo4j."
      - cypher: "RETURN date($l)"
        parameters: {l: [2024]}
        error: "date() takes a text or a map of its fields, not a list, as in Neo4j."
      - cypher: "RETURN date(5)"
        error: "date() takes a text or a map of its fields, not an integer, as in Neo4j."
      - cypher: "RETURN localdatetime(-2.5)"
        error: "localdatetime() takes a text or a map of its fields, not a float, as in Neo4j."
      - cypher: "RETURN duration($p.d)"
        parameters: {p: {d: 1}}
        error: "duration() takes a text or a map of its fields, not an integer, as in Neo4j."
      - cypher: "RETURN date(true)"
        error: "date() takes a text or a map of its fields, not a truth value, as in Neo4j."
      - cypher: "RETURN time($b)"
        parameters: {b: false}
        error: "time() takes a text or a map of its fields, not a truth value, as in Neo4j."
      - cypher: "WITH 1 > 0 AS b RETURN localtime(b)"
        error: "localtime() takes a text or a map of its fields, not a truth value, as in Neo4j."

  - name: "Temporal map not compiled yet"
    description: "A temporal value made from a map of fields the compiler doesn't handle yet is refused, naming what it is."
    steps:
      - note: "A zone by name beside another temporal value is refused, not given as null."
        cypher: "RETURN datetime({datetime: localdatetime('2024-03-15T10:00'), timezone: 'Europe/Stockholm'})"
        error: "The time zone 'Europe/Stockholm' is Cypher, and is not compiled to SQL yet."
      - note: "Neo4j makes an ordinal day of no year one of the year 0, which no SQL store's date reaches."
        cypher: "RETURN date({ordinalDay: 2})"
        error: "date() of an ordinal day without a year is Cypher, and is not compiled to SQL yet."
      - note: "A zone by name beside a week, an ordinal day or a quarter is refused, not given as null."
        cypher: "RETURN datetime({year: 1984, week: 10, timezone: 'Europe/Stockholm'})"
        error: "The time zone 'Europe/Stockholm' is Cypher, and is not compiled to SQL yet."
      - note: "And in a map of no calendar fields, so a value made from such a moment, time({time: other}), is refused too."
        cypher: "RETURN datetime({year: 1984, month: 10, day: 11, hour: 12, timezone: 'Europe/Stockholm'})"
        error: "The time zone 'Europe/Stockholm' is Cypher, and is not compiled to SQL yet."
      - cypher: "RETURN duration({day: 1})"
        error: "duration() of a map with day is Cypher, and is not compiled to SQL yet."
      - cypher: "RETURN datetime.truncate('day', date('2024-03-15'), {nanosecond: 2})"
        error: "datetime.truncate() of a map with nanosecond is Cypher, and is not compiled to SQL yet."
      - cypher: "RETURN date.truncate('month', date('2024-03-15'), {week: 2})"
        error: "date.truncate() of a map with week is Cypher, and is not compiled to SQL yet."
      - cypher: "RETURN datetime.truncate('day', date('2024-03-15'), {timezone: 'Europe/Stockholm'})"
        error: "The time zone 'Europe/Stockholm' is Cypher, and is not compiled to SQL yet."
      - cypher: "WITH {day: 2} AS fields RETURN date.truncate('month', date('2024-03-15'), fields)"
        error: "A truncation's fields that an expression gives is Cypher, and is not compiled to SQL yet."
      - cypher: "WITH '+01:00' AS zone RETURN datetime.truncate('day', date('2024-03-15'), {timezone: zone})"
        error: "A truncation to a time zone an expression gives is Cypher, and is not compiled to SQL yet."

  - name: "Temporal map of calendar fields Neo4j does not take"
    description: "A date or a moment made from a map of a week, an ordinal day or a quarter that Neo4j fails on is refused: fields of two calendars, a day of the week or of the quarter without its week or quarter, no year, a number that is not whole or is past its field's range, or such a field of a time of day."
    steps:
      - cypher: "RETURN date({year: 2023, month: 2, week: 3})"
        error: "date() takes a month or a week, not both."
      - cypher: "RETURN date({year: 2023, quarter: 2, day: 5})"
        error: "date() takes a month or a quarter, not both."
      - cypher: "RETURN datetime({year: 2023, week: 2, ordinalDay: 5})"
        error: "datetime() takes a week or an ordinal day, not both."
      - cypher: "RETURN date({year: 2023, ordinalDay: 5, quarter: 1})"
        error: "date() takes an ordinal day or a quarter, not both."
      - cypher: "RETURN date({year: 2023, dayOfWeek: 3})"
        error: "date() takes a day of the week beside a week."
      - cypher: "RETURN localdatetime({year: 2023, dayOfQuarter: 3})"
        error: "localdatetime() takes a day of the quarter beside a quarter."
      - cypher: "RETURN date({week: 2})"
        error: "date() takes a year beside a week."
      - cypher: "RETURN date({quarter: 2})"
        error: "date() takes a year beside a quarter."
      - cypher: "RETURN date({year: 2020, week: 54})"
        error: "date() takes a week from 1 to 53, not 54."
      - cypher: "RETURN date({year: 2020, week: 0})"
        error: "date() takes a week from 1 to 53, not 0."
      - cypher: "RETURN date({year: 2023, week: 2, dayOfWeek: 8})"
        error: "date() takes a day of the week from 1 to 7, not 8."
      - note: "A day of the year runs to the year's last."
        cypher: "RETURN date({year: 2023, ordinalDay: 366})"
        error: "date() takes an ordinal day from 1 to 365 in 2023, not 366."
      - cypher: "RETURN date({year: 2023, ordinalDay: -1})"
        error: "date() takes an ordinal day from 1 to 365 in 2023, not -1."
      - cypher: "RETURN date({year: 2023, quarter: 5})"
        error: "date() takes a quarter from 1 to 4, not 5."
      - note: "A day of the quarter runs to 92 in any quarter."
        cypher: "RETURN date({year: 2024, quarter: 4, dayOfQuarter: 93})"
        error: "date() takes a day of the quarter from 1 to 92, not 93."
      - cypher: "RETURN date({year: 2023, week: 2.5})"
        error: "date() takes a whole number for week, not 2.5."
      - cypher: "RETURN date({year: '2023', quarter: 2})"
        error: "date() takes a whole number for year, not '2023'."
      - cypher: "RETURN localtime({hour: 12, week: 2})"
        error: "localtime() takes no field week."
      - cypher: "RETURN time({hour: 12, ordinalDay: 2})"
        error: "time() takes no field ordinalDay."

  - name: "Temporal map from another temporal value Neo4j does not take"
    description: "A temporal value made from a map with a date, a time or a datetime that Neo4j fails on is refused: a field the kind has none of, a datetime beside a date or a time, a value that is no temporal value or hasn't what it is to give, fields of two calendars, a date that isn't whole beside a value that gives the time, a field of the time without the one above it, a number that isn't whole or is past its field's range, or a time zone it doesn't read."
    steps:
      - cypher: "RETURN date({date: date('2024-03-15'), hour: 3})"
        error: "date() takes no field hour."
      - cypher: "RETURN date({date: date('2024-03-15'), timezone: '+01:00'})"
        error: "date() takes no field timezone."
      - cypher: "RETURN date({datetime: datetime('2024-03-15T10:00Z')})"
        error: "date() takes no field datetime."
      - cypher: "RETURN localtime({date: date('2024-03-15')})"
        error: "localtime() takes no field date."
      - cypher: "RETURN time({datetime: datetime('2024-03-15T10:00Z')})"
        error: "time() takes no field datetime."
      - cypher: "RETURN localtime({time: localtime('10:00'), timezone: '+01:00'})"
        error: "localtime() takes no field timezone."
      - cypher: "RETURN time({time: time('10:00Z'), day: 2})"
        error: "time() takes no field day."
      - cypher: "RETURN localdatetime({datetime: localdatetime('2024-03-15T10:00'), timezone: '+01:00'})"
        error: "localdatetime() takes no field timezone."
      - cypher: "RETURN datetime({date: date('2024-03-15'), foo: 1})"
        error: "datetime() takes no field foo."
      - cypher: "RETURN datetime({date: date('2024-03-15'), datetime: datetime('2020-01-01T10:00Z')})"
        error: "datetime() takes a datetime, or a date and a time, not both."
      - cypher: "RETURN localdatetime({time: localtime('11:00'), datetime: localdatetime('2020-01-01T10:00')})"
        error: "localdatetime() takes a datetime, or a date and a time, not both."
      - cypher: "RETURN date({date: localtime('10:00')})"
        error: "date() takes a date, a localdatetime or a datetime for date, not a localtime."
      - cypher: "RETURN localtime({time: date('2024-03-15')})"
        error: "localtime() takes a localtime, a time, a localdatetime or a datetime for time, not a date."
      - cypher: "RETURN datetime({datetime: date('2024-03-15')})"
        error: "datetime() takes a localdatetime or a datetime for datetime, not a date."
      - cypher: "RETURN date({date: null})"
        error: "date() takes a date, a localdatetime or a datetime for date, not null."
      - cypher: "RETURN date({date: '2024-03-15'})"
        error: "date() takes a date, a localdatetime or a datetime for date, not '2024-03-15'."
      - cypher: "WITH 5 AS x RETURN localtime({time: x})"
        error: "localtime() takes a localtime, a time, a localdatetime or a datetime for time, not an integer."
      - cypher: "RETURN date({date: date('2024-03-15'), month: 2, week: 3})"
        error: "date() takes a month or a week, not both."
      - note: "A day of the week goes alone beside a value that gives the date, but not with a day."
        cypher: "RETURN date({date: date('2024-03-15'), dayOfWeek: 2, day: 3})"
        error: "date() takes a month or a week, not both."
      - note: "Beside a value that gives the time alone, the fields give the whole date."
        cypher: "RETURN localdatetime({year: 2024, month: 3, time: localtime('10:00')})"
        error: "localdatetime() takes a date beside a time: a date, or a year with a month and a day, a week and a day of the week, an ordinal day, or a quarter and a day of the quarter."
      - cypher: "RETURN datetime({year: 2024, week: 3, time: localtime('10:00')})"
        error: "datetime() takes a date beside a time: a date, or a year with a month and a day, a week and a day of the week, an ordinal day, or a quarter and a day of the quarter."
      - cypher: "RETURN datetime({time: localtime('10:00')})"
        error: "datetime() takes a date beside a time: a date, or a year with a month and a day, a week and a day of the week, an ordinal day, or a quarter and a day of the quarter."
      - note: "Beside a value that gives the date alone, a field of the time takes the one above it."
        cypher: "RETURN localdatetime({date: date('2024-03-15'), second: 3})"
        error: "localdatetime() takes a second beside a minute."
      - cypher: "RETURN localdatetime({date: date('2024-03-15'), minute: 3})"
        error: "localdatetime() takes a minute beside an hour."
      - cypher: "RETURN datetime({date: date('2024-03-15'), hour: 5, minute: 3, microsecond: 1})"
        error: "datetime() takes a microsecond beside a second."
      - cypher: "RETURN date({date: date('2024-03-15'), day: 32})"
        error: "date() takes a day from 1 to 31, not 32."
      - cypher: "RETURN date({date: date('2024-03-15'), month: 13})"
        error: "date() takes a month from 1 to 12, not 13."
      - cypher: "RETURN date({date: date('2024-03-15'), week: 54})"
        error: "date() takes a week from 1 to 53, not 54."
      - cypher: "RETURN date({date: date('2024-03-15'), dayOfWeek: 8})"
        error: "date() takes a day of the week from 1 to 7, not 8."
      - cypher: "RETURN date({date: date('2024-03-15'), quarter: 5})"
        error: "date() takes a quarter from 1 to 4, not 5."
      - cypher: "RETURN date({date: date('2024-03-15'), dayOfQuarter: 93})"
        error: "date() takes a day of the quarter from 1 to 92, not 93."
      - cypher: "RETURN localtime({time: localtime('10:00'), hour: 24})"
        error: "localtime() takes an hour from 0 to 23, not 24."
      - cypher: "RETURN localtime({time: localtime('10:00'), second: 60})"
        error: "localtime() takes a second from 0 to 59, not 60."
      - cypher: "RETURN localtime({time: localtime('10:00'), millisecond: 1000})"
        error: "localtime() takes a millisecond from 0 to 999, not 1000."
      - cypher: "RETURN localtime({time: localtime('10:00'), millisecond: 5, microsecond: 1000})"
        error: "localtime() takes a microsecond from 0 to 999 beside a millisecond, not 1000."
      - cypher: "RETURN localtime({time: localtime('10:00'), nanosecond: 1000000000})"
        error: "localtime() takes a nanosecond from 0 to 999999999, not 1000000000."
      - cypher: "RETURN date({date: date('2024-03-15'), year: 2024.5})"
        error: "date() takes a whole number for year, not 2024.5."
      - cypher: "RETURN date({date: date('2024-03-15'), day: '3'})"
        error: "date() takes a whole number for day, not '3'."
      - cypher: "RETURN time({time: time('10:00+01:00'), timezone: null})"
        error: "time() takes a time zone, not null."
      - cypher: "RETURN datetime({date: date('2024-03-15'), time: localtime('10:00'), timezone: 5})"
        error: "datetime() takes a time zone, not 5."
      - cypher: "RETURN time({time: time('10:00+01:00'), timezone: '+0500'})"
        error: "'+0500' is no time zone."

  - name: "Truncation given fields Neo4j does not take"
    description: "A truncation's map of fields that Neo4j fails on is refused: a field of no such value, a day or a month beside a day of the week, a number that is not whole or is past its field's range, or a time zone it does not read."
    steps:
      - cypher: "RETURN date.truncate('day', date('2024-03-15'), {hour: 5})"
        error: "date.truncate() takes no field hour."
      - cypher: "RETURN localdatetime.truncate('day', localdatetime('2024-03-15T10:00'), {timezone: '+05:00'})"
        error: "localdatetime.truncate() takes no field timezone."
      - cypher: "RETURN localtime.truncate('hour', localtime('10:30'), {day: 2})"
        error: "localtime.truncate() takes no field day."
      - cypher: "RETURN date.truncate('day', date('2024-03-15'), {foo: 1})"
        error: "date.truncate() takes no field foo."
      - cypher: "RETURN date.truncate('month', date('2024-03-15'), {day: 2, dayOfWeek: 3})"
        error: "date.truncate() takes a day or a day of the week, not both."
      - note: "A day of the week goes with a year alone, not with a month, though it is null."
        cypher: "RETURN date.truncate('month', date('2024-03-15'), {month: 2, dayOfWeek: 3})"
        error: "date.truncate() takes a month or a day of the week, not both."
      - cypher: "RETURN date.truncate('weekYear', date('2024-03-15'), {dayOfWeek: 2, year: 2000, month: null})"
        error: "date.truncate() takes a month or a day of the week, not both."
      - cypher: "RETURN date.truncate('week', date('2024-03-15'), {dayOfWeek: 9})"
        error: "date.truncate() takes a day of the week from 1 to 7, not 9."
      - note: "A number written past its field's range, which a store would carry into the next field."
        cypher: "RETURN date.truncate('year', date('2017-02-11'), {month: -1})"
        error: "date.truncate() takes a month from 1 to 12, not -1."
      - cypher: "RETURN localtime.truncate('hour', localtime('12:00'), {hour: 24})"
        error: "localtime.truncate() takes an hour from 0 to 23, not 24."
      - cypher: "RETURN localtime.truncate('second', localtime('12:00'), {millisecond: 1000})"
        error: "localtime.truncate() takes a millisecond from 0 to 999, not 1000."
      - cypher: "RETURN localtime.truncate('second', localtime('12:00'), {microsecond: 1000000})"
        error: "localtime.truncate() takes a microsecond from 0 to 999999, not 1000000."
      - note: "Beside a millisecond given, or kept by a cut to the millisecond, a microsecond runs to 999."
        cypher: "RETURN localtime.truncate('second', localtime('12:00'), {millisecond: 5, microsecond: 1000})"
        error: "localtime.truncate() takes a microsecond from 0 to 999 beside a millisecond, not 1000."
      - cypher: "RETURN localtime.truncate('millisecond', localtime('12:00'), {microsecond: 1000})"
        error: "localtime.truncate() takes a microsecond from 0 to 999 beside a millisecond, not 1000."
      - cypher: "RETURN date.truncate('month', date('2024-03-15'), {day: 2.7})"
        error: "date.truncate() takes a whole number for day, not 2.7."
      - cypher: "RETURN date.truncate('month', date('2024-03-15'), {year: '2000'})"
        error: "date.truncate() takes a whole number for year, not '2000'."
      - cypher: "RETURN datetime.truncate('day', date('2024-03-15'), {timezone: '+0500'})"
        error: "'+0500' is no time zone."
      - cypher: "RETURN datetime.truncate('day', date('2024-03-15'), {timezone: 'bogus'})"
        error: "'bogus' is no time zone."
      - cypher: "RETURN datetime.truncate('day', date('2024-03-15'), {timezone: null})"
        error: "datetime.truncate() takes a time zone, not null."

  - name: "Temporal function given the wrong arguments"
    description: "A temporal function given arguments it doesn't take is refused."
    steps:
      - cypher: "RETURN duration()"
        error: "duration() takes a text or a map of its fields."
      - cypher: "RETURN date('2024-03-15', 'x')"
        error: "date() takes a text or a map of its fields."
      - cypher: "RETURN date.truncate('month')"
        error: "date.truncate() takes a unit and a value."
      - cypher: "RETURN date.truncate('month', date('2024-03-15'), {}, {})"
        error: "date.truncate() takes a unit, a value and a map of fields."
      - cypher: "RETURN date.truncate('fortnight', date('2024-03-15'))"
        error: "date.truncate() truncates to millennium, century, decade, year, weekYear, quarter, month, week, day, hour, minute, second, millisecond or microsecond, not fortnight."
      - cypher: "WITH 'month' AS u RETURN date.truncate(u, date('2024-03-15'))"
        error: "A truncation to a unit an expression gives is Cypher, and is not compiled to SQL yet."
      - cypher: "RETURN duration.between(date('2024-03-15'))"
        error: "duration.between() takes two temporal values."

  - name: "Wrong number of arguments"
    description: "A function given the wrong number of arguments is refused."
    steps:
      - cypher: "RETURN toLower('a', 'b')"
        error: "toLower() takes one argument."
      - cypher: "RETURN range(1)"
        error: "range() takes a start, an end and a step."
      - cypher: "RETURN substring('abc')"
        error: "substring() takes a text, a start and a length."
      - cypher: "RETURN replace('abc', 'a')"
        error: "replace() takes a text, what to replace, and what with."
      - note: "Neo4j refuses it too, when it plans the statement."
        cypher: "RETURN coalesce()"
        error: "coalesce() takes at least one argument."

  - name: "Start or length of a text function"
    description: "substring(), left() and right() refuse a float the statement writes or makes, even a whole one, and a given start or length out of range beside a given text."
    steps:
      - cypher: "RETURN left('hello', 2.7)"
        error: "left() takes an integer for its length, not a float, as in Neo4j."
      - cypher: "RETURN right('hello', 2.0)"
        error: "right() takes an integer for its length, not a float, as in Neo4j."
      - cypher: "RETURN substring('hello', -0.5)"
        error: "substring() takes an integer for its start, not a float, as in Neo4j."
      - cypher: "RETURN substring('hello', 1, 2.6)"
        error: "substring() takes an integer for its length, not a float, as in Neo4j."
      - note: "Refused whatever the text, as Neo4j refuses it."
        cypher: "RETURN left(null, 2.7)"
        error: "left() takes an integer for its length, not a float, as in Neo4j."
      - note: "A float the statement makes is refused too, as Neo4j refuses it when it plans the statement: toFloat(), a function that gives a float, arithmetic of numbers with a float side, a CASE of floats, an UNWIND of a list of floats written, and a WITH that binds one."
        cypher: "RETURN left('hello', toFloat(2))"
        error: "left() takes an integer for its length, not a float, as in Neo4j."
      - cypher: "RETURN right('hello', round(2.7))"
        error: "right() takes an integer for its length, not a float, as in Neo4j."
      - cypher: "RETURN left('hello', 1.5 + 1)"
        error: "left() takes an integer for its length, not a float, as in Neo4j."
      - cypher: "RETURN substring('hello', 1, 2 ^ 1)"
        error: "substring() takes an integer for its length, not a float, as in Neo4j."
      - cypher: "RETURN left('hello', CASE WHEN true THEN 2.5 ELSE 1.5 END)"
        error: "left() takes an integer for its length, not a float, as in Neo4j."
      - cypher: "UNWIND [2.7] AS c RETURN left('hello', c)"
        error: "left() takes an integer for its length, not a float, as in Neo4j."
      - cypher: "WITH 2.7 AS c RETURN substring('hello', c)"
        error: "substring() takes an integer for its start, not a float, as in Neo4j."
      - cypher: "WITH toFloat(2) AS c RETURN left(null, c)"
        error: "left() takes an integer for its length, not a float, as in Neo4j."
      - cypher: "RETURN left('hello', -1)"
        error: "left() takes a length from 0 to 2147483647, as in Neo4j."
      - cypher: "RETURN substring('hello', -1, 2)"
        error: "substring() takes a start from 0 to 2147483647, as in Neo4j."
      - cypher: "RETURN substring('hello', 1, 9223372036854775807)"
        error: "substring() takes a length from 0 to 2147483647, as in Neo4j."
      - note: "Bound, a float is cut toward zero first: -1.5 is -1."
        cypher: "RETURN right($t, $n)"
        parameters: {t: "hello", n: -1.5}
        error: "right() takes a length from 0 to 2147483647, as in Neo4j."
      - note: "A negated parameter is negated first, and then cut: -2.7 is -2."
        cypher: "RETURN left($t, -$n)"
        parameters: {t: "hello", n: 2.7}
        error: "left() takes a length from 0 to 2147483647, as in Neo4j."
      - cypher: "RETURN left($t, $n)"
        parameters: {t: "hello", n: 2147483648}
        error: "left() takes a length from 0 to 2147483647, as in Neo4j."

