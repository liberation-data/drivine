  - name: "When a write reads its own properties"
    description: "A read of the graph in the properties a CREATE or a MERGE makes, refused whatever it reads, as Neo4j 2026.10.1 reads it at another moment than a SQL store (liberation-data/drivine4j#814): what the clause writes, of its own type or label, or what it does not, of another type or of any, and what an earlier pattern of the same CREATE makes, in a FOREACH too. Each note gives Neo4j's rows from the graph of writevalues.yaml, and what the SQL stores gave compiled before. Within a FOREACH, a CREATE of one pattern is refused too: what an earlier node of the pattern makes, Neo4j does not read and a SQL store does. A MERGE's node is refused as well: Neo4j works its properties out after it makes the node, so a pattern there counts the node itself, which a SQL store does not; the forms where the two agree are refused all the same. What is compiled is the value worked out in a WITH before the write (see writes.yaml, \"Work a read out in a WITH before the write\")."
    steps:
      - note: "a CREATE reading its own type: Neo4j stores 0 for each row, before it writes any; compiled, the SQL stores gave 0 to 3."
        cypher: "MATCH (n:CyWrite) CREATE (n)-[r:CyR {c: COUNT { ()-[:CyR]->() }}]->(:CyMade) RETURN [n.id, r.c] ORDER BY n.id"
        error: "A pattern or a subquery in the properties a CREATE or a MERGE makes is Cypher, and is not compiled to SQL yet. Work it out in a WITH before the clause."
      - note: "its own label: Neo4j stores [0, 0, 0]; compiled, the SQL stores gave [0, 1, 2]."
        cypher: "UNWIND [1, 2, 3] AS i CREATE (m:CyMade {c: COUNT { (:CyMade) }}) RETURN m.c ORDER BY m.c"
        error: "A pattern or a subquery in the properties a CREATE or a MERGE makes is Cypher, and is not compiled to SQL yet. Work it out in a WITH before the clause."
      - note: "another type, which compiled gives Neo4j's rows, [[\"a\", false], [\"b\", false], [\"c\", true], [\"d\", true]], refused all the same."
        cypher: "MATCH (n:CyWrite) CREATE (n)-[r:CyR {f: NOT (n)-[:NEXT]->()}]->(:CyMade) RETURN [n.id, r.f] ORDER BY n.id"
        error: "A pattern or a subquery in the properties a CREATE or a MERGE makes is Cypher, and is not compiled to SQL yet. Work it out in a WITH before the clause."
      - note: "a MERGE's relationship, untyped: Neo4j reads it after it makes the relationship and stores false for each; compiled, the SQL stores gave true for c and d."
        cypher: "MATCH (n:CyWrite) MERGE (n)-[r:CyR {f: NOT (n)-->()}]->(m) RETURN [n.id, r.f] ORDER BY n.id"
        error: "A pattern or a subquery in the properties a CREATE or a MERGE makes is Cypher, and is not compiled to SQL yet. Work it out in a WITH before the clause."
      - note: "an earlier pattern of the same CREATE: Neo4j stores [false]; compiled, the SQL stores gave [true]."
        cypher: "MATCH (n:CyWrite {id: 'a'}) CREATE (a:CyNew {name: 'x'}), (m:CyMade {f: EXISTS { (:CyNew) }}) RETURN m.f"
        error: "A pattern or a subquery in the properties a CREATE or a MERGE makes is Cypher, and is not compiled to SQL yet. Work it out in a WITH before the clause."
      - note: "likewise within a FOREACH: Neo4j stores [true]; compiled, the SQL stores gave [false]."
        cypher: "MATCH (n:CyWrite {id: 'a'}) FOREACH (i IN [1] | CREATE (a:CyNew)-[:CyR]->(b:CyNew), (m:CyMade {f: NOT ()-[:CyR]->()})) WITH count(*) AS c MATCH (m:CyMade) RETURN m.f"
        error: "A pattern or a subquery in the properties a CREATE or a MERGE makes is Cypher, and is not compiled to SQL yet. Work it out in a WITH before the clause."
      - note: "within a FOREACH, a CREATE of one pattern, read before it writes the row's, after the rows before: Neo4j stores [0, 1, 2, 3], as the SQL stores did compiled."
        cypher: "MATCH (n:CyWrite) FOREACH (i IN [1] | CREATE (m:CyMade {c: COUNT { (:CyMade) }})) WITH count(*) AS c MATCH (m:CyMade) RETURN m.c ORDER BY m.c"
        error: "A pattern or a subquery in the properties a CREATE or a MERGE makes is Cypher, and is not compiled to SQL yet. Work it out in a WITH before the clause."
      - note: "within a FOREACH, a CREATE of one pattern; an endpoint's, reading its own type: Neo4j stores [false, false, false, true], as the SQL stores did compiled."
        cypher: "MATCH (n:CyWrite) FOREACH (i IN [1] | CREATE (a:CyNew)-[:CyR]->(m:CyMade {f: NOT ()-[:CyR]->()})) WITH count(*) AS c MATCH (m:CyMade) RETURN m.f ORDER BY m.f"
        error: "A pattern or a subquery in the properties a CREATE or a MERGE makes is Cypher, and is not compiled to SQL yet. Work it out in a WITH before the clause."
      - note: "within a FOREACH, a CREATE of one pattern; a relationship's, reading the label of the node before it: Neo4j stores [false, true, true, true], and compiled, the SQL stores gave [true, true, true, true], reading the node the pattern made before."
        cypher: "MATCH (n:CyWrite) FOREACH (i IN [1] | CREATE (a:CyNew)-[r:CyR {f: EXISTS { (:CyNew) }}]->(m:CyMade)) WITH count(*) AS c MATCH ()-[r:CyR]->() RETURN r.f ORDER BY r.f"
        error: "A pattern or a subquery in the properties a CREATE or a MERGE makes is Cypher, and is not compiled to SQL yet. Work it out in a WITH before the clause."
      - note: "within a FOREACH, a CREATE of one pattern; a second relationship's, reading the type of the first: Neo4j stores [0, 2, 4, 6], as the SQL stores did compiled."
        cypher: "MATCH (n:CyWrite) FOREACH (i IN [1] | CREATE (a:CyNew)-[:CyR]->(b:CyNew)-[r:CyR {c: COUNT { ()-[:CyR]->() }}]->(m:CyMade)) WITH count(*) AS c MATCH ()-[r:CyR]->() WHERE r.c IS NOT NULL RETURN r.c ORDER BY r.c"
        error: "A pattern or a subquery in the properties a CREATE or a MERGE makes is Cypher, and is not compiled to SQL yet. Work it out in a WITH before the clause."
      - note: "within a FOREACH, a CREATE of one pattern; an endpoint's, reading the pattern it is in: Neo4j stores [0, 1, 2, 3], as the SQL stores did compiled."
        cypher: "MATCH (n:CyWrite) FOREACH (i IN [1] | CREATE (a:CyNew)-[:CyR]->(m:CyMade {c: COUNT { (:CyNew)-[:CyR]->() }})) WITH count(*) AS c MATCH (m:CyMade) RETURN m.c ORDER BY m.c"
        error: "A pattern or a subquery in the properties a CREATE or a MERGE makes is Cypher, and is not compiled to SQL yet. Work it out in a WITH before the clause."
      - note: "a MERGE's node, read a row at a time before it makes it, what the rows before made: Neo4j stores [false, false, false, true], as the SQL stores did compiled; refused all the same."
        cypher: "MATCH (n:CyWrite) MERGE (a:CyNew {name: 'x'})-[:CyR]->(m:CyMade {f: NOT ()-[:CyR]->()}) RETURN m.f ORDER BY m.f"
        error: "A pattern or a subquery in the properties a CREATE or a MERGE makes is Cypher, and is not compiled to SQL yet. Work it out in a WITH before the clause."
      - note: "an endpoint's, reading the node before it in the pattern, which it has made: Neo4j stores [1, 2, 3, 4], as the SQL stores did compiled; refused all the same."
        cypher: "MATCH (n:CyWrite) MERGE (a:CyNew {id: n.id})-[:CyR]->(m:CyMade {f: size([(x:CyNew)-[:NEXT*0..1]->(y) | x])}) RETURN m.f ORDER BY m.f"
        error: "A pattern or a subquery in the properties a CREATE or a MERGE makes is Cypher, and is not compiled to SQL yet. Work it out in a WITH before the clause."
      - note: "a MERGE's node: Neo4j stores [[\"a\", false], [\"b\", false], [\"c\", false], [\"d\", false]], as the SQL stores did compiled; refused all the same."
        cypher: "MATCH (n:CyWrite) MERGE (a:CyNew {id: n.id})-[:CyR]->(m:CyMade {f: NOT (:CyNew {id: n.id})-[:NEXT*0..1]->()}) RETURN [n.id, m.f] ORDER BY n.id"
        error: "A pattern or a subquery in the properties a CREATE or a MERGE makes is Cypher, and is not compiled to SQL yet. Work it out in a WITH before the clause."
      - note: "likewise within a FOREACH: Neo4j stores [1, 2, 3, 4], as the SQL stores did compiled; refused all the same."
        cypher: "MATCH (n:CyWrite) FOREACH (i IN [1] | MERGE (a:CyNew {id: n.id})-[:CyR]->(m:CyMade {f: size([(x:CyNew)-[:NEXT*0..1]->(y) | x])})) WITH count(*) AS c MATCH (m:CyMade) RETURN m.f ORDER BY m.f"
