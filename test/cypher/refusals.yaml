        error: "A relationship variable bound before its pattern is Cypher, and is not compiled to SQL yet."
      - cypher: "MATCH ()-[r1]->()-[r2]->() WITH [r1, r2] AS rs LIMIT 1 MATCH p = (first)-[rs*]->(second) RETURN labels(first), labels(second), length(p)"
        error: "A relationship variable bound before its pattern is Cypher, and is not compiled to SQL yet."
      - cypher: "MATCH ()-[r1]->()-[r2]->() WITH [r1, r2] AS rs LIMIT 1 OPTIONAL MATCH (first)-[rs*]->(second) RETURN labels(first), labels(second)"
        error: "A relationship variable bound before its pattern is Cypher, and is not compiled to SQL yet."
