  # rebinding.yaml's cells, to here.

  - name: "Rebinding a variable from outside a subquery refused: after a WITH passes it on, and beyond the table"
    description: "A name a subquery has from outside it stays from outside for the whole subquery: after a WITH that passes it on as it is, WITH m1, or orders it, or drops it, a WITH's or an UNWIND's alias, a procedure's YIELD alias, or an EXISTS { … }'s RETURN alias that names it again is refused, as Neo4j 2026.10.1 refuses each, on EXPLAIN and on a run (its 42N07, \"The variable `m1` is shadowing a variable with the same name from the outer scope and needs to be renamed\"). After a WITH that passed it on, the SQL stores compiled it, and gave the subquery's own value for it; and an EXISTS { … }'s RETURN alias too. An UNWIND that binds a name in scope again, at the top or one a CALL { … }'s leading WITH imports, Neo4j refuses as declared already (its 42N59), which the SQL stores compiled at the top (drivine4j#819)."
    steps:
      - cypher: "MATCH (m1:Movie) CALL (m1) { WITH m1 UNWIND ['u'] AS m1 RETURN m1 AS y } RETURN y"
        error: "The variable m1 is shadowing a variable with the same name from the outer scope, as in Neo4j: rename it."
      - cypher: "MATCH (m1:Movie) CALL (m1) { WITH m1 WITH 'w' AS m1 RETURN m1 AS y } RETURN y"
        error: "The variable m1 is shadowing a variable with the same name from the outer scope, as in Neo4j: rename it."
      - cypher: "MATCH (m1:Movie) CALL (m1) { WITH m1 ORDER BY m1.title UNWIND ['u'] AS m1 RETURN m1 AS y } RETURN y"
        error: "The variable m1 is shadowing a variable with the same name from the outer scope, as in Neo4j: rename it."
      - note: "A leading WITH that imports m1, CALL { WITH m1 … } or CALL { WITH * … }: Neo4j has m1 declared in the subquery's own scope, as at the top, and refuses an UNWIND binding it again as declared already (its 42N59, \"Variable `m1` already declared\"), not as shadowing; a WITH's alias projects it anew there (see writes.yaml and queries.yaml)."
        cypher: "MATCH (m1:Movie) CALL { WITH m1 UNWIND ['u'] AS m1 RETURN m1 AS y } RETURN y"
        error: "Variable `m1` already declared, as in Neo4j: an UNWIND binds no variable in scope again. Rename it."
      - cypher: "MATCH (m1:Movie) CALL { WITH * UNWIND ['u'] AS m1 RETURN m1 AS y } RETURN y"
        error: "Variable `m1` already declared, as in Neo4j: an UNWIND binds no variable in scope again. Rename it."
      - note: "At the top, and after a WITH that passes m1 on, Neo4j refuses it alike (its 42N59): the SQL stores compiled both, and gave the UNWIND's value for m1."
        cypher: "MATCH (m1:Movie) UNWIND ['u'] AS m1 RETURN m1"
        error: "Variable `m1` already declared, as in Neo4j: an UNWIND binds no variable in scope again. Rename it."
      - cypher: "MATCH (m1:Movie) WITH m1 UNWIND ['u'] AS m1 RETURN m1"
        error: "Variable `m1` already declared, as in Neo4j: an UNWIND binds no variable in scope again. Rename it."
      - note: "A CALL's item that names m1, bound already outside it: Neo4j refuses it as shadowing (its 42N07), and within a CALL { WITH m1 … } too."
        cypher: "MATCH (m1:Movie) CALL (m1) { RETURN 'x' AS m1 } RETURN m1"
        error: "The variable m1 is bound already, so a CALL does not return or yield it, as in Cypher: name it with AS."
      - cypher: "MATCH (m1:Movie) CALL { WITH m1 CALL () { RETURN 'x' AS m1 } RETURN m1 AS y } RETURN y"
        error: "The variable m1 is bound already, so a CALL does not return or yield it, as in Cypher: name it with AS."
      - cypher: "MATCH (m1:Movie) RETURN EXISTS { WITH m1 UNWIND ['u'] AS m1 RETURN m1 } AS y"
        error: "The variable m1 is shadowing a variable with the same name from the outer scope, as in Neo4j: rename it."
      - cypher: "MATCH (m1:Movie) RETURN COUNT { MATCH (m1) WITH m1 UNWIND ['u'] AS m1 RETURN m1 } AS y"
        error: "The variable m1 is shadowing a variable with the same name from the outer scope, as in Neo4j: rename it."
      - cypher: "MATCH (m1:Movie) RETURN COUNT { WITH m1 UNWIND ['u'] AS m1 RETURN m1 } AS y"
        error: "The variable m1 is shadowing a variable with the same name from the outer scope, as in Neo4j: rename it."
      - note: "A WITH that drops m1 within the subquery: it is still from outside."
        cypher: "MATCH (m1:Movie) CALL (m1) { MATCH (m1)-[r]->(z) WITH r UNWIND [1] AS m1 RETURN m1 AS y } RETURN y"
        error: "The variable m1 is shadowing a variable with the same name from the outer scope, as in Neo4j: rename it."
      - cypher: "MATCH (m1:Movie) CALL (m1) { WITH m1 MATCH (m1) UNWIND ['u'] AS m1 RETURN m1 AS y } RETURN y"
        error: "The variable m1 is shadowing a variable with the same name from the outer scope, as in Neo4j: rename it."
      - cypher: "MATCH (m1:Movie) CALL (*) { WITH m1 UNWIND ['u'] AS m1 RETURN m1 AS y } RETURN y"
        error: "The variable m1 is shadowing a variable with the same name from the outer scope, as in Neo4j: rename it."
      - note: "A variable a WITH drops, in an EXISTS { … } in its WHERE, which Neo4j still reads there."
        cypher: "MATCH (q:Person), (m1:Movie) WITH q WHERE EXISTS { UNWIND [1] AS m1 RETURN m1 } RETURN q.name AS n ORDER BY n"
        error: "The variable m1 is shadowing a variable with the same name from the outer scope, as in Neo4j: rename it."
      - cypher: "MATCH (m1:Movie) WITH m1 AS x WHERE EXISTS { WITH 'w' AS m1 RETURN m1 } RETURN x.title AS t ORDER BY t"
        error: "The variable m1 is shadowing a variable with the same name from the outer scope, as in Neo4j: rename it."
      - note: "And in a COUNT { … } in its order, which Neo4j reads as its WHERE. One in the WHERE of a WITH that groups, which reads its items alone, may bind it (see queries.yaml, \"Rebinding a variable a CALL { … }'s leading WITH imports\")."
        cypher: "MATCH (m1:Movie) WITH m1.title AS t ORDER BY COUNT { UNWIND [1] AS m1 RETURN m1 } RETURN t"
        error: "The variable m1 is shadowing a variable with the same name from the outer scope, as in Neo4j: rename it."
      - note: "A list comprehension's variable, from outside an EXISTS { … } in its WHERE."
        cypher: "RETURN [x IN [1] WHERE EXISTS { UNWIND [1] AS x RETURN x }] AS y"
        error: "The variable x is shadowing a variable with the same name from the outer scope, as in Neo4j: rename it."
      - note: "The RETURN alias of an EXISTS { … } binds too."
        cypher: "MATCH (m1:Movie) RETURN EXISTS { RETURN 'x' AS m1 } AS y"
        error: "The variable m1 is shadowing a variable with the same name from the outer scope, as in Neo4j: rename it."
      - note: "A procedure's YIELD alias."
        cypher: "MATCH (m1:Movie) CALL (m1) { CALL db.labels() YIELD label AS m1 RETURN m1 AS y } RETURN y"
        error: "The variable m1 is shadowing a variable with the same name from the outer scope, as in Neo4j: rename it."

  - name: "A CALL in the order of a RETURN that groups or is DISTINCT, and CALL (*) where a projection groups"
    description: "Within the WHERE or the order of a WITH or a RETURN that groups or is DISTINCT, Neo4j reads a CALL's brackets as of that projection, so refuses a subquery's own variable there (its 42N44), and a CALL (*) imports it but refuses a read of it within, in a pattern or as a value; a projection that groups within the subquery reads its own items, and a subquery within it what is in scope where it is, but not a subquery's own variable that a CALL within that subquery names, nor what a procedure's CALL yields, nor, within a CALL (*), what it imports that the projection can't read, nor what a subquery binds in its other UNION part, after a WITH, by an UNWIND or in a CALL () within it. Last, a variable a WITH within the subquery drops, read in its WHERE, which Neo4j reads and the SQL stores refuse, as they do at the top (drivine4j#426, #504). Captured on Neo4j 2026.10.1 (drivine4j#681; see queries.yaml, \"A CALL in the order of a RETURN that groups or is DISTINCT, and CALL (*) where a projection groups\")."
    steps:
