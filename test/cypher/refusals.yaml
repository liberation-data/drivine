  - name: "Two items of one name"
    description: "A WITH or a RETURN names each item once, as Neo4j has it (its 42N38, \"column name conflict\"): an item's name is its alias, or its expression as written, and a variable's or a map projection's is its variable's (drivine4j#499)."
    steps:
      - cypher: "RETURN 1 AS a, 2 AS a"
        error: "Two items are named a, as Cypher refuses: name each item of a WITH or a RETURN once, with AS."
      - cypher: "MATCH (p) WITH p.name AS q, p.age AS q RETURN q"
        error: "Two items are named q, as Cypher refuses: name each item of a WITH or a RETURN once, with AS."
      - cypher: "MATCH (p) WITH p, p {.name} RETURN p"
        error: "Two items are named p, as Cypher refuses: name each item of a WITH or a RETURN once, with AS."
      - cypher: "MATCH (p) WITH p {.name}, p RETURN p"
        error: "Two items are named p, as Cypher refuses: name each item of a WITH or a RETURN once, with AS."
      - cypher: "MATCH (p) RETURN p.name, p.name"
        error: "Two items are named p.name, as Cypher refuses: name each item of a WITH or a RETURN once, with AS."
      - cypher: "UNWIND [1] AS x RETURN x, x AS x"
        error: "Two items are named x, as Cypher refuses: name each item of a WITH or a RETURN once, with AS."
      - note: "A variable quoted is named as it is unquoted."
        cypher: "WITH 1 AS a RETURN a, `a`"
        error: "Two items are named a, as Cypher refuses: name each item of a WITH or a RETURN once, with AS."
      - note: "In a query of a UNION, and of a CALL { … }, too."
        cypher: "RETURN 1 AS a UNION RETURN 2 AS a, 3 AS a"
        error: "Two items are named a, as Cypher refuses: name each item of a WITH or a RETURN once, with AS."
      - cypher: "CALL { RETURN 1 AS a, 2 AS a } RETURN a"
        error: "Two items are named a, as Cypher refuses: name each item of a WITH or a RETURN once, with AS."

  - name: "CALL imports variables of the row"
    description: "A CALL's brackets name only variables of its row, as Neo4j has it."
    steps:
      - cypher: "MATCH (a) CALL (x) { RETURN 1 AS n } RETURN n"
        error: "x is not defined: a variable is bound by a pattern, a WITH or an UNWIND before it is used."
      - note: "An inner CALL imports from the outer CALL's scope, which holds only what the outer one imports."
        cypher: "MATCH (a), (b) CALL (a) { CALL (b) { MATCH (b)-->(d) RETURN d } RETURN d.x AS x } RETURN x"
        error: "b is not defined: a variable is bound by a pattern, a WITH or an UNWIND before it is used."
      - note: "What brackets import is in scope after a WITH that does not name it."
        cypher: "MATCH (a) CALL (a) { WITH 1 AS one CREATE (a) RETURN one } RETURN one"
        error: "a is bound already, so a CREATE makes no node of it, as in Neo4j."
      - cypher: "MATCH (a) CALL (*) { WITH 1 AS one MATCH ()-[a]->() RETURN one } RETURN one"
        error: "a is a node, and is used as a relationship: a variable is of one kind, as in Neo4j."
      - note: "A procedure's call imports each variable of the row, so after a WITH that drops one its WHERE does not read it."
        cypher: "MATCH (a) WITH 1 AS x CALL db.labels() YIELD label WHERE label = a.kind RETURN label"
        error: "a is not defined: a variable is bound by a pattern, a WITH or an UNWIND before it is used."

  - name: "Importing WITH of variables alone"
    description: "A CALL's leading WITH that names a variable of the row, or *, names nothing more, as Neo4j has it (its 42I28)."
    steps:
      - cypher: "MATCH (a), (b) CALL { WITH a, b AS c MATCH (a)-->(c) RETURN c.x AS x } RETURN x"
        error: "The importing WITH of a CALL { … } names variables of the row alone, as in Cypher: no alias, expression, DISTINCT, WHERE, ORDER BY, SKIP or LIMIT. Import them with CALL (a, b) { … }, and work on them in a WITH after."
      - cypher: "MATCH (a) CALL { WITH a AS c MATCH (c)-->(d) RETURN d.x AS x } RETURN x"
        error: "The importing WITH of a CALL { … } names variables of the row alone, as in Cypher: no alias, expression, DISTINCT, WHERE, ORDER BY, SKIP or LIMIT. Import them with CALL (a, b) { … }, and work on them in a WITH after."
      - cypher: "MATCH (a) CALL { WITH a WHERE a.x > 1 RETURN count(*) AS n } RETURN a, n"
        error: "The importing WITH of a CALL { … } names variables of the row alone, as in Cypher: no alias, expression, DISTINCT, WHERE, ORDER BY, SKIP or LIMIT. Import them with CALL (a, b) { … }, and work on them in a WITH after."
      - cypher: "MATCH (a) CALL { WITH a ORDER BY a.x LIMIT 1 MATCH (a)-->(d) RETURN d.x AS x } RETURN x"
        error: "The importing WITH of a CALL { … } names variables of the row alone, as in Cypher: no alias, expression, DISTINCT, WHERE, ORDER BY, SKIP or LIMIT. Import them with CALL (a, b) { … }, and work on them in a WITH after."
      - cypher: "MATCH (a) CALL { WITH a SKIP 0 RETURN 1 AS x } RETURN x"
        error: "The importing WITH of a CALL { … } names variables of the row alone, as in Cypher: no alias, expression, DISTINCT, WHERE, ORDER BY, SKIP or LIMIT. Import them with CALL (a, b) { … }, and work on them in a WITH after."
      - cypher: "MATCH (a) CALL { WITH DISTINCT a MATCH (a)-->(d) RETURN d.x AS x } RETURN x"
        error: "The importing WITH of a CALL { … } names variables of the row alone, as in Cypher: no alias, expression, DISTINCT, WHERE, ORDER BY, SKIP or LIMIT. Import them with CALL (a, b) { … }, and work on them in a WITH after."
      - cypher: "MATCH (a) CALL { WITH a, 1 AS one MATCH (a)-->(d) RETURN d.x + one AS x } RETURN x"
        error: "The importing WITH of a CALL { … } names variables of the row alone, as in Cypher: no alias, expression, DISTINCT, WHERE, ORDER BY, SKIP or LIMIT. Import them with CALL (a, b) { … }, and work on them in a WITH after."
      - cypher: "MATCH (a) CALL { WITH * WHERE true RETURN 1 AS x } RETURN x"
        error: "The importing WITH of a CALL { … } names variables of the row alone, as in Cypher: no alias, expression, DISTINCT, WHERE, ORDER BY, SKIP or LIMIT. Import them with CALL (a, b) { … }, and work on them in a WITH after."
      - cypher: "MATCH (a) CALL { UNWIND [1] AS x RETURN x UNION WITH a WHERE true RETURN 1 AS x } RETURN x"
        error: "The importing WITH of a CALL { … } names variables of the row alone, as in Cypher: no alias, expression, DISTINCT, WHERE, ORDER BY, SKIP or LIMIT. Import them with CALL (a, b) { … }, and work on them in a WITH after."
      - cypher: "MATCH (a) CALL { WITH a WHERE a.x > 1 SET a.y = 1 } RETURN a"
        error: "The importing WITH of a CALL { … } names variables of the row alone, as in Cypher: no alias, expression, DISTINCT, WHERE, ORDER BY, SKIP or LIMIT. Import them with CALL (a, b) { … }, and work on them in a WITH after."

  - name: "size() of a path"
    description: "size() of a path is refused, as Neo4j refuses it: length() gives a path's length."
    steps:
      - cypher: "MATCH p = (a)-[*]->(b) RETURN size(p)"
        error: "size() takes a list or a text, not a path, as in Neo4j: length() takes a path."

  - name: "size() of a pattern"
    description: "size() of a pattern is refused, as Neo4j (its 42I52) refuses it: COUNT { … } counts a pattern's matches."
    steps:
      - note: "The openCypher TCK's List6 [6]."
        cypher: "MATCH (a) RETURN size((a)-->())"
        error: "size() takes a list or a text, not a pattern, as in Neo4j: COUNT { … } counts a pattern's matches."
      - cypher: "MATCH (a), (b), (c) RETURN size(()--())"
        error: "size() takes a list or a text, not a pattern, as in Neo4j: COUNT { … } counts a pattern's matches."
      - cypher: "MATCH (a), (b), (c) RETURN size((a)<--(a {}))"
        error: "size() takes a list or a text, not a pattern, as in Neo4j: COUNT { … } counts a pattern's matches."
      - cypher: "MATCH (a), (b), (c) RETURN size(()-[:REL*0..2]->()<-[:REL]-(:A {num: 5}))"
        error: "size() takes a list or a text, not a pattern, as in Neo4j: COUNT { … } counts a pattern's matches."

  - name: "size() of a map"
    description: "size() of a map written, a map projection or a variable a WITH binds to a map is refused, as Neo4j 2026.10.1 refuses it when it compiles the statement (22G03, \"Type mismatch: expected String, Vector or List<T> but was Map\"). The SQL stores gave null (#364). So is a map projection a WITH binds, and a map an UNWIND gives of a list written of maps alone, over no rows too, which Neo4j types a map for size() as it compiles, though it fails a write of either only as each row runs. A map given as a parameter, or one Neo4j meets only as the statement runs, is not refused here."
    steps:
      - cypher: "RETURN size({a: 1, b: 2})"
        error: "size() takes a list or a text, not a map, as in Neo4j."
      - cypher: "WITH {a: 1, b: 2} AS m RETURN size(m)"
        error: "size() takes a list or a text, not a map, as in Neo4j."
      - cypher: "MATCH (n) WITH n, {a: 1} AS m SET n.p = size(m)"
        error: "size() takes a list or a text, not a map, as in Neo4j."
      - cypher: "MATCH (n) WHERE size(n {.a}) > 0 RETURN n"
        error: "size() takes a list or a text, not a map, as in Neo4j."
      - cypher: "UNWIND [{a: 1}, {b: 2}] AS m RETURN size(m)"
        error: "size() takes a list or a text, not a map, as in Neo4j."
      - cypher: "MATCH (x:Nothing) UNWIND [{a: 1}] AS m RETURN size(m)"
        error: "size() takes a list or a text, not a map, as in Neo4j."
      - cypher: "MATCH (x:Nothing) WITH x {.a} AS m RETURN size(m)"
        error: "size() takes a list or a text, not a map, as in Neo4j."

  - name: "size() of a node or a relationship"
    description: "size() of a node or a relationship is refused, as Neo4j 2026.10.1 refuses it when it compiles the statement, over no rows too (22G03, \"Invalid input 'NODE' for argument at index 0 of function size()\"). The SQL stores gave null (#364). size() of a variable-length relationship's list is its length."
    steps:
      - cypher: "MATCH (n) RETURN size(n)"
        error: "size() takes a list or a text, not a node, as in Neo4j."
      - cypher: "MATCH (n) WITH n AS m RETURN size(m)"
        error: "size() takes a list or a text, not a node, as in Neo4j."
      - cypher: "MATCH (x:Nothing)-[r]->() RETURN size(r)"
        error: "size() takes a list or a text, not a relationship, as in Neo4j."

  - name: "Pattern expression with a new variable"
    description: "A pattern used as an expression, which tests for a match and binds nothing, is refused where it names a node or relationship variable not bound before it, as Neo4j (its 42N29) refuses it. In a property a CREATE or a MERGE makes, a node's or a relationship's, a variable the same clause makes is not bound before it, as Neo4j 2026.10.1 has it (liberation-data/drivine4j#814): compiled, it was read as the node made."
    steps:
      - note: "The openCypher TCK's Pattern1 [10]."
        cypher: "MATCH (n) WHERE (n)-[r]->(a) RETURN n"
        error: "r is not defined: a pattern used as an expression binds no new variable, as in Neo4j. Bind it in a MATCH, or test the pattern with EXISTS { … }."
      - cypher: "MATCH (n) WHERE ()-[r]->() RETURN n"
        error: "r is not defined: a pattern used as an expression binds no new variable, as in Neo4j. Bind it in a MATCH, or test the pattern with EXISTS { … }."
      - cypher: "MATCH (n) WHERE (n)<-[r {}]-(a) RETURN n"
        error: "r is not defined: a pattern used as an expression binds no new variable, as in Neo4j. Bind it in a MATCH, or test the pattern with EXISTS { … }."
      - cypher: "MATCH (n) WHERE (n)-[r:REL*0..2]->(a {num: 5}) RETURN n"
        error: "r is not defined: a pattern used as an expression binds no new variable, as in Neo4j. Bind it in a MATCH, or test the pattern with EXISTS { … }."
      - cypher: "MATCH (n) WHERE (n)-->(a) RETURN n"
        error: "a is not defined: a pattern used as an expression binds no new variable, as in Neo4j. Bind it in a MATCH, or test the pattern with EXISTS { … }."
      - note: "A variable the same CREATE or MERGE makes (drivine4j#814)."
        cypher: "MATCH (n:Person) CREATE (m {f: NOT (m)-->()})"
        error: "m is not defined: a pattern used as an expression binds no new variable, as in Neo4j. Bind it in a MATCH, or test the pattern with EXISTS { … }."
      - cypher: "MATCH (n:Person) CREATE (a:A), (m {f: NOT (a)-->()})"
        error: "a is not defined: a pattern used as an expression binds no new variable, as in Neo4j. Bind it in a MATCH, or test the pattern with EXISTS { … }."
      - cypher: "MATCH (n:Person) CREATE (a:A)-[:R]->(b {f: NOT (a)-->()})"
        error: "a is not defined: a pattern used as an expression binds no new variable, as in Neo4j. Bind it in a MATCH, or test the pattern with EXISTS { … }."
      - cypher: "MATCH (n:Person) CREATE (a:A)-[:R {f: NOT (a)-->()}]->(b)"
        error: "a is not defined: a pattern used as an expression binds no new variable, as in Neo4j. Bind it in a MATCH, or test the pattern with EXISTS { … }."
      - cypher: "MATCH (n:Person) CREATE (a:A), (m)-[:R {f: NOT (a)-->()}]->(b)"
        error: "a is not defined: a pattern used as an expression binds no new variable, as in Neo4j. Bind it in a MATCH, or test the pattern with EXISTS { … }."
      - cypher: "MATCH (n:Person) MERGE (a:A)-[:R]->(b {f: NOT (a)-->()})"
        error: "a is not defined: a pattern used as an expression binds no new variable, as in Neo4j. Bind it in a MATCH, or test the pattern with EXISTS { … }."
      - cypher: "MATCH (n:Person) MERGE (a:A)-[:R {f: NOT (a)-->()}]->(b)"
        error: "a is not defined: a pattern used as an expression binds no new variable, as in Neo4j. Bind it in a MATCH, or test the pattern with EXISTS { … }."
      - note: "Within a FOREACH too."
        cypher: "MATCH (n:Person) FOREACH (x IN [1] | CREATE (a:A), (m {f: NOT (a)-->()}))"
        error: "a is not defined: a pattern used as an expression binds no new variable, as in Neo4j. Bind it in a MATCH, or test the pattern with EXISTS { … }."

  - name: "Aggregate in the ORDER BY of a projection that doesn't aggregate"
    description: "An aggregate in the ORDER BY of a WITH or a RETURN whose items don't aggregate, and that isn't DISTINCT, is refused, as Neo4j refuses it (\"Illegal aggregation expression(s) in order by\"): there are no groups for it to aggregate over. Compiled, it made the query aggregate with no GROUP BY, so SQLite gave one row of an arbitrary value (liberation-data/drivine4j#439). A WITH or a RETURN that aggregates, or is DISTINCT, orders by an aggregate, as Neo4j does (see queries.yaml, \"Grouping by maps and lists\")."
    steps:
      - cypher: "MATCH (n) WITH n.num1 AS foo ORDER BY max(n.num2) RETURN foo AS foo"
        error: "max() aggregates, and an ORDER BY holds no aggregate unless its WITH or RETURN aggregates or is DISTINCT, as in Neo4j: give the aggregate as an item, and order by its name, as in RETURN x, count(*) AS c ORDER BY c."
      - cypher: "MATCH (n) RETURN n.num1 ORDER BY max(n.num2)"
        error: "max() aggregates, and an ORDER BY holds no aggregate unless its WITH or RETURN aggregates or is DISTINCT, as in Neo4j: give the aggregate as an item, and order by its name, as in RETURN x, count(*) AS c ORDER BY c."
      - cypher: "MATCH (n) WITH n.num1 AS foo ORDER BY n.num1, max(n.num2) RETURN foo AS foo"
        error: "max() aggregates, and an ORDER BY holds no aggregate unless its WITH or RETURN aggregates or is DISTINCT, as in Neo4j: give the aggregate as an item, and order by its name, as in RETURN x, count(*) AS c ORDER BY c."
      - cypher: "MATCH (n) WITH 'k' AS foo ORDER BY max(n.num2) RETURN foo AS foo"
        error: "max() aggregates, and an ORDER BY holds no aggregate unless its WITH or RETURN aggregates or is DISTINCT, as in Neo4j: give the aggregate as an item, and order by its name, as in RETURN x, count(*) AS c ORDER BY c."
      - cypher: "UNWIND [3, 1, 2] AS x RETURN 'k' AS k ORDER BY count(x)"
        error: "count() aggregates, and an ORDER BY holds no aggregate unless its WITH or RETURN aggregates or is DISTINCT, as in Neo4j: give the aggregate as an item, and order by its name, as in RETURN x, count(*) AS c ORDER BY c."
      - note: "Of a DISTINCT projection, an aggregate in an ORDER BY term that names a variable outside the items is refused as an implicit grouping, as Neo4j refuses it."
        cypher: "MATCH (n) RETURN DISTINCT n.num1 AS a ORDER BY n.num2 + max(n.num2)"
        error: "A term of an ORDER BY aggregates, and names n outside its aggregates and the items: Cypher would group by it without being told. Order by an item's name, or by an expression of the items and aggregates."
      - note: "Neo4j 2026.10.1 refuses each of these. A COUNT { … } or a comprehension in the ORDER BY isn't an aggregate of the projection, and is taken."
        cypher: "MATCH (n) WITH n ORDER BY count(*) WHERE n.num1 > 0 RETURN n.num1"
        error: "count(*) aggregates, and an ORDER BY holds no aggregate unless its WITH or RETURN aggregates or is DISTINCT, as in Neo4j: give the aggregate as an item, and order by its name, as in RETURN x, count(*) AS c ORDER BY c."

  - name: "Expression in WITH without an alias"
    description: "An item of a WITH that is not a variable or a map projection has an alias, as Neo4j (its 42N21, \"unaliased return item\") refuses it: compiled, it ran and named the column by its text (liberation-data/drivine4j#714). It is refused before a parameter no value is bound to, as Neo4j refuses it. A variable, one in parentheses, and a map projection need none (see queries.yaml, \"Items of a WITH named without AS\"). Neo4j 2026.10.1 refuses each of these."
    steps:
      - note: "The openCypher TCK's With4 [5]."
        cypher: "MATCH (a) WITH a, count(*) RETURN a"
        error: "Expression in WITH must be aliased (use AS), as in Neo4j: count(*) has no alias."
      - cypher: "MATCH (a) WITH a, count(*) RETURN count(a)"
        error: "Expression in WITH must be aliased (use AS), as in Neo4j: count(*) has no alias."
      - cypher: "MATCH (p:Person) WITH p.name RETURN 1"
        error: "Expression in WITH must be aliased (use AS), as in Neo4j: p.name has no alias."
      - cypher: "MATCH (p:Person) WITH p, p.born + 1 RETURN p.name"
        error: "Expression in WITH must be aliased (use AS), as in Neo4j: p.born + 1 has no alias."
      - cypher: "MATCH (p:Person) WITH p.name, p.born RETURN 1"
        error: "Expression in WITH must be aliased (use AS), as in Neo4j: p.name has no alias."
      - cypher: "WITH 1 RETURN 1"
        error: "Expression in WITH must be aliased (use AS), as in Neo4j: 1 has no alias."
      - cypher: "WITH 1 AS a, 2 RETURN a"
        error: "Expression in WITH must be aliased (use AS), as in Neo4j: 2 has no alias."
      - cypher: "MATCH (p:Person) WITH DISTINCT p.name RETURN 1"
        error: "Expression in WITH must be aliased (use AS), as in Neo4j: p.name has no alias."
      - cypher: "UNWIND [1] AS x WITH x + 1 RETURN 1"
        error: "Expression in WITH must be aliased (use AS), as in Neo4j: x + 1 has no alias."
      - cypher: "MATCH (p:Person) WITH p.name AS n, count(*) RETURN n"
        error: "Expression in WITH must be aliased (use AS), as in Neo4j: count(*) has no alias."
      - cypher: "MATCH (p:Person) WITH count(*) RETURN 1"
        error: "Expression in WITH must be aliased (use AS), as in Neo4j: count(*) has no alias."
      - cypher: "MATCH (p:Person) WITH *, p.name RETURN 1"
        error: "Expression in WITH must be aliased (use AS), as in Neo4j: p.name has no alias."
      - cypher: "MATCH (p:Person) WITH p, [(p)-->(m) | m] RETURN 1"
        error: "Expression in WITH must be aliased (use AS), as in Neo4j: [(p)-->(m) | m] has no alias."
      - cypher: "MATCH (p:Person) WITH p, COUNT { (p)-->() } RETURN 1"
        error: "Expression in WITH must be aliased (use AS), as in Neo4j: COUNT { (p)-->() } has no alias."
      - cypher: "MATCH (p:Person) WITH p, p.born + 1 WHERE p.born > 0 RETURN p.name"
        error: "Expression in WITH must be aliased (use AS), as in Neo4j: p.born + 1 has no alias."
      - cypher: "MATCH (p:Person) WITH p, p.born + 1 ORDER BY p.name RETURN p.name"
        error: "Expression in WITH must be aliased (use AS), as in Neo4j: p.born + 1 has no alias."
      - note: "Before the parameter no value is bound to, as Neo4j refuses it."
        cypher: "WITH $x RETURN 1"
        error: "Expression in WITH must be aliased (use AS), as in Neo4j: $x has no alias."
      - note: "The openCypher TCK's WithOrderBy4 [20]: Neo4j refuses it for the alias, and orders by the term once it has one (see queries.yaml, \"Order by a key's expression beside an aggregate\")."
        cypher: "MATCH (me:Person)--(you:Person) WITH me.born + you.born, count(*) AS cnt ORDER BY me.born + you.born + count(*) RETURN *"
        error: "Expression in WITH must be aliased (use AS), as in Neo4j: me.born + you.born has no alias."

  - name: "Pattern used as a value"
    description: "A pattern, (a)-->(b), in an item or an order term of a WITH or a RETURN, a subquery's or a UNION's among them, in an UNWIND's or a FOREACH's list, as a SET's value, or as a property a CREATE or a MERGE makes, is only a condition, as Neo4j (its 42I34, \"invalid use of pattern expression\") has it: an operand of NOT, AND, OR or XOR, a searched CASE's WHEN, or the WHERE of a comprehension or a quantifier. Elsewhere it is refused: compiled, it gave a list (liberation-data/drivine4j#714). A pattern in a WHERE, and a pattern comprehension, EXISTS { … } and COUNT { … }, are taken (see queries.yaml, \"Pattern as a condition in a projection\"). A pattern in the properties of a node a CREATE or a MERGE makes with no relationship, and one in a MERGE's ON CREATE or ON MATCH SET, Neo4j refuses for another reason first: see \"Pattern in the properties of a node made alone\" and \"Subquery in a MERGE\"."
