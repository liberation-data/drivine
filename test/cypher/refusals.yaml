  - name: "Variable used as two kinds"
    description: "A variable a pattern binds as a node, a relationship, a variable-length relationship's list or a path, or a WITH binds to a value written, is refused where a pattern uses it as another kind, as Neo4j refuses it. A value whose kind the statement leaves open (a property, a parameter, an unwound item) isn't refused for it."
    steps:
      - cypher: "MATCH (a)-[a]->() RETURN a"
        error: "a is a node, and is used as a relationship: a variable is of one kind, as in Neo4j."
      - cypher: "MATCH ()-[r]-(r) RETURN r"
        error: "r is a relationship, and is used as a node: a variable is of one kind, as in Neo4j."
      - cypher: "MATCH (r) MATCH ()-[r]-() RETURN r"
        error: "r is a node, and is used as a relationship: a variable is of one kind, as in Neo4j."
      - cypher: "MATCH (r)-[]-()-[r*]-() RETURN r"
        error: "r is a node, and is used as a list of relationships: a variable is of one kind, as in Neo4j."
      - cypher: "MATCH ()-[r*]-() MATCH ()-[r]-() RETURN r"
        error: "r is a list of relationships, and is used as a relationship: a variable is of one kind, as in Neo4j."
      - cypher: "MATCH p = ()-->() MATCH (p) RETURN p"
        error: "p is a path, and is used as a node: a variable is of one kind, as in Neo4j."
      - cypher: "WITH true AS n MATCH (n) RETURN n"
        error: "n is a truth value, and is used as a node: a variable is of one kind, as in Neo4j."
      - cypher: "WITH [] AS r MATCH ()-[r]-() RETURN r"
        error: "r is a list, and is used as a relationship: a variable is of one kind, as in Neo4j."
      - cypher: "WITH {x: 1} AS r MATCH ()-[r*]-() RETURN r"
        error: "r is a map, and is used as a list of relationships: a variable is of one kind, as in Neo4j."
      - note: A WITH passes a variable on as the kind it is, under its own name or another, or with *.
        cypher: "MATCH (a) WITH a AS r MATCH ()-[r]-() RETURN r"
        error: "r is a node, and is used as a relationship: a variable is of one kind, as in Neo4j."
      - cypher: "MATCH (a) WITH * MATCH ()-[a]->() RETURN a"
        error: "a is a node, and is used as a relationship: a variable is of one kind, as in Neo4j."
      - cypher: "MATCH (a) WITH 1 AS a MATCH ()-[a]->() RETURN a"
        error: "a is an integer, and is used as a relationship: a variable is of one kind, as in Neo4j."
      - note: A pattern in an expression or a subquery reads the variables around it.
        cypher: "MATCH (a) RETURN [(a)-[a]->() | 1] AS l"
        error: "a is a node, and is used as a relationship: a variable is of one kind, as in Neo4j."
      - cypher: "MATCH (a) WHERE (a)-[a]->() RETURN a"
        error: "a is a node, and is used as a relationship: a variable is of one kind, as in Neo4j."
      - cypher: "MATCH (a) WHERE EXISTS { MATCH ()-[a]->() } RETURN a"
        error: "a is a node, and is used as a relationship: a variable is of one kind, as in Neo4j."
      - cypher: "MATCH (a) RETURN COUNT { (a)-[a]->() } AS c"
        error: "a is a node, and is used as a relationship: a variable is of one kind, as in Neo4j."
      - note: A CALL { … } reads a variable its WITH or its brackets import as the kind it is, and returns one as the kind it is.
        cypher: "MATCH (a) CALL { WITH a MATCH ()-[a]->() RETURN 1 AS x } RETURN x"
        error: "a is a node, and is used as a relationship: a variable is of one kind, as in Neo4j."
      - cypher: "MATCH (a) CALL (a) { MATCH ()-[a]->() RETURN 1 AS x } RETURN x"
        error: "a is a node, and is used as a relationship: a variable is of one kind, as in Neo4j."
      - cypher: "CALL { MATCH (a) RETURN a } MATCH ()-[a]->() RETURN a"
        error: "a is a node, and is used as a relationship: a variable is of one kind, as in Neo4j."
      - cypher: "MATCH ()-[r]->() CREATE (a)-[:R]->(r)"
        error: "r is a relationship, and is used as a node: a variable is of one kind, as in Neo4j."
      - note: In a FOREACH too, where a CREATE may name a variable bound already.
        cypher: "MATCH ()-[r]->() FOREACH (x IN [1] | CREATE (r)-[:T]->())"
        error: "r is a relationship, and is used as a node: a variable is of one kind, as in Neo4j."

  - name: "Variable bound already where a pattern makes it"
    description: "A path variable bound already, a shortest path's relationship bound already, a node a CREATE or a MERGE would make alone that is bound already, and a relationship one makes whose variable is bound already as anything but a relationship, or by the same CREATE, are refused, as Neo4j refuses them. A relationship bound as one before the CREATE or MERGE stays refused as not compiled yet (see \"Write not compiled yet\"). In a FOREACH, Neo4j takes a CREATE or a MERGE of a variable bound already."
    steps:
      - cypher: "MATCH p = (p)-[]-() RETURN p"
        error: "p is bound already, so a pattern binds no path to it, as in Neo4j."
      - cypher: "MATCH ()-[p]->() MATCH p = ()-->() RETURN p"
        error: "p is bound already, so a pattern binds no path to it, as in Neo4j."
      - cypher: "UNWIND [1] AS p MATCH p = ()-->() RETURN p"
        error: "p is bound already, so a pattern binds no path to it, as in Neo4j."
      - note: "A shortest path's relationship bound before, as Neo4j refuses it (its 42N66, drivine4j#427)."
        cypher: "MATCH ()-[r1]->()-[r2]->() WITH [r1, r2] AS rs LIMIT 1 MATCH p = shortestPath((first)-[rs*]->(second)) RETURN labels(first), labels(second)"
        error: "rs is bound already, and a shortest path walks no relationship bound before it, as in Neo4j."
      - cypher: "MATCH (a)-[rs*]->(b) MATCH p = shortestPath((x)-[rs*]->(y)) RETURN count(*)"
        error: "rs is bound already, and a shortest path walks no relationship bound before it, as in Neo4j."
      - cypher: "MATCH (a) CREATE (a)"
        error: "a is bound already, so a CREATE makes no node of it, as in Neo4j."
      - cypher: "MATCH (a) MERGE (a)"
        error: "a is bound already, so a MERGE makes no node of it, as in Neo4j."
      - cypher: "CREATE (n), (n)"
        error: "n is bound already, so a CREATE makes no node of it, as in Neo4j."
      - cypher: "MATCH (a) CREATE (a)-[:R]->(b), (b)"
        error: "b is bound already, so a CREATE makes no node of it, as in Neo4j."
      - cypher: "MATCH ()-[r]->() CREATE (r)"
        error: "r is bound already, so a CREATE makes no node of it, as in Neo4j."
      - cypher: "MATCH (a) CALL { WITH a CREATE (a) } RETURN 1"
        error: "a is bound already, so a CREATE makes no node of it, as in Neo4j."
      - cypher: "MATCH (a) CALL (a) { CREATE (a) } RETURN 1"
        error: "a is bound already, so a CREATE makes no node of it, as in Neo4j."
      - cypher: "CREATE (n:Foo)-[:T1]->(), (n:Bar)-[:T2]->()"
        error: "n is bound already, so a CREATE or MERGE makes no node of it with labels or properties."
      - cypher: "CREATE (n)-[r:T]->(), ()-[r:T]->()"
        error: "r is bound already, so a CREATE makes no relationship of it, as in Neo4j."
      - cypher: "MATCH (a) CREATE (b)-[a:R]->()"
        error: "a is bound already, so a CREATE makes no relationship of it, as in Neo4j."
      - cypher: "WITH 1 AS r MERGE ()-[r:R]->()"
        error: "r is bound already, so a MERGE makes no relationship of it, as in Neo4j."

  - name: "Pattern in a WITH's WHERE naming a variable the WITH drops"
    description: "A pattern in the WHERE of a WITH that neither groups nor is DISTINCT, or in an EXISTS { … }, a COUNT { … }, a pattern comprehension or a CALL { … } there, that names a variable from before the WITH that the WITH does not pass on, is refused, as a value read there from such a variable is (drivine4j#426). Neo4j takes both, reading the variable from before the WITH; read as a new node, the pattern would match every row (drivine4j#504). After a WITH that groups or is DISTINCT, Neo4j refuses it too (see \"Variable before a WITH that groups, in its WHERE\")."
    steps:
      - cypher: "MATCH (p:Person) WITH p AS q WHERE (p)-->() RETURN q.name"
        error: "p is not defined: a variable is bound by a pattern, a WITH or an UNWIND before it is used."
      - cypher: "MATCH (p:Person) WITH p AS q ORDER BY p.name WHERE (p)-->() RETURN q.name"
        error: "p is not defined: a variable is bound by a pattern, a WITH or an UNWIND before it is used."
      - cypher: "MATCH (p:Person) WITH p AS q WHERE p.name = 'Keanu' RETURN q.name"
        error: "p is not defined: a variable is bound by a pattern, a WITH or an UNWIND before it is used."
      - note: "And a pattern within the WHERE's EXISTS { … }, COUNT { … } or pattern comprehension, which would match every row too."
        cypher: "MATCH (p:Person) WITH p AS q WHERE EXISTS { (p)-->() } RETURN q.name"
        error: "p is not defined: a variable is bound by a pattern, a WITH or an UNWIND before it is used."
      - cypher: "MATCH (p:Person) WITH p AS q WHERE COUNT { MATCH (p)-->() } > 0 RETURN q.name"
        error: "p is not defined: a variable is bound by a pattern, a WITH or an UNWIND before it is used."
      - cypher: "MATCH (p:Person) WITH p AS q WHERE size([(p)-->(x) | x]) > 0 RETURN q.name"
        error: "p is not defined: a variable is bound by a pattern, a WITH or an UNWIND before it is used."
      - note: "A relationship, in a shortestPath( … ) or a quantified path pattern there too."
        cypher: "MATCH (p:Person)-[r]->() WITH p WHERE size([(p)-[r]->(x) | x]) > 0 RETURN p.name"
        error: "r is not defined: a variable is bound by a pattern, a WITH or an UNWIND before it is used."
      - cypher: "MATCH (p:Person) WITH p AS q WHERE EXISTS { MATCH s = shortestPath((q)-[*]-(p)) } RETURN q.name"
        error: "p is not defined: a variable is bound by a pattern, a WITH or an UNWIND before it is used."
      - cypher: "MATCH (p:Person) WITH p AS q WHERE EXISTS { (q) ((a)-->(b))+ (p) } RETURN q.name"
        error: "p is not defined: a variable is bound by a pattern, a WITH or an UNWIND before it is used."
      - note: "And within the EXISTS { … } after a WITH of its own, WITH * too."
        cypher: "MATCH (p:Person) WITH p AS q WHERE EXISTS { MATCH (q)-->(m) WITH m MATCH (p)-->(m) RETURN m } RETURN q.name"
        error: "p is not defined: a variable is bound by a pattern, a WITH or an UNWIND before it is used."
      - cypher: "MATCH (p:Person) WITH p AS q WHERE EXISTS { MATCH (q)-->(m) WITH * WHERE (p)-->() RETURN m } RETURN q.name"
        error: "p is not defined: a variable is bound by a pattern, a WITH or an UNWIND before it is used."
      - note: "And within a CALL (*) { … } there, which imports it still dropped, after a WITH of its own too (see queries.yaml, \"CALL imports only what it names\", for one naming only what the WITH passes on)."
        cypher: "MATCH (p:Person) WITH p AS q WHERE EXISTS { CALL (*) { MATCH (p)-->() RETURN 1 AS x } RETURN x } RETURN q.name"
        error: "p is not defined: a variable is bound by a pattern, a WITH or an UNWIND before it is used."
      - cypher: "MATCH (p:Person) WITH p AS q WHERE EXISTS { CALL (*) { WITH 1 AS one MATCH (p)-->() RETURN one } RETURN one } RETURN q.name"
        error: "p is not defined: a variable is bound by a pattern, a WITH or an UNWIND before it is used."
      - note: "And one that imports it by name, in its brackets or its importing WITH."
        cypher: "MATCH (p:Person) WITH p AS q WHERE EXISTS { CALL (p) { MATCH (p)-->() RETURN 1 AS x } RETURN x } RETURN q.name"
        error: "p is not defined: a variable is bound by a pattern, a WITH or an UNWIND before it is used."
      - cypher: "MATCH (p:Person) WITH p AS q WHERE EXISTS { CALL { WITH p MATCH (p)-->() RETURN 1 AS x } RETURN x } RETURN q.name"
        error: "p is not defined: a variable is bound by a pattern, a WITH or an UNWIND before it is used."

  - name: "Pattern in the ORDER BY of a projection that groups, naming a variable it drops"
    description: "After a WITH or a RETURN that aggregates or is DISTINCT, a pattern used as an expression in a term of its ORDER BY that doesn't aggregate names only the items, what its CALL imports or its subquery reads from outside it, and what a comprehension or a pattern around it binds, there or within an EXISTS { … }'s or a COUNT { … }'s WHERE. One that names a variable from before that no item is, a key it renames among them, is refused, as Neo4j refuses it (its 42N29): read as a new node, it would match every row (drivine4j#680). An EXISTS { … }, a COUNT { … } or a pattern comprehension there binds such a variable as its own, as Neo4j does (see queries.yaml, \"Pattern in the ORDER BY of a projection that groups\"). A term that aggregates is checked as before (see \"Implicit grouping key in a body or an ORDER BY\")."
    steps:
      - cypher: "MATCH (p:Person) WITH p AS q, count(*) AS c ORDER BY (p)-->() RETURN q.name"
        error: "p is not defined: a pattern used as an expression binds no new variable, as in Neo4j. Bind it in a MATCH, or test the pattern with EXISTS { … }."
      - cypher: "MATCH (p:Person) WITH p AS q, count(*) AS c ORDER BY (p)-->(), q.name RETURN q.name"
        error: "p is not defined: a pattern used as an expression binds no new variable, as in Neo4j. Bind it in a MATCH, or test the pattern with EXISTS { … }."
      - cypher: "MATCH (p:Person) WITH p AS q, count(*) AS c ORDER BY NOT (p)-->(), q.name RETURN q.name"
        error: "p is not defined: a pattern used as an expression binds no new variable, as in Neo4j. Bind it in a MATCH, or test the pattern with EXISTS { … }."
      - cypher: "MATCH (p:Person) WITH p AS q, count(*) AS c ORDER BY (q)-[:KNOWS]->(p), q.name RETURN q.name"
        error: "p is not defined: a pattern used as an expression binds no new variable, as in Neo4j. Bind it in a MATCH, or test the pattern with EXISTS { … }."
      - cypher: "MATCH (p:Person) WITH p AS q, count(*) AS c ORDER BY (q)-->() AND (p)-->(), q.name RETURN q.name"
        error: "p is not defined: a pattern used as an expression binds no new variable, as in Neo4j. Bind it in a MATCH, or test the pattern with EXISTS { … }."
      - cypher: "MATCH (p:Person)-[:ACTED_IN]->(m) WITH p, count(*) AS c ORDER BY (m)<--(), p.name RETURN p.name, c"
        error: "m is not defined: a pattern used as an expression binds no new variable, as in Neo4j. Bind it in a MATCH, or test the pattern with EXISTS { … }."
      - note: "DISTINCT too, and a RETURN that groups."
        cypher: "MATCH (p:Person) WITH DISTINCT p AS q ORDER BY (p)-->(), q.name RETURN q.name"
        error: "p is not defined: a pattern used as an expression binds no new variable, as in Neo4j. Bind it in a MATCH, or test the pattern with EXISTS { … }."
      - cypher: "MATCH (p:Person) RETURN p.name AS n, count(*) AS c ORDER BY (p)-->(), n"
        error: "p is not defined: a pattern used as an expression binds no new variable, as in Neo4j. Bind it in a MATCH, or test the pattern with EXISTS { … }."
      - cypher: "MATCH (p:Person) RETURN p.name AS n, count(*) AS c ORDER BY NOT (p)-->(), n"
        error: "p is not defined: a pattern used as an expression binds no new variable, as in Neo4j. Bind it in a MATCH, or test the pattern with EXISTS { … }."
      - cypher: "MATCH (p:Person) RETURN DISTINCT p.name AS n ORDER BY (p)-->(), n"
        error: "p is not defined: a pattern used as an expression binds no new variable, as in Neo4j. Bind it in a MATCH, or test the pattern with EXISTS { … }."
      - note: "Within a comprehension's WHERE, and an EXISTS { … }'s or a COUNT { … }'s."
        cypher: "MATCH (p:Person) WITH p AS q, count(*) AS c ORDER BY size([(q)-->(x) WHERE (x)<--(p) | x]), q.name RETURN q.name"
        error: "p is not defined: a pattern used as an expression binds no new variable, as in Neo4j. Bind it in a MATCH, or test the pattern with EXISTS { … }."
      - cypher: "MATCH (p:Person) WITH p AS q, count(*) AS c ORDER BY size([y IN [1] WHERE (p)-->()]), q.name RETURN q.name"
        error: "p is not defined: a pattern used as an expression binds no new variable, as in Neo4j. Bind it in a MATCH, or test the pattern with EXISTS { … }."
      - cypher: "MATCH (p:Person) WITH p AS q, count(*) AS c ORDER BY COUNT { (q)-->(x) WHERE (x)<--(p) }, q.name RETURN q.name"
        error: "p is not defined: a pattern used as an expression binds no new variable, as in Neo4j. Bind it in a MATCH, or test the pattern with EXISTS { … }."
      - cypher: "MATCH (p:Person) WITH p AS q, count(*) AS c ORDER BY EXISTS { MATCH (q)-->(x) WHERE (x)<--(p) }, q.name RETURN q.name"
        error: "p is not defined: a pattern used as an expression binds no new variable, as in Neo4j. Bind it in a MATCH, or test the pattern with EXISTS { … }."
      - note: "A variable a CALL's leading WITH imports, which its grouping RETURN drops, as it drops any of its own."
        cypher: "MATCH (p:Person) CALL { WITH p MATCH (x) RETURN x, count(*) AS c ORDER BY NOT (p)-->(), x } RETURN count(*)"
        error: "p is not defined: a pattern used as an expression binds no new variable, as in Neo4j. Bind it in a MATCH, or test the pattern with EXISTS { … }."

  - name: "Quantified path pattern's group naming a variable bound outside it"
    description: "A quantified path pattern's group names no variable bound outside it, as its own, as Neo4j refuses (its 42N07, and at the top of a MATCH its 42N59; see \"Quantified path patterns refused\"): in an EXISTS { … }, a COUNT { … } or a CALL { … } too, and in the WHERE or the ORDER BY of a WITH that neither groups nor is DISTINCT, a variable from before the WITH that it drops, which Neo4j still reads there, and in the WHERE and the ORDER BY of a subquery's own WITH or RETURN there, and in a subquery of those (drivine4j#681). After one that groups or is DISTINCT, Neo4j reads none there, and the group binds such a name as its own (see queries.yaml, \"Quantified path pattern's group naming a variable a WITH dropped\")."
    steps:
      - cypher: "MATCH (p:Person) MATCH (q:Person) WHERE EXISTS { (q) ((p)-->(b))+ () } RETURN q.name"
        error: "p is bound outside the quantified path pattern that names it."
      - cypher: "MATCH (p:Person)-[r]->() MATCH (q:Person) WHERE EXISTS { (q) (()-[r]->())+ () } RETURN q.name"
        error: "r is bound outside the quantified path pattern that names it."
      - cypher: "WITH 1 AS p MATCH (q:Person) WHERE EXISTS { (q) ((p)-->(b))+ () } RETURN q.name"
        error: "p is bound outside the quantified path pattern that names it."
      - cypher: "MATCH (p:Person) WITH p WHERE EXISTS { (p) ((p)-->(b))+ () } RETURN p.name"
        error: "p is bound outside the quantified path pattern that names it."
