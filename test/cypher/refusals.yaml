        error: "A relationship variable bound before its pattern is Cypher, and is not compiled to SQL yet."
      - cypher: "MATCH ()-[r1]->()-[r2]->() WITH [r1, r2] AS rs LIMIT 1 MATCH (first), (second) WHERE EXISTS { (first)-[rs*]->(second) } RETURN labels(first), labels(second)"
        error: "A relationship variable bound before its pattern is Cypher, and is not compiled to SQL yet."
