  - name: "Relationship or path a write makes, read in its properties"
    description: "A relationship or a path a CREATE makes, read in a property the same clause makes, is refused, as Neo4j 2026.10.1 refuses it, and a node it makes, there (its 42I58, liberation-data/drivine4j#814; see \"Values a write makes, by position and form\")."
    steps:
      - cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'x'})-[r:CyR]->(m:CyMade {f: type(r)}) RETURN m.f"
        error: "Creating an entity (r) and referencing that entity in a property definition in the same CREATE is not allowed, as in Neo4j: only reference variables created in earlier clauses. Make it in a clause before, or SET the property after."
      - cypher: "MATCH (n:CyWrite) CREATE p = (a:CyNew {name: 'x'})-[:CyR]->(m:CyMade {f: length(p)}) RETURN m.f"
        error: "Creating an entity (p) and referencing that entity in a property definition in the same CREATE is not allowed, as in Neo4j: only reference variables created in earlier clauses. Make it in a clause before, or SET the property after."
      - note: "Within a list comprehension too."
        cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'x'}), (m:CyMade {f: [x IN [1] | a.name]}) RETURN m.f"
        error: "Creating an entity (a) and referencing that entity in a property definition in the same CREATE is not allowed, as in Neo4j: only reference variables created in earlier clauses. Make it in a clause before, or SET the property after."

  - name: "Variable a write makes, read in a subquery in its properties"
    description: "A subquery in a property a CREATE makes that binds a variable the same clause makes, by MATCH, UNWIND or WITH, reads it, and so does one within a pattern comprehension whose pattern names it, as do a pattern's properties, a quantified path pattern's WHERE and properties, a map projection's variable selector, x {a}, and a pattern comprehension's WHERE and projection, whatever its pattern names: refused as Neo4j 2026.10.1 refuses them (its 42I58, liberation-data/drivine4j#817). A comprehension's or a quantifier's variable within the subquery is bound anew, and Neo4j takes it (the steps of writes.yaml that pinned it are now in \"Pattern or subquery in the properties of a CREATE or a MERGE\", where the SQL stores refuse them)."
    steps:
      - note: "MATCH in the subquery binding a: Neo4j's 42I58."
        cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'x'}), (m:CyMade {f: COUNT { MATCH (a:CyWrite)-[:NEXT]->() RETURN a }}) RETURN [n.id, m.f] ORDER BY n.id"
        error: "Creating an entity (a) and referencing that entity in a property definition in the same CREATE is not allowed, as in Neo4j: only reference variables created in earlier clauses. Make it in a clause before, or SET the property after."
      - note: "UNWIND … AS a."
        cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'x'}), (m:CyMade {f: COUNT { UNWIND [1, 2] AS a RETURN a }}) RETURN [n.id, m.f] ORDER BY n.id"
        error: "Creating an entity (a) and referencing that entity in a property definition in the same CREATE is not allowed, as in Neo4j: only reference variables created in earlier clauses. Make it in a clause before, or SET the property after."
      - note: "WITH … AS a."
        cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'x'}), (m:CyMade {f: COUNT { MATCH (y:CyWrite) WITH y AS a RETURN a }}) RETURN [n.id, m.f] ORDER BY n.id"
        error: "Creating an entity (a) and referencing that entity in a property definition in the same CREATE is not allowed, as in Neo4j: only reference variables created in earlier clauses. Make it in a clause before, or SET the property after."
      - note: "A subquery within a pattern comprehension whose pattern names a reads the a the clause makes: EXISTS { … } of a query."
        cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'x'}), (m:CyMade {f: size([(a)-[:NEXT]->(x) WHERE EXISTS { MATCH (a)-[:NEXT]->(:CyWrite {id: 'c'}) } | x])}) RETURN [n.id, m.f] ORDER BY n.id"
        error: "Creating an entity (a) and referencing that entity in a property definition in the same CREATE is not allowed, as in Neo4j: only reference variables created in earlier clauses. Make it in a clause before, or SET the property after."
      - note: "COUNT { … }."
        cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'x'}), (m:CyMade {f: size([(a)-[:NEXT]->(x) WHERE COUNT { MATCH (a)-[:NEXT]->() RETURN 1 } = 2 | x])}) RETURN [n.id, m.f] ORDER BY n.id"
        error: "Creating an entity (a) and referencing that entity in a property definition in the same CREATE is not allowed, as in Neo4j: only reference variables created in earlier clauses. Make it in a clause before, or SET the property after."
      - note: "EXISTS { … } of a pattern."
        cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'x'}), (m:CyMade {f: size([(a)-[:NEXT]->(x) WHERE EXISTS { (a)-[:NEXT]->(:CyWrite {id: 'c'}) } | x])}) RETURN [n.id, m.f] ORDER BY n.id"
        error: "Creating an entity (a) and referencing that entity in a property definition in the same CREATE is not allowed, as in Neo4j: only reference variables created in earlier clauses. Make it in a clause before, or SET the property after."
      - note: "A pattern's properties within a pattern comprehension whose pattern names a read the a the clause makes: a node's."
        cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'b'}), (m:CyMade {f: size([(a)-[:NEXT]->(x {id: a.name}) | x])}) RETURN [n.id, m.f] ORDER BY n.id"
        error: "Creating an entity (a) and referencing that entity in a property definition in the same CREATE is not allowed, as in Neo4j: only reference variables created in earlier clauses. Make it in a clause before, or SET the property after."
      - note: "A relationship's."
        cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'b'})-[:CyR]->(m:CyMade {f: size([(a)-[r:NEXT {w: a.name}]->(x) | x])}) RETURN [n.id, m.f] ORDER BY n.id"
        error: "Creating an entity (a) and referencing that entity in a property definition in the same CREATE is not allowed, as in Neo4j: only reference variables created in earlier clauses. Make it in a clause before, or SET the property after."
      - note: "And where the comprehension's pattern does not name it."
        cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'b'}), (m:CyMade {f: size([(x)-[:NEXT]->(y {id: a.name}) | y])}) RETURN [n.id, m.f] ORDER BY n.id"
        error: "Creating an entity (a) and referencing that entity in a property definition in the same CREATE is not allowed, as in Neo4j: only reference variables created in earlier clauses. Make it in a clause before, or SET the property after."
      - note: "Those of EXISTS { … }'s pattern."
        cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'b'}), (m:CyMade {f: EXISTS { (y:CyWrite {id: a.name}) }}) RETURN [n.id, m.f] ORDER BY n.id"
        error: "Creating an entity (a) and referencing that entity in a property definition in the same CREATE is not allowed, as in Neo4j: only reference variables created in earlier clauses. Make it in a clause before, or SET the property after."
      - note: "Those of a pattern used as an expression."
        cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'b'})-[:CyR]->(m:CyMade {f: NOT (n)-[:NEXT]->({id: a.name})}) RETURN [n.id, m.f] ORDER BY n.id"
        error: "Creating an entity (a) and referencing that entity in a property definition in the same CREATE is not allowed, as in Neo4j: only reference variables created in earlier clauses. Make it in a clause before, or SET the property after."
      - note: "A map projection's variable selector reads it too."
        cypher: "MATCH (n:CyWrite {id: 'a'}) CREATE (a:CyNew {name: 'x'}), (m:CyMade {f: [k IN [n {a}] | k.a.name][0]}) RETURN m.f"
        error: "Creating an entity (a) and referencing that entity in a property definition in the same CREATE is not allowed, as in Neo4j: only reference variables created in earlier clauses. Make it in a clause before, or SET the property after."
      - note: "And within a pattern comprehension whose pattern names a."
        cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'x'}), (m:CyMade {f: size([(a)-[:NEXT]->(x) WHERE [k IN [x {a}] | k.a.id][0] = 'a' | x])}) RETURN [n.id, m.f] ORDER BY n.id"
        error: "Creating an entity (a) and referencing that entity in a property definition in the same CREATE is not allowed, as in Neo4j: only reference variables created in earlier clauses. Make it in a clause before, or SET the property after."
      - note: "A pattern comprehension's WHERE and projection read the a the clause makes, whatever its pattern names: a property of it."
        cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'x'}), (m:CyMade {f: [(a)-[:NEXT]->(x) WHERE a.id = 'b' | x.id]}) RETURN [n.id, m.f] ORDER BY n.id"
        error: "Creating an entity (a) and referencing that entity in a property definition in the same CREATE is not allowed, as in Neo4j: only reference variables created in earlier clauses. Make it in a clause before, or SET the property after."
      - note: "A map projection of it."
        cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'x'}), (m:CyMade {f: size([(a)-[:NEXT]->(x) WHERE a {.id}.id = 'a' | x])}) RETURN [n.id, m.f] ORDER BY n.id"
        error: "Creating an entity (a) and referencing that entity in a property definition in the same CREATE is not allowed, as in Neo4j: only reference variables created in earlier clauses. Make it in a clause before, or SET the property after."
      - note: "A map projection's entry."
        cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'x'}), (m:CyMade {f: size([(a)-[:NEXT]->(x) WHERE x {k: a.id}.k = 'a' | x])}) RETURN [n.id, m.f] ORDER BY n.id"
        error: "Creating an entity (a) and referencing that entity in a property definition in the same CREATE is not allowed, as in Neo4j: only reference variables created in earlier clauses. Make it in a clause before, or SET the property after."
      - note: "A variable selector in a subquery."
        cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'x'}), (m:CyMade {f: COUNT { MATCH (y:CyWrite) RETURN y {a} }}) RETURN [n.id, m.f] ORDER BY n.id"
        error: "Creating an entity (a) and referencing that entity in a property definition in the same CREATE is not allowed, as in Neo4j: only reference variables created in earlier clauses. Make it in a clause before, or SET the property after."
      - note: "A quantified path pattern's WHERE in a subquery: Neo4j's 42I58."
        cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'x'})-[:CyR]->(m:CyMade {f: COUNT { MATCH (n)((x)-[:NEXT]->(y) WHERE y.id <> a.name){1,2}(z) RETURN z }}) RETURN [n.id, m.f] ORDER BY n.id"
        error: "Creating an entity (a) and referencing that entity in a property definition in the same CREATE is not allowed, as in Neo4j: only reference variables created in earlier clauses. Make it in a clause before, or SET the property after."
      - note: "A quantified path pattern's own properties."
        cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'x'})-[:CyR]->(m:CyMade {f: COUNT { MATCH (n)((x)-[:NEXT]->(y {id: a.name})){1,2}(z) RETURN z }}) RETURN [n.id, m.f] ORDER BY n.id"
        error: "Creating an entity (a) and referencing that entity in a property definition in the same CREATE is not allowed, as in Neo4j: only reference variables created in earlier clauses. Make it in a clause before, or SET the property after."
      - note: "In EXISTS { … } of a pattern."
        cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'x'})-[:CyR]->(m:CyMade {f: EXISTS { (n)((x)-[:NEXT]->(y) WHERE y.id <> a.name){1,2}(z) }}) RETURN [n.id, m.f] ORDER BY n.id"
        error: "Creating an entity (a) and referencing that entity in a property definition in the same CREATE is not allowed, as in Neo4j: only reference variables created in earlier clauses. Make it in a clause before, or SET the property after."
      - note: "In EXISTS { … } of a query."
        cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'x'})-[:CyR]->(m:CyMade {f: EXISTS { MATCH (n)((x)-[:NEXT]->(y) WHERE y.id <> a.name){1,2}(z) }}) RETURN [n.id, m.f] ORDER BY n.id"
        error: "Creating an entity (a) and referencing that entity in a property definition in the same CREATE is not allowed, as in Neo4j: only reference variables created in earlier clauses. Make it in a clause before, or SET the property after."
      - note: "In a relationship's properties."
        cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'x'})-[r:CyR {f: COUNT { MATCH (n)((x)-[:NEXT]->(y) WHERE y.id <> a.name){1,2}(z) RETURN z }}]->(m:CyMade) RETURN [n.id, r.f] ORDER BY n.id"
        error: "Creating an entity (a) and referencing that entity in a property definition in the same CREATE is not allowed, as in Neo4j: only reference variables created in earlier clauses. Make it in a clause before, or SET the property after."

  - name: "Node or relationship set as a property"
    description: "A SET of a property to a node or a relationship, or to a list written that holds one, an entry of a map a SET sets, and a property a CREATE or a MERGE makes of one, and so a path or a variable-length relationship's list, is refused, as Neo4j 2026.10.1 refuses it when it runs (its 22N01, \"Expected the value … to be of type BOOLEAN, STRING, INTEGER, FLOAT, …\"): the store would hold it as a document. A MERGE's ON CREATE or ON MATCH SET is refused alike (see \"Values a write makes, by position and form\"). What Neo4j refuses before it runs, a pattern used as a value beside one among it, is refused for that first."
    steps:
      - note: "Neo4j's 22N01 when it runs."
        cypher: "MATCH (n:CyWrite {id: 'a'}), (b:CyWrite {id: 'b'}) SET n.p = b RETURN n.p"
        error: "b is a node, and a property holds no node, relationship or path, as in Neo4j: set a property of it, or its elementId(), instead."
      - cypher: "MATCH (n:CyWrite {id: 'a'})-[r:NEXT]->(:CyWrite {id: 'b'}) SET n.p = r RETURN n.p"
        error: "r is a relationship, and a property holds no node, relationship or path, as in Neo4j: set a property of it, or its elementId(), instead."
      - note: "An entry of a map set, by += and by =."
        cypher: "MATCH (n:CyWrite {id: 'a'}), (b:CyWrite {id: 'b'}) SET n += {p: b} RETURN n.p"
        error: "b is a node, and a property holds no node, relationship or path, as in Neo4j: set a property of it, or its elementId(), instead."
      - cypher: "MATCH (n:CyWrite {id: 'a'}), (b:CyWrite {id: 'b'}) SET n = {id: 'a', p: b} RETURN n.p"
        error: "b is a node, and a property holds no node, relationship or path, as in Neo4j: set a property of it, or its elementId(), instead."
      - note: "A list written that holds one."
        cypher: "MATCH (n:CyWrite {id: 'a'}), (b:CyWrite {id: 'b'}) SET n.p = [b] RETURN n.p"
        error: "b is a node, and a property holds no node, relationship or path, as in Neo4j: set a property of it, or its elementId(), instead."
      - note: "A property a CREATE or a MERGE makes, of a node and of a relationship."
        cypher: "MATCH (n:CyWrite {id: 'a'}), (b:CyWrite {id: 'b'}) CREATE (m:CyMade {p: b}) RETURN m.p"
        error: "b is a node, and a property holds no node, relationship or path, as in Neo4j: set a property of it, or its elementId(), instead."
      - cypher: "MATCH (n:CyWrite {id: 'a'}), (b:CyWrite {id: 'b'}) MERGE (m:CyMade {p: b}) RETURN m.p"
        error: "b is a node, and a property holds no node, relationship or path, as in Neo4j: set a property of it, or its elementId(), instead."
      - cypher: "MATCH (n:CyWrite {id: 'a'})-[r:NEXT]->(b:CyWrite {id: 'b'}) CREATE (n)-[s:CyR {p: r}]->(b) RETURN s.p"
        error: "r is a relationship, and a property holds no node, relationship or path, as in Neo4j: set a property of it, or its elementId(), instead."
      - note: "A path, and a variable-length relationship's list, by SET and by CREATE."
        cypher: "MATCH p = (n:CyWrite {id: 'a'})-[:NEXT]->(:CyWrite {id: 'b'}) SET n.q = p RETURN n.q"
        error: "p is a path, and a property holds no node, relationship or path, as in Neo4j: set a property of it, or its elementId(), instead."
      - cypher: "MATCH (n:CyWrite {id: 'a'})-[rs:NEXT*1..2]->(:CyWrite {id: 'c'}) SET n.q = rs RETURN n.q"
        error: "rs is a list of relationships, and a property holds no node, relationship or path, as in Neo4j: set a property of it, or its elementId(), instead."
      - cypher: "MATCH p = (n:CyWrite {id: 'a'})-[:NEXT]->(:CyWrite {id: 'b'}) CREATE (m:CyMade {q: p}) RETURN m.q"
        error: "p is a path, and a property holds no node, relationship or path, as in Neo4j: set a property of it, or its elementId(), instead."
      - note: "Wherever the write is: in a FOREACH, a CALL, a MERGE's ON CREATE SET, a later SET item, and of a node passed on under another name."
        cypher: "MATCH (n:CyWrite {id: 'a'}), (b:CyWrite {id: 'b'}) FOREACH (i IN [1] | SET n.p = b) RETURN n.p"
        error: "b is a node, and a property holds no node, relationship or path, as in Neo4j: set a property of it, or its elementId(), instead."
      - cypher: "MATCH (n:CyWrite {id: 'a'}), (b:CyWrite {id: 'b'}) FOREACH (i IN [1] | CREATE (:CyMade {p: b})) RETURN n.id"
        error: "b is a node, and a property holds no node, relationship or path, as in Neo4j: set a property of it, or its elementId(), instead."
      - cypher: "MATCH (n:CyWrite {id: 'a'}), (b:CyWrite {id: 'b'}) CALL (n, b) { SET n.p = b } RETURN n.p"
        error: "b is a node, and a property holds no node, relationship or path, as in Neo4j: set a property of it, or its elementId(), instead."
      - cypher: "MATCH (n:CyWrite {id: 'a'}), (b:CyWrite {id: 'b'}) MERGE (m:CyMade {id: 1}) ON CREATE SET m += {p: b} RETURN m.p"
        error: "b is a node, and a property holds no node, relationship or path, as in Neo4j: set a property of it, or its elementId(), instead."
      - cypher: "MATCH (n:CyWrite {id: 'a'}), (b:CyWrite {id: 'b'}) SET n.p = b.id, n.q = b RETURN n.p"
        error: "b is a node, and a property holds no node, relationship or path, as in Neo4j: set a property of it, or its elementId(), instead."
      - cypher: "MATCH (n:CyWrite {id: 'a'}), (b:CyWrite {id: 'b'}) WITH n, b AS c SET n.p = c RETURN n.p"
        error: "c is a node, and a property holds no node, relationship or path, as in Neo4j: set a property of it, or its elementId(), instead."
      - cypher: "MATCH (n:CyWrite {id: 'a'})-[r:NEXT]->(b:CyWrite {id: 'b'}) MERGE (n)-[s:CyR {p: [r]}]->(b) RETURN s.p"
        error: "r is a relationship, and a property holds no node, relationship or path, as in Neo4j: set a property of it, or its elementId(), instead."
      - note: "What Neo4j refuses before it runs comes first: a pattern used as a value beside one (its 42I34)."
        cypher: "MATCH (n:CyWrite {id: 'a'}), (b:CyWrite {id: 'b'}) SET n.p = [b, (n)-->()] RETURN n.p"
        error: "A pattern expression can only be used to test the existence of a pattern, as in Neo4j: as a condition, as in a WHERE. Use a pattern comprehension instead, as in [(a)-->(b) | b], or EXISTS { … } or COUNT { … }."
      - cypher: "MATCH (n:CyWrite {id: 'a'}), (b:CyWrite {id: 'b'}) SET n += {p: b, q: (n)-->()} RETURN n.p"
        error: "A pattern expression can only be used to test the existence of a pattern, as in Neo4j: as a condition, as in a WHERE. Use a pattern comprehension instead, as in [(a)-->(b) | b], or EXISTS { … } or COUNT { … }."

  - name: "Aggregate in a WHERE"
    description: "An aggregate in a WHERE is refused, as Neo4j refuses it (its 42I24, \"invalid use of aggregate function\"): of a MATCH or a WITH that groups nothing, a pattern comprehension, a list comprehension, a quantifier, a quantified path pattern, EXISTS { … } and COUNT { … }, in a subquery's or a CALL { … }'s query too, and in a comprehension's, a quantifier's or a pattern's own WHERE or body within the WHERE of a WITH that groups. The WHERE of a WITH that aggregates, or is DISTINCT, holds an aggregate, and so does one after a subquery or a CALL that aggregates in its own projection (see queries.yaml, \"Aggregate in the WHERE of a WITH that groups\" and \"Aggregate beside a WHERE\")."
    steps:
      - cypher: "UNWIND [1, 2] AS i WITH i WHERE sum(i) > 1 RETURN i"
        error: "sum() aggregates, and a WHERE holds no aggregate unless its WITH aggregates, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - note: "Within a condition of several, too."
        cypher: "UNWIND [1, 2] AS i WITH i WHERE i > 1 AND count(*) > 0 RETURN i"
        error: "count(*) aggregates, and a WHERE holds no aggregate unless its WITH aggregates, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - cypher: "MATCH (n) WHERE count(*) > 1 RETURN n"
        error: "count(*) aggregates, and a WHERE holds no aggregate unless its WITH aggregates, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - cypher: "MATCH (n) WHERE sum(n.x) > 1 RETURN n"
        error: "sum() aggregates, and a WHERE holds no aggregate unless its WITH aggregates, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - cypher: "MATCH (a) WHERE a.x IN collect(a.y) RETURN a"
        error: "collect() aggregates, and a WHERE holds no aggregate unless its WITH aggregates, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - note: "A pattern comprehension's WHERE."
        cypher: "MATCH (n) RETURN [(n)-->(m) WHERE count(m) > 1 | m] AS ms"
        error: "count() aggregates, and a WHERE holds no aggregate unless its WITH aggregates, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - note: "A quantifier's WHERE."
        cypher: "UNWIND [[1, 2]] AS l RETURN all(x IN l WHERE sum(x) > 1) AS a"
        error: "sum() aggregates, and a WHERE holds no aggregate unless its WITH aggregates, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - note: "A list comprehension's WHERE."
        cypher: "UNWIND [[1, 2]] AS l RETURN [x IN l WHERE count(x) > 1 | x] AS a"
        error: "count() aggregates, and a WHERE holds no aggregate unless its WITH aggregates, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - note: "A quantified path pattern's WHERE."
        cypher: "MATCH (a) ((x)-[:R]->(y) WHERE count(x) > 1)+ (b) RETURN a"
        error: "count() aggregates, and a WHERE holds no aggregate unless its WITH aggregates, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - note: "The WHERE of EXISTS { … } and COUNT { … } of a pattern."
        cypher: "MATCH (n) WHERE EXISTS { (n)-->(m) WHERE count(m) > 1 } RETURN n"
        error: "count() aggregates, and a WHERE holds no aggregate unless its WITH aggregates, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - cypher: "MATCH (n) WHERE COUNT { (n)-->(m) WHERE count(m) > 1 } > 0 RETURN n"
        error: "count() aggregates, and a WHERE holds no aggregate unless its WITH aggregates, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - note: "A WHERE in a subquery's own query."
        cypher: "MATCH (n) WHERE EXISTS { MATCH (n)-->(m) WHERE count(m) > 1 RETURN m } RETURN n"
        error: "count() aggregates, and a WHERE holds no aggregate unless its WITH aggregates, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - cypher: "MATCH (n) RETURN COUNT { MATCH (n)-->(m) WITH m WHERE count(m) > 1 RETURN m } AS c"
        error: "count() aggregates, and a WHERE holds no aggregate unless its WITH aggregates, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - note: "A WHERE in a CALL { … }."
        cypher: "UNWIND [1, 2] AS i CALL (i) { WITH i WHERE sum(i) > 1 RETURN i AS j } RETURN j"
        error: "sum() aggregates, and a WHERE holds no aggregate unless its WITH aggregates, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - cypher: "UNWIND [1, 2] AS i CALL (i) { MATCH (n) WHERE count(n) > i RETURN n } RETURN n"
        error: "count() aggregates, and a WHERE holds no aggregate unless its WITH aggregates, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - cypher: "UNWIND [1, 2] AS i CALL { WITH i MATCH (n) WHERE max(n.x) > i RETURN n } RETURN n"
        error: "max() aggregates, and a WHERE holds no aggregate unless its WITH aggregates, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - note: "A WITH whose only aggregate is in its WHERE groups nothing."
        cypher: "UNWIND [1, 1, 2] AS i WITH i WHERE count(*) > 1 RETURN i"
        error: "count(*) aggregates, and a WHERE holds no aggregate unless its WITH aggregates, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - cypher: "UNWIND [1, 1, 2] AS i WITH * WHERE count(*) > 1 RETURN i"
        error: "count(*) aggregates, and a WHERE holds no aggregate unless its WITH aggregates, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - note: "In the WHERE of a WITH that groups, a comprehension's, a quantifier's or a pattern's own WHERE or body holds none either."
        cypher: "UNWIND [1, 1, 2] AS i WITH i, count(*) AS c WHERE all(x IN [1] WHERE count(*) > x) RETURN i, c"
        error: "count(*) aggregates, and a WHERE holds no aggregate unless its WITH aggregates, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - cypher: "UNWIND [1, 1, 2] AS i WITH i, count(*) AS c WHERE size([x IN [1] WHERE count(*) > x | x]) > 0 RETURN i, c"
        error: "count(*) aggregates, and a WHERE holds no aggregate unless its WITH aggregates, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - cypher: "UNWIND [1, 1, 2] AS i WITH i, count(*) AS c WHERE [x IN [1] | x + count(*)][0] > 2 RETURN i, c"
        error: "count(*) aggregates, and a WHERE holds no aggregate unless its WITH aggregates, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - cypher: "MATCH (p:Person)-[:ACTED_IN]->(m) WITH p, count(*) AS c WHERE size([(p)-[:ACTED_IN]->(x) WHERE count(x) > 1 | x]) > 0 RETURN p.name"
        error: "count() aggregates, and a WHERE holds no aggregate unless its WITH aggregates, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - cypher: "MATCH (p:Person)-[:ACTED_IN]->(m) WITH p, count(*) AS c WHERE EXISTS { (p)-[:KNOWS]->(q) WHERE count(q) > 0 } RETURN p.name"
        error: "count() aggregates, and a WHERE holds no aggregate unless its WITH aggregates, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."

  - name: "Variable before a WITH that groups, in its WHERE"
    description: "The WHERE of a WITH that aggregates, or is DISTINCT, reads a variable from before the WITH only inside an aggregate, or where it is a key the WITH groups by, written as its item is (see queries.yaml, \"Aggregate in the WHERE of a WITH that groups\"). Any other is refused, as Neo4j refuses it (its 42N44, \"inaccessible variable\", or beside an aggregate its 42I18). So is an aggregate of a variable the WITH declares (Neo4j's 42I79), and of a key's name or of a key read in a quantifier, which Neo4j fails within (its 50N00)."
    steps:
      - cypher: "UNWIND [1, 2, 3] AS i WITH i % 2 AS k, count(*) AS c WHERE i > 0 RETURN k, c"
        error: "i is not defined: a variable is bound by a pattern, a WITH or an UNWIND before it is used."
      - cypher: "UNWIND [1, 2, 3] AS i WITH i % 2 AS k, count(*) AS c WHERE sum(i) > 2 AND i > 0 RETURN k, c"
        error: "i is not defined: a variable is bound by a pattern, a WITH or an UNWIND before it is used."
      - cypher: "UNWIND [1, 2, 3] AS i WITH DISTINCT i % 2 AS k WHERE i > 0 RETURN k"
        error: "i is not defined: a variable is bound by a pattern, a WITH or an UNWIND before it is used."
      - cypher: "MATCH (p:Person)-[:ACTED_IN]->(m) WITH p.name AS n, count(*) AS c WHERE p.born > 1965 RETURN n, c"
        error: "p is not defined: a variable is bound by a pattern, a WITH or an UNWIND before it is used."
      - cypher: "MATCH (p:Person)-[:ACTED_IN]->(m) WITH p, count(*) AS c WHERE m.released > 1996 RETURN p.name"
        error: "m is not defined: a variable is bound by a pattern, a WITH or an UNWIND before it is used."
      - cypher: "UNWIND [1, 1, 2] AS i WITH i, count(*) AS c WHERE sum(c) > 1 RETURN i, c"
        error: "c is not defined: a variable is bound by a pattern, a WITH or an UNWIND before it is used."
      - cypher: "UNWIND [1, 1, 2] AS i WITH i AS j, count(*) AS c WHERE sum(j) > 1 RETURN j, c"
        error: "j is not defined: a variable is bound by a pattern, a WITH or an UNWIND before it is used."
      - note: "A pattern in the WHERE names only what the WITH passes on, not a key it renames, nor a variable it drops (drivine4j#504)."
        cypher: "MATCH (p:Person)-[:ACTED_IN]->(m) WITH p AS q, count(*) AS c WHERE (p)-[:KNOWS]->() RETURN q.name, c"
        error: "p is not defined: a variable is bound by a pattern, a WITH or an UNWIND before it is used."
      - cypher: "MATCH (p:Person)-[:ACTED_IN]->(m) WITH p, count(*) AS c WHERE (m)<--() RETURN p.name, c"
        error: "m is not defined: a variable is bound by a pattern, a WITH or an UNWIND before it is used."
      - cypher: "MATCH (p:Person) WITH DISTINCT p AS q WHERE (p)-->() RETURN q.name"
        error: "p is not defined: a variable is bound by a pattern, a WITH or an UNWIND before it is used."
      - note: "A variable a comprehension binds again within the WHERE is its own."
        cypher: "MATCH (p:Person) WITH p.name AS n, count(*) AS c WHERE size([p IN [1] WHERE (p)-->() | p]) > 0 RETURN n"
        error: "p is not a node, and is used as one in a pattern."
      - cypher: "UNWIND [1, 1, 2] AS i WITH i AS j, count(*) AS c WHERE any(x IN [1] WHERE x = i) RETURN j, c"
        error: "i is not defined: a variable is bound by a pattern, a WITH or an UNWIND before it is used."

  - name: "Implicit grouping key in a body or an ORDER BY"
    description: "An item that aggregates, and names, beside its aggregates or in a comprehension's, a quantifier's, a reduce()'s or a pattern's body, a variable outside each item that does not aggregate, is refused, as Neo4j refuses it (its 42I18, \"reference to non-grouping sub-expression\"); there, a key is read only where it is a variable or a variable's property, and in a pattern's parts only where it is a variable. So is a term of an ORDER BY that aggregates, after items that aggregate, and names a variable outside the items. What Neo4j takes beside them is in queries.yaml, \"Implicit grouping key\"."
    steps:
      - note: "A list comprehension's body: z is no grouping key, though x is."
        cypher: "UNWIND [1, 2] AS x UNWIND [3] AS z RETURN x, [y IN collect(z) | y + z] AS l"
        error: "l aggregates, and names z outside its aggregates, which no other item is: Cypher would group by it without being told. Aggregate in a WITH first, as in WITH z, collect(…) AS items RETURN { … }."
      - note: "In a WITH too."
        cypher: "UNWIND [1, 2] AS x UNWIND [3] AS z WITH x, [y IN collect(z) | y + z] AS l RETURN x, l"
        error: "l aggregates, and names z outside its aggregates, which no other item is: Cypher would group by it without being told. Aggregate in a WITH first, as in WITH z, collect(…) AS items RETURN { … }."
      - note: "A list comprehension's WHERE."
        cypher: "UNWIND [1, 2] AS x UNWIND [3] AS z RETURN x, [y IN collect(x) WHERE y > z | y] AS l"
        error: "l aggregates, and names z outside its aggregates, which no other item is: Cypher would group by it without being told. Aggregate in a WITH first, as in WITH z, collect(…) AS items RETURN { … }."
      - note: "A quantifier's WHERE."
        cypher: "UNWIND [1, 2] AS x UNWIND [3] AS z RETURN x, any(y IN collect(x) WHERE y > z) AS l"
        error: "l aggregates, and names z outside its aggregates, which no other item is: Cypher would group by it without being told. Aggregate in a WITH first, as in WITH z, collect(…) AS items RETURN { … }."
      - note: "A reduce()'s step."
        cypher: "UNWIND [1, 2] AS x UNWIND [3] AS z RETURN x, reduce(s = 0, y IN collect(x) | s + z) AS l"
        error: "l aggregates, and names z outside its aggregates, which no other item is: Cypher would group by it without being told. Aggregate in a WITH first, as in WITH z, collect(…) AS items RETURN { … }."
      - note: "x.b is no grouping key, though x.a is."
        cypher: "UNWIND [{a: 1, b: 2}] AS x RETURN x.a, [y IN collect(x) | y.a + x.b] AS l"
        error: "l aggregates, and names x outside its aggregates, which no other item is: Cypher would group by it without being told. Aggregate in a WITH first, as in WITH x, collect(…) AS items RETURN { … }."
      - note: "A pattern comprehension's pattern names n, which no item is."
        cypher: "MATCH (n) RETURN size([(n)-->(m) | m]) + count(*) AS c"
        error: "c aggregates, and names n outside its aggregates, which no other item is: Cypher would group by it without being told. Aggregate in a WITH first, as in WITH n, collect(…) AS items RETURN { … }."
      - cypher: "MATCH (n) RETURN n.x, size([(n)-->(m) | m.x]) + count(*) AS c"
        error: "c aggregates, and names n outside its aggregates, which no other item is: Cypher would group by it without being told. Aggregate in a WITH first, as in WITH n, collect(…) AS items RETURN { … }."
      - note: "So does EXISTS { … } of a pattern."
        cypher: "MATCH (n) RETURN EXISTS { (n)-->() } AND count(*) > 0 AS b"
        error: "b aggregates, and names n outside its aggregates, which no other item is: Cypher would group by it without being told. Aggregate in a WITH first, as in WITH n, collect(…) AS items RETURN { … }."
      - note: "An ORDER BY term after items that aggregate: x.b is no grouping key, though x.a is."
        cypher: "UNWIND [{a: 1}, {a: 2}] AS x RETURN x.a AS a, count(*) AS c ORDER BY x.b + count(*)"
        error: "A term of an ORDER BY aggregates, and names x outside its aggregates and the items: Cypher would group by it without being told. Order by an item's name, or by an expression of the items and aggregates."
      - cypher: "UNWIND [{a: 1, b: 2}] AS x WITH x.a AS a, count(*) AS c ORDER BY x.b + count(*) RETURN a"
        error: "A term of an ORDER BY aggregates, and names x outside its aggregates and the items: Cypher would group by it without being told. Order by an item's name, or by an expression of the items and aggregates."
      - cypher: "UNWIND [1, 2] AS x UNWIND [3] AS z RETURN x, count(*) AS c ORDER BY z + count(*)"
        error: "A term of an ORDER BY aggregates, and names z outside its aggregates and the items: Cypher would group by it without being told. Order by an item's name, or by an expression of the items and aggregates."
      - cypher: "UNWIND [1, 2] AS x UNWIND [3] AS z RETURN x, count(*) AS c ORDER BY [w IN collect(z) | w + z]"
        error: "A term of an ORDER BY aggregates, and names z outside its aggregates and the items: Cypher would group by it without being told. Order by an item's name, or by an expression of the items and aggregates."
      - note: "The openCypher TCK's ReturnOrderBy6 [4]."
        cypher: "MATCH (me:Person)--(you:Person) RETURN count(you.age) AS agg ORDER BY me.age + count(you.age)"
        error: "A term of an ORDER BY aggregates, and names me outside its aggregates and the items: Cypher would group by it without being told. Order by an item's name, or by an expression of the items and aggregates."
      - note: "An item that aggregates reads as a key only one that is a variable or a variable's property: x.b is no key, though x.a is."
        cypher: "UNWIND [{a: 1, b: 2}] AS x RETURN x.a AS a, x.b + count(*) AS c"
        error: "c aggregates, and names x outside its aggregates, which no other item is: Cypher would group by it without being told. Aggregate in a WITH first, as in WITH x, collect(…) AS items RETURN { … }."
      - note: "Nor a key of another shape, beside its aggregates or in a body."
        cypher: "MATCH (p:Person)-[:ACTED_IN]->(m) RETURN toUpper(p.name) AS u, toUpper(p.name) + count(*) AS c ORDER BY u"
        error: "c aggregates, and names p outside its aggregates, which no other item is: Cypher would group by it without being told. Aggregate in a WITH first, as in WITH p, collect(…) AS items RETURN { … }."
      - cypher: "MATCH (p:Person)-[:ACTED_IN]->(m) RETURN toUpper(p.name) AS u, [t IN collect(m.title) | t + toUpper(p.name)] AS c ORDER BY u"
        error: "c aggregates, and names p outside its aggregates, which no other item is: Cypher would group by it without being told. Aggregate in a WITH first, as in WITH p, collect(…) AS items RETURN { … }."
      - cypher: "UNWIND [{a: {b: 1}}, {a: {b: 1}}, {a: {b: 2}}] AS x RETURN x.a.b AS k, x.a.b + count(*) AS c ORDER BY k"
        error: "c aggregates, and names x outside its aggregates, which no other item is: Cypher would group by it without being told. Aggregate in a WITH first, as in WITH x, collect(…) AS items RETURN { … }."
      - cypher: "UNWIND [{a: {b: 1}}, {a: {b: 1}}, {a: {b: 2}}] AS x RETURN x.a.b AS k, [y IN collect(x) | y.a.b + x.a.b] AS c ORDER BY k"
        error: "c aggregates, and names x outside its aggregates, which no other item is: Cypher would group by it without being told. Aggregate in a WITH first, as in WITH x, collect(…) AS items RETURN { … }."
      - cypher: "UNWIND [{a: 1}, {a: 1}, {a: 2}] AS x RETURN x.a + 1 AS k, x.a + 1 + count(*) AS c ORDER BY k"
        error: "c aggregates, and names x outside its aggregates, which no other item is: Cypher would group by it without being told. Aggregate in a WITH first, as in WITH x, collect(…) AS items RETURN { … }."
      - cypher: "UNWIND [{a: 1}, {a: 1}, {a: 2}] AS x RETURN x['a'] AS a, x['a'] + count(*) AS b ORDER BY a"
        error: "b aggregates, and names x outside its aggregates, which no other item is: Cypher would group by it without being told. Aggregate in a WITH first, as in WITH x, collect(…) AS items RETURN { … }."
      - note: "In a pattern's parts, a key that is a property is no key: p.name is read as p."
        cypher: "MATCH (p:Person)-[:ACTED_IN]->(m) RETURN p.name AS name, size([(q:Person)-[:KNOWS]->() WHERE q.name = p.name | q]) + count(*) AS c ORDER BY name"
        error: "c aggregates, and names p outside its aggregates, which no other item is: Cypher would group by it without being told. Aggregate in a WITH first, as in WITH p, collect(…) AS items RETURN { … }."
      - cypher: "MATCH (p:Person)-[:ACTED_IN]->(m) RETURN p.name AS name, [x IN collect(m) | size([(x)<-[:ACTED_IN]-(q) WHERE q.name = p.name | q])] AS c ORDER BY name"
        error: "c aggregates, and names p outside its aggregates, which no other item is: Cypher would group by it without being told. Aggregate in a WITH first, as in WITH p, collect(…) AS items RETURN { … }."
      - note: "Unnamed, a map projection is the item p, not the variable p."
        cypher: "MATCH (p:Person)-[:ACTED_IN]->(m) RETURN p {.name}, count(*) + size(p.name) AS c ORDER BY p.name"
        error: "c aggregates, and names p outside its aggregates, which no other item is: Cypher would group by it without being told. Aggregate in a WITH first, as in WITH p, collect(…) AS items RETURN { … }."
      - cypher: "MATCH (p:Person)-[:ACTED_IN]->(m) RETURN p {.name} AS q, p {.name}.name + count(*) AS c"
        error: "c aggregates, and names p outside its aggregates, which no other item is: Cypher would group by it without being told. Aggregate in a WITH first, as in WITH p, collect(…) AS items RETURN { … }."

  - name: "Neo4j schema DDL a SQL store cannot honour"
    description: "Neo4j's schema commands for what Drivine's schema has no counterpart of on a SQL store are refused by name: POINT and LOOKUP indexes, relationship indexes and constraints, an item over several labels, existence, key and type constraints, a vector index over several properties, WITH properties to filter by, or no dimensions. Neo4j makes them, or refuses them with its own words. See schema.yaml."
    steps:
      - cypher: "CREATE POINT INDEX FOR (p:Place) ON (p.location)"
        error: "A POINT index is Neo4j's, and is not made on a SQL store."
      - cypher: "CREATE LOOKUP INDEX node_labels FOR (n) ON EACH labels(n)"
        error: "A LOOKUP index is Neo4j's, and is not made on a SQL store, which finds a node's labels without one."
      - cypher: "CREATE INDEX FOR ()-[r:KNOWS]-() ON (r.since)"
        error: "An index on relationships is not made on a SQL store: Drivine's schema is of nodes."
      - cypher: "CREATE CONSTRAINT FOR ()-[r:KNOWS]-() REQUIRE r.id IS UNIQUE"
        error: "A constraint on relationships is not made on a SQL store: Drivine's schema is of nodes."
      - cypher: "CREATE FULLTEXT INDEX titles FOR (n:Book|Film) ON EACH [n.title]"
        error: "A full-text index over several labels is not made on a SQL store: declare one for each label."
      - cypher: "CREATE CONSTRAINT FOR (p:Person) REQUIRE p.name IS NOT NULL"
        error: "A property existence constraint (IS NOT NULL) is not made on a SQL store: Drivine's schema has uniqueness constraints only."
      - cypher: "CREATE CONSTRAINT FOR (p:Person) REQUIRE (p.first, p.last) IS NODE KEY"
        error: "A key constraint (IS NODE KEY) is not made on a SQL store: Drivine's schema has uniqueness constraints only."
      - cypher: "CREATE CONSTRAINT FOR (p:Person) REQUIRE p.id IS KEY"
        error: "A key constraint (IS NODE KEY) is not made on a SQL store: Drivine's schema has uniqueness constraints only."
      - cypher: "CREATE CONSTRAINT FOR (p:Person) REQUIRE p.name IS :: STRING"
        error: "A property type constraint (IS :: TYPE) is not made on a SQL store: Drivine's schema has uniqueness constraints only."
      - cypher: "CREATE VECTOR INDEX FOR (c:Chunk) ON (c.a, c.b) OPTIONS {indexConfig: {`vector.dimensions`: 3}}"
        error: "A vector index is over one property, and this names 2."
      - cypher: "CREATE VECTOR INDEX FOR (c:Chunk) ON c.embedding WITH [c.lang] OPTIONS {indexConfig: {`vector.dimensions`: 3}}"
        error: "A vector index WITH properties to filter by is not made on a SQL store."
      - cypher: "CREATE VECTOR INDEX FOR (c:Chunk) ON c.embedding"
        error: "A vector index on a SQL store needs `vector.dimensions` in its OPTIONS indexConfig: nothing else gives the size of its embeddings."

  - name: "Neo4j schema DDL is no query"
    description: "A schema command a SQL store honours is not compiled to SQL: a PersistenceManager applies it to the store's schema (see writes.yaml)."
    steps:
      - cypher: "CREATE INDEX FOR (p:Person) ON (p.name)"
        error: "The statement is a schema command, which is not compiled to SQL: run it through a PersistenceManager, which applies it to the store's schema."
      - cypher: "DROP CONSTRAINT person_email IF EXISTS"
        error: "The statement is a schema command, which is not compiled to SQL: run it through a PersistenceManager, which applies it to the store's schema."
      - cypher: "CALL db.awaitIndexes(300)"
        error: "The statement is a schema command, which is not compiled to SQL: run it through a PersistenceManager, which applies it to the store's schema."

  - name: "Vector search a SQL store does not take"
    description: "Of Neo4j's vector search, what a SQL store has no counterpart of is refused by name: a search of a vector index on relationships, which a SQL store doesn't make, and Neo4j's VECTOR type and its functions, as an embedding there is a list of numbers. db.create.setNodeVectorProperty() is refused for a SET, and a number of neighbours written as a float, 1.5 or 2.0, as Neo4j refuses it. A search by db.index.vector.queryNodes() is compiled (liberation-data/drivine-cypher-spec#160). See vector.yaml."
    steps:
      - cypher: "CALL db.index.vector.queryRelationships('chunk_cos', 10, [1.0, 0.0, 0.0]) YIELD relationship, score RETURN score"
        error: "A vector index on relationships is not made on a SQL store, so db.index.vector.queryRelationships() has none to search."
      - cypher: "CALL db.index.vector.queryRelationships('chunk_cos', 10, [1.0, 0.0, 0.0])"
        error: "A vector index on relationships is not made on a SQL store, so db.index.vector.queryRelationships() has none to search."
      - note: "Neo4j sets the property to the list. A word Cypher keeps, create, may be part of a procedure's name."
        cypher: "MATCH (n:Chunk {id: 'f'}) CALL db.create.setNodeVectorProperty(n, 'embedding', [0.0, 0.0, 1.0]) RETURN n.embedding"
        error: "db.create.setNodeVectorProperty() is not compiled to SQL: set the embedding as a list with SET, as in SET n.embedding = [0.1, 0.2, 0.3]."
      - note: "Neo4j takes no list here, only a VECTOR."
        cypher: "RETURN vector_distance([1.0, 0.0, 0.0], [0.6, 0.8, 0.0], COSINE) AS d"
        error: "vector_distance() is of Neo4j's VECTOR type, which a SQL store doesn't hold: an embedding there is a list of numbers, as vector.similarity.cosine() and vector.similarity.euclidean() take."
      - cypher: "RETURN vector_norm([3.0, 4.0], EUCLIDEAN) AS n"
        error: "vector_norm() is of Neo4j's VECTOR type, which a SQL store doesn't hold: an embedding there is a list of numbers, as vector.similarity.cosine() and vector.similarity.euclidean() take."
      - cypher: "RETURN vector([1, 2, 3], 3, FLOAT32) AS v"
        error: "vector() is of Neo4j's VECTOR type, which a SQL store doesn't hold: an embedding there is a list of numbers, as vector.similarity.cosine() and vector.similarity.euclidean() take."
      - cypher: "RETURN vector_dimension_count(vector([1, 2, 3], 3, FLOAT32)) AS n"
        error: "vector_dimension_count() is of Neo4j's VECTOR type, which a SQL store doesn't hold: an embedding there is a list of numbers, as vector.similarity.cosine() and vector.similarity.euclidean() take."
      - note: "A function's name is matched in any case, as Neo4j matches it."
        cypher: "MATCH (c:Chunk) RETURN VECTOR_NORM(c.embedding, EUCLIDEAN)"
        error: "vector_norm() is of Neo4j's VECTOR type, which a SQL store doesn't hold: an embedding there is a list of numbers, as vector.similarity.cosine() and vector.similarity.euclidean() take."
      - note: "Neo4j 2026.10.1 refuses it before it runs: 22NB1, expected to be INTEGER but was 'FLOAT'."
        cypher: "CALL db.index.vector.queryNodes('chunk_cos', 1.5, [1.0, 0.0, 0.0]) YIELD node, score RETURN node.id, score"
        error: "db.index.vector.queryNodes() takes a whole number of neighbours, not 1.5, as in Neo4j."
      - cypher: "MATCH (q:Chunk {id: 'c'}) CALL db.index.vector.queryNodes('chunk_cos', 2.0, q.embedding) YIELD node RETURN node.id"
        error: "db.index.vector.queryNodes() takes a whole number of neighbours, not 2.0, as in Neo4j."
      - cypher: "CALL db.index.vector.queryNodes('chunk_cos', 2.0, [1.0, 0.0, 0.0])"
        error: "db.index.vector.queryNodes() takes a whole number of neighbours, not 2.0, as in Neo4j."

  - name: "Temporal map field of a text worked out"
    description: "A text from the rows given as the time of localtime({time: …}) is refused, as an integer is, rather than read as the store reads it."
    steps:
      - cypher: "UNWIND ['hello'] AS t RETURN localtime({time: t})"
        error: "localtime() takes a localtime, a time, a localdatetime or a datetime for time, not a text."

  - name: "Parameter map in a matched pattern"
    description: "A parameter's map as a pattern's properties is refused wherever the pattern is matched, in MATCH, OPTIONAL MATCH, MERGE (a node or a relationship), a variable-length relationship, a quantified path, a shortest path, EXISTS { } and a pattern in an expression, as Neo4j refuses it; the message says to match each property. CREATE takes one (see writes.yaml)."
    steps:
      - cypher: "MATCH (n:Person $props) RETURN n"
        parameters: {props: {name: "Keanu"}}
        error: "A parameter's map gives a pattern its properties only in CREATE, as in Cypher: match each one, as in MATCH (n) WHERE n.k = $props.k, or (n {k: $props.k})."
      - cypher: "MATCH (a)-[r:KNOWS $p]->(b) RETURN r"
        parameters: {p: {since: 1999}}
        error: "A parameter's map gives a pattern its properties only in CREATE, as in Cypher: match each one, as in MATCH (n) WHERE n.k = $p.k, or (n {k: $p.k})."
      - cypher: "OPTIONAL MATCH (n $props) RETURN n"
        parameters: {props: {}}
        error: "A parameter's map gives a pattern its properties only in CREATE, as in Cypher: match each one, as in MATCH (n) WHERE n.k = $props.k, or (n {k: $props.k})."
      - cypher: "MERGE (n:Person $props) RETURN n"
        parameters: {props: {name: "Keanu"}}
        error: "A parameter's map gives a pattern its properties only in CREATE, as in Cypher: match each one, as in MATCH (n) WHERE n.k = $props.k, or (n {k: $props.k})."
      - cypher: "MATCH (n) WHERE (n)-->($props) RETURN n"
        parameters: {props: {name: "Keanu"}}
        error: "A parameter's map gives a pattern its properties only in CREATE, as in Cypher: match each one, as in MATCH (n) WHERE n.k = $props.k, or (n {k: $props.k})."
      - cypher: "MERGE (a:Person {name: 'Keanu'})-[r:KNOWS $p]->(b:Person {name: 'Carrie'}) RETURN r"
        parameters: {p: {name: "Keanu"}}
        error: "A parameter's map gives a pattern its properties only in CREATE, as in Cypher: match each one, as in MATCH (n) WHERE n.k = $p.k, or (n {k: $p.k})."
      - cypher: "MATCH (a)-[r:KNOWS*1..2 $p]->(b) RETURN b"
        parameters: {p: {name: "Keanu"}}
        error: "A parameter's map gives a pattern its properties only in CREATE, as in Cypher: match each one, as in MATCH (n) WHERE n.k = $p.k, or (n {k: $p.k})."
      - cypher: "MATCH (a {name: 'Keanu'})-[*1..2]->(b $p) RETURN b"
        parameters: {p: {name: "Keanu"}}
        error: "A parameter's map gives a pattern its properties only in CREATE, as in Cypher: match each one, as in MATCH (n) WHERE n.k = $p.k, or (n {k: $p.k})."
      - cypher: "MATCH ((a $p)-[:KNOWS]->(b)){1,2} RETURN 1"
        parameters: {p: {name: "Keanu"}}
        error: "A parameter's map gives a pattern its properties only in CREATE, as in Cypher: match each one, as in MATCH (n) WHERE n.k = $p.k, or (n {k: $p.k})."
      - cypher: "MATCH path = shortestPath((a {name: 'Keanu'})-[*]->(b $p)) RETURN path"
        parameters: {p: {name: "Keanu"}}
        error: "A parameter's map gives a pattern its properties only in CREATE, as in Cypher: match each one, as in MATCH (n) WHERE n.k = $p.k, or (n {k: $p.k})."
      - cypher: "MATCH (n) WHERE EXISTS { (n)-->(m $p) } RETURN n"
        parameters: {p: {name: "Keanu"}}
        error: "A parameter's map gives a pattern its properties only in CREATE, as in Cypher: match each one, as in MATCH (n) WHERE n.k = $p.k, or (n {k: $p.k})."
      - cypher: "MATCH (n) RETURN [(n)-->(m $p) | m]"
