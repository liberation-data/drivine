# Cypher each SQL store's compiler refuses before the store is sent anything, and the message it gives.
# Compiled with no store: a step here has an error and no rows. See README.md.

cases:
  - name: "Unbound parameter"
    description: "A parameter the statement uses but the caller didn't bind is refused, in a read or a write."
    steps:
      - cypher: "MATCH (n) WHERE n.a = $x RETURN n"
        error: "The statement has a parameter $x, and no value is bound to it."
      - cypher: "CREATE (n {a: $x})"
        error: "The statement has a parameter $x, and no value is bound to it."

  - name: "Fractional SKIP"
    description: "SKIP and LIMIT take a whole number."
    steps:
      - cypher: "MATCH (n) RETURN n SKIP 1.5"
        error: "SKIP and LIMIT take a whole number, not 1.5."

  - name: "Value used as the wrong kind"
    description: "Using a value as something it isn't (a number as a node, a path's property) is refused."
    steps:
      - cypher: "UNWIND [1] AS x MATCH (x)-->() RETURN x"
        error: "x is not a node, and is used as one in a pattern."
      - cypher: "UNWIND [1] AS x CREATE (x)-[:R]->()"
        error: "x is not a node, and is used as one in a pattern."
      - cypher: "UNWIND [1] AS x RETURN labels(x)"
        error: "labels() takes a node."
      - cypher: "MATCH (n) WHERE n RETURN n"
        error: "A node, a relationship or a path is not a condition."
      - cypher: "MATCH p = (a)-->(b) RETURN p.x"
        error: "A path has no properties."
      - cypher: "MATCH (n) RETURN length(n)"
        error: "length() takes a path."

  - name: "Temporal text that is no such value"
    description: "A temporal value written as text that isn't one, or of a kind there's no function for, is refused."
    steps:
      - cypher: "RETURN date('hello')"
        error: "'hello' is no date."
      - cypher: "RETURN datetime('2024-03-15T10:30:00[Europe/Paris]')"
        error: "'2024-03-15T10:30:00[Europe/Paris]' is no datetime."
      - cypher: "RETURN duration('1 day')"
        error: "'1 day' is no duration."

  - name: "Temporal map not compiled yet"
    description: "A temporal value made from a map of fields the compiler doesn't handle yet is refused, naming what it is."
    steps:
      - cypher: "RETURN date({year: 2024, week: 10, dayOfWeek: 3})"
        error: "date() of a map with week is Cypher, and is not compiled to SQL yet."
      - cypher: "RETURN duration({day: 1})"
        error: "duration() of a map with day is Cypher, and is not compiled to SQL yet."
      - cypher: "RETURN datetime.truncate('day', date('2024-03-15'), {nanosecond: 2})"
        error: "datetime.truncate() of a map with nanosecond is Cypher, and is not compiled to SQL yet."
      - cypher: "RETURN date.truncate('month', date('2024-03-15'), {week: 2})"
        error: "date.truncate() of a map with week is Cypher, and is not compiled to SQL yet."
      - cypher: "RETURN datetime.truncate('day', date('2024-03-15'), {timezone: 'Europe/Stockholm'})"
        error: "The time zone 'Europe/Stockholm' is Cypher, and is not compiled to SQL yet."
      - cypher: "WITH {day: 2} AS fields RETURN date.truncate('month', date('2024-03-15'), fields)"
        error: "A truncation's fields that an expression gives is Cypher, and is not compiled to SQL yet."
      - cypher: "WITH '+01:00' AS zone RETURN datetime.truncate('day', date('2024-03-15'), {timezone: zone})"
        error: "A truncation to a time zone an expression gives is Cypher, and is not compiled to SQL yet."

  - name: "Truncation given fields Neo4j does not take"
    description: "A truncation's map of fields that Neo4j fails on is refused: a field of no such value, a day or a month beside a day of the week, a number that is not whole or is past its field's range, or a time zone it does not read."
    steps:
      - cypher: "RETURN date.truncate('day', date('2024-03-15'), {hour: 5})"
        error: "date.truncate() takes no field hour."
      - cypher: "RETURN localdatetime.truncate('day', localdatetime('2024-03-15T10:00'), {timezone: '+05:00'})"
        error: "localdatetime.truncate() takes no field timezone."
      - cypher: "RETURN localtime.truncate('hour', localtime('10:30'), {day: 2})"
        error: "localtime.truncate() takes no field day."
      - cypher: "RETURN date.truncate('day', date('2024-03-15'), {foo: 1})"
        error: "date.truncate() takes no field foo."
      - cypher: "RETURN date.truncate('month', date('2024-03-15'), {day: 2, dayOfWeek: 3})"
        error: "date.truncate() takes a day or a day of the week, not both."
      - note: "A day of the week goes with a year alone, not with a month, though it is null."
        cypher: "RETURN date.truncate('month', date('2024-03-15'), {month: 2, dayOfWeek: 3})"
        error: "date.truncate() takes a month or a day of the week, not both."
      - cypher: "RETURN date.truncate('weekYear', date('2024-03-15'), {dayOfWeek: 2, year: 2000, month: null})"
        error: "date.truncate() takes a month or a day of the week, not both."
      - cypher: "RETURN date.truncate('week', date('2024-03-15'), {dayOfWeek: 9})"
        error: "date.truncate() takes a day of the week from 1 to 7, not 9."
      - note: "A number written past its field's range, which a store would carry into the next field."
        cypher: "RETURN date.truncate('year', date('2017-02-11'), {month: -1})"
        error: "date.truncate() takes a month from 1 to 12, not -1."
      - cypher: "RETURN localtime.truncate('hour', localtime('12:00'), {hour: 24})"
        error: "localtime.truncate() takes an hour from 0 to 23, not 24."
      - cypher: "RETURN localtime.truncate('second', localtime('12:00'), {millisecond: 1000})"
        error: "localtime.truncate() takes a millisecond from 0 to 999, not 1000."
      - cypher: "RETURN localtime.truncate('second', localtime('12:00'), {microsecond: 1000000})"
        error: "localtime.truncate() takes a microsecond from 0 to 999999, not 1000000."
      - note: "Beside a millisecond given, or kept by a cut to the millisecond, a microsecond runs to 999."
        cypher: "RETURN localtime.truncate('second', localtime('12:00'), {millisecond: 5, microsecond: 1000})"
        error: "localtime.truncate() takes a microsecond from 0 to 999 beside a millisecond, not 1000."
      - cypher: "RETURN localtime.truncate('millisecond', localtime('12:00'), {microsecond: 1000})"
        error: "localtime.truncate() takes a microsecond from 0 to 999 beside a millisecond, not 1000."
      - cypher: "RETURN date.truncate('month', date('2024-03-15'), {day: 2.7})"
        error: "date.truncate() takes a whole number for day, not 2.7."
      - cypher: "RETURN date.truncate('month', date('2024-03-15'), {year: '2000'})"
        error: "date.truncate() takes a whole number for year, not '2000'."
      - cypher: "RETURN datetime.truncate('day', date('2024-03-15'), {timezone: '+0500'})"
        error: "'+0500' is no time zone."
      - cypher: "RETURN datetime.truncate('day', date('2024-03-15'), {timezone: 'bogus'})"
        error: "'bogus' is no time zone."
      - cypher: "RETURN datetime.truncate('day', date('2024-03-15'), {timezone: null})"
        error: "datetime.truncate() takes a time zone, not null."

  - name: "Temporal function given the wrong arguments"
    description: "A temporal function given arguments it doesn't take is refused."
    steps:
      - cypher: "RETURN duration()"
        error: "duration() takes a text or a map of its fields."
      - cypher: "RETURN date('2024-03-15', 'x')"
        error: "date() takes a text or a map of its fields."
      - cypher: "RETURN date.truncate('month')"
        error: "date.truncate() takes a unit and a value."
      - cypher: "RETURN date.truncate('month', date('2024-03-15'), {}, {})"
        error: "date.truncate() takes a unit, a value and a map of fields."
      - cypher: "RETURN date.truncate('fortnight', date('2024-03-15'))"
        error: "date.truncate() truncates to millennium, century, decade, year, weekYear, quarter, month, week, day, hour, minute, second, millisecond or microsecond, not fortnight."
      - cypher: "WITH 'month' AS u RETURN date.truncate(u, date('2024-03-15'))"
        error: "A truncation to a unit an expression gives is Cypher, and is not compiled to SQL yet."
      - cypher: "RETURN duration.between(date('2024-03-15'))"
        error: "duration.between() takes two temporal values."

  - name: "Wrong number of arguments"
    description: "A function given the wrong number of arguments is refused."
    steps:
      - cypher: "RETURN toLower('a', 'b')"
        error: "toLower() takes one argument."
      - cypher: "RETURN range(1)"
        error: "range() takes a start, an end and a step."
      - cypher: "RETURN substring('abc')"
        error: "substring() takes a text, a start and a length."
      - cypher: "RETURN replace('abc', 'a')"
        error: "replace() takes a text, what to replace, and what with."

  - name: "Start or length of a text function"
    description: "substring(), left() and right() refuse a written float, even a whole one, and a given start or length out of range beside a given text."
    steps:
      - cypher: "RETURN left('hello', 2.7)"
        error: "left() takes an integer for its length, not a float, as in Neo4j."
      - cypher: "RETURN right('hello', 2.0)"
        error: "right() takes an integer for its length, not a float, as in Neo4j."
      - cypher: "RETURN substring('hello', -0.5)"
        error: "substring() takes an integer for its start, not a float, as in Neo4j."
      - cypher: "RETURN substring('hello', 1, 2.6)"
        error: "substring() takes an integer for its length, not a float, as in Neo4j."
      - note: "Refused whatever the text, as Neo4j refuses it."
        cypher: "RETURN left(null, 2.7)"
        error: "left() takes an integer for its length, not a float, as in Neo4j."
      - cypher: "RETURN left('hello', -1)"
        error: "left() takes a length from 0 to 2147483647, as in Neo4j."
      - cypher: "RETURN substring('hello', -1, 2)"
        error: "substring() takes a start from 0 to 2147483647, as in Neo4j."
      - cypher: "RETURN substring('hello', 1, 9223372036854775807)"
        error: "substring() takes a length from 0 to 2147483647, as in Neo4j."
      - note: "Bound, a float is cut toward zero first: -1.5 is -1."
        cypher: "RETURN right($t, $n)"
        parameters: {t: "hello", n: -1.5}
        error: "right() takes a length from 0 to 2147483647, as in Neo4j."
      - note: "A negated parameter is negated first, and then cut: -2.7 is -2."
        cypher: "RETURN left($t, -$n)"
        parameters: {t: "hello", n: 2.7}
        error: "left() takes a length from 0 to 2147483647, as in Neo4j."
      - cypher: "RETURN left($t, $n)"
        parameters: {t: "hello", n: 2147483648}
        error: "left() takes a length from 0 to 2147483647, as in Neo4j."

  - name: "Read not compiled yet"
    description: "Read syntax the compiler doesn't handle yet is refused, naming what it is."
    steps:
      - cypher: "MATCH (n) RETURN n LIMIT 1 + 1"
        error: "SKIP or LIMIT of an expression is Cypher, and is not compiled to SQL yet."
      - cypher: "RETURN nope(1)"
        error: "The function nope() is Cypher, and is not compiled to SQL yet."
      - note: One not compiled is named whatever it is given, not taken for one of a single argument.
        cypher: "RETURN apoc.text.join(['a', 'b'], ',')"
        error: "The function apoc.text.join() is Cypher, and is not compiled to SQL yet."
      - cypher: "RETURN rand()"
        error: "The function rand() is Cypher, and is not compiled to SQL yet."
      - cypher: "MATCH (a)-[r]->(b) MATCH (b)-[r]->(c) RETURN c"
        error: "A relationship variable bound before its pattern is Cypher, and is not compiled to SQL yet."

  - name: "Union, subquery or shortest path not compiled"
    description: "A UNION, subquery or shortest path the compiler can't turn into SQL is refused."
    steps:
      - cypher: "CREATE (n) RETURN n UNION RETURN 1 AS n"
        error: "A write in a UNION is Cypher, and is not compiled to SQL yet."
      - cypher: "MATCH (p) WHERE EXISTS { MATCH (p)-->(q) CREATE (r) RETURN r } RETURN p"
        error: "A write in EXISTS { … } is Cypher, and is not compiled to SQL yet."
      - cypher: "MATCH (p) RETURN COUNT { MATCH (p)-->(q) CREATE (r) RETURN r }"
        error: "A write in COUNT { … } is Cypher, and is not compiled to SQL yet."
      - cypher: "CALL { RETURN 1 AS x ORDER BY x UNION RETURN 2 AS x } RETURN x"
        error: "An ORDER BY in a query of a UNION in CALL { … } is Cypher, and is not compiled to SQL yet."
      - cypher: "CALL { RETURN 1 AS x UNION RETURN 2 AS y } RETURN x"
        error: "Each query of a UNION returns the same names, as in Cypher."
      - cypher: "CALL { MATCH (n) RETURN n AS x UNION RETURN 2 AS x } RETURN x"
        error: "A UNION in CALL { … } whose queries return values of different kinds is Cypher, and is not compiled to SQL yet."
      - cypher: "UNWIND [1] AS i OPTIONAL CALL (i) { CREATE (n) RETURN n } RETURN n"
        error: "An OPTIONAL CALL { … } that writes is Cypher, and is not compiled to SQL yet."
      - cypher: "CALL { CREATE (n) RETURN n AS x UNION CREATE (m) RETURN m AS x } RETURN x"
        error: "A UNION in CALL { … } is Cypher, and is not compiled to SQL yet."
      - cypher: "UNWIND [1] AS i CALL (i) { CREATE (n) RETURN count(n) AS c } RETURN c"
        error: "An aggregate in the RETURN of a CALL { … } that writes is Cypher, and is not compiled to SQL yet."
      - cypher: "FOREACH (a IN [1] | FOREACH (b IN [1] | FOREACH (c IN [1] | FOREACH (d IN [1] | CREATE (n)))))"
        error: "A FOREACH or CALL { … } that writes nested more than 3 deep is Cypher, and is not compiled to SQL yet."
      - cypher: "MATCH p = shortestPath((a)-[:R]->(b)) RETURN length(p)"
        error: "A shortest path of anything but one variable-length relationship is Cypher, and is not compiled to SQL yet."
      - cypher: "MERGE p = shortestPath((a)-[:R*]->(b))"
        error: "A shortest path in MERGE is Cypher, and is not compiled to SQL yet."
      - cypher: "MATCH (a)-[:R*1..2]->{2}(b) RETURN b"
        error: "A quantified relationship that has a range of its own is Cypher, and is not compiled to SQL yet."
      - cypher: "MATCH (n) WITH collect(n) AS ns RETURN ns.name"
        error: "A list has no properties."
      - cypher: "RETURN split('a,b')"
        error: "split() takes a text and a separator."

  - name: "Quantified path patterns refused"
    description: "A quantified path pattern the compiler doesn't compile, or that isn't Cypher, is refused."
    steps:
      - cypher: "MATCH (a:Person) ((x)-[:KNOWS]->(y) WHERE y.born > a.born)+ (b) RETURN b"
        only: [oracle]
        error: "On Oracle, a quantified path pattern that reads a variable from outside it is Cypher, and is not compiled to SQL yet."
      - cypher: "MATCH (a:Person) ((x)-[:KNOWS]->(y) WHERE EXISTS { MATCH (y)-[:ACTED_IN]->() })+ (b) RETURN b"
        only: [oracle]
        error: "On Oracle, a subquery in a quantified path pattern that may read a variable from outside it is Cypher, and is not compiled to SQL yet."
      - cypher: "MATCH () ((x)-[:KNOWS]->(y) WHERE EXISTS { MATCH (y) ((a)-[:ACTED_IN]->(b)){1} () })+ () RETURN x"
        only: [oracle]
        error: "On Oracle, a variable-length relationship or quantified path pattern in a subquery of a quantified path pattern is Cypher, and is not compiled to SQL yet."
      - cypher: "MATCH () ((x)-[:KNOWS]->(y) WHERE COUNT { (y)-[:ACTED_IN*]->() } > 1)+ () RETURN x"
        only: [oracle]
        error: "On Oracle, a variable-length relationship or quantified path pattern in a subquery of a quantified path pattern is Cypher, and is not compiled to SQL yet."
      - cypher: "MATCH () ((x)-[:KNOWS]->(y) WHERE EXISTS { MATCH shortestPath((y)-[:KNOWS*]->(:Person {name: 'Carrie'})) })+ () RETURN x"
        only: [oracle]
        error: "On Oracle, a variable-length relationship or quantified path pattern in a subquery of a quantified path pattern is Cypher, and is not compiled to SQL yet."
      - cypher: "CREATE (a) ((x)-[:R]->(y)){2} (b)"
        error: "A quantified path pattern in CREATE or MERGE is Cypher, and is not compiled to SQL yet."
      - cypher: "MATCH p = shortestPath((a) ((x)-[:R]->(y))+ (b)) RETURN p"
        error: "A shortest path of anything but one variable-length relationship is Cypher, and is not compiled to SQL yet."
      - cypher: "MATCH (a) ((x)-[:R*1..2]->(y)){2} (b) RETURN a"
        error: "A variable-length relationship in a quantified path pattern is Cypher, and is not compiled to SQL yet."
      - cypher: "MATCH (a) ((x)-[:R]->(y)-[:R]->(x)){2} (b) RETURN a"
        error: "A variable named twice in a quantified path pattern is Cypher, and is not compiled to SQL yet."
      - cypher: "MATCH (a) (((x)-[:R]->(y)){2}){2} (b) RETURN a"
        error: "A quantified path pattern holds no quantified path pattern."
      - cypher: "MATCH (a) ((x)){2} (b) RETURN a"
        error: "A quantified path pattern holds a relationship."
      - cypher: "MATCH (a) (b) RETURN a"
        error: "Two nodes of a path are side by side: a relationship or a quantified path pattern goes between them."
      - cypher: "MATCH (x) MATCH (a) ((x)-[:R]->(y))+ (b) RETURN a"
        error: "x is bound outside the quantified path pattern that names it."
      - note: "A node after it is bound outside it too, as Neo4j refuses."
        cypher: "MATCH (a) ((x)-[:R]->(y))+ (y) RETURN a"
        error: "y is bound outside the quantified path pattern that names it."
      - note: "Neo4j refuses both too."
        cypher: "MATCH (a) ((x)-[:R]->(y)){1} -[:R]->(b) RETURN a"
        error: "A relationship after a quantified path pattern has a node between them."
      - cypher: "MATCH (a) ((x)-[:R]->(y)){0} (b) RETURN a"
        error: "A quantified path pattern's quantifier has a maximum of at least 1."
      - cypher: "MATCH (a)-[:R]->{} (b) RETURN a"
        error: "A quantifier in braces has a bound in them, as in {2} or {1,3}."
      - cypher: "MATCH (a) ((x)-[:R]->(y)){} (b) RETURN a"
        error: "A quantifier in braces has a bound in them, as in {2} or {1,3}."
      - cypher: "MATCH (a)-[:R]->{3,1} (b) RETURN a"
        error: "A quantifier's least bound is at most its greatest, and 3 is more than 1."
      - cypher: "MATCH (a) ((x)-[:R]->(y)){3,1} (b) RETURN a"
        error: "A quantifier's least bound is at most its greatest, and 3 is more than 1."

  - name: "Whole number too large"
    description: "A whole number written past the least or greatest 64-bit integer is refused."
    steps:
      - cypher: "RETURN 9223372036854775808"
        error: "9223372036854775808 is past the range of a whole number, from -9223372036854775808 to 9223372036854775807."
      - cypher: "RETURN -9223372036854775809"
        error: "-9223372036854775809 is past the range of a whole number, from -9223372036854775808 to 9223372036854775807."

  - name: "Write to a non-entity"
    description: "A write to an undefined variable, or to something that isn't a node or relationship, is refused."
    steps:
      - cypher: "MATCH (n) SET y.a = 1"
        error: "y is not defined: a variable is bound by a pattern, a WITH or an UNWIND before it is used."
      - cypher: "UNWIND [1] AS x SET x.a = 1"
        error: "x is not a node or a relationship, and SET writes to one."
      - cypher: "MATCH ()-[r]->() SET r:L"
        error: "r is not a node, and a label is set on one."
      - cypher: "MATCH ()-[r]->() REMOVE r:L"
        error: "r is not a node, and a label is removed from one."

  - name: "Pattern CREATE can't make"
    description: "A pattern that CREATE or MERGE can't make is refused."
    steps:
      - cypher: "MATCH (a) CREATE (a:L)"
        error: "a is bound already, so a CREATE or MERGE makes no node of it with labels or properties."
      - cypher: "CREATE (a)-[:R|S]->(b)"
        error: "A relationship that CREATE or MERGE makes has one type."
      - cypher: "CREATE (a)-[]->(b)"
        error: "A relationship that CREATE or MERGE makes has one type."

  - name: "Write not compiled yet"
    description: "Write syntax the compiler doesn't handle yet is refused, naming what it is."
    steps:
      - cypher: "MATCH (n) DELETE n.x"
        error: "A DELETE of anything but a variable is Cypher, and is not compiled to SQL yet."
      - cypher: "CREATE p = (a)-[:R]->(b)"
        error: "A path variable in CREATE or MERGE is Cypher, and is not compiled to SQL yet."
      - cypher: "MATCH (a)-[r]->(b) CREATE (a)-[r:R]->(b)"
        error: "A relationship variable bound before its pattern is Cypher, and is not compiled to SQL yet."

  - name: "Round by a mode it does not take"
    description: "round() by a mode Java does not name, by UNNECESSARY, or by a mode an expression gives is refused."
    steps:
      - cypher: "RETURN round(2.5, 0, 'up')"
        error: "round() rounds by CEILING, FLOOR, UP, DOWN, HALF_EVEN, HALF_UP, HALF_DOWN or UNNECESSARY, not up."
      - note: UNNECESSARY fails where rounding changes the number, which a query has no way to say.
        cypher: "RETURN round(1.0, 2, 'UNNECESSARY')"
        error: "round() by UNNECESSARY is Cypher, and is not compiled to SQL yet."
      - cypher: "WITH 'UP' AS m RETURN round(2.5, 0, m)"
        error: "A rounding mode an expression gives is Cypher, and is not compiled to SQL yet."

  - name: "Function of numbers given the wrong arguments"
    description: "A function of numbers given more or fewer arguments than it takes is refused."
    steps:
      - cypher: "RETURN exp(1, 2)"
        error: "exp() takes one argument."
      - cypher: "RETURN atan2(1)"
        error: "atan2() takes two numbers."
      - cypher: "RETURN pi(1)"
        error: "pi() takes no argument."

  - name: "Procedure"
    description: "A procedure other than db.labels() and db.relationshipTypes() is refused, as is one of them called as Neo4j refuses it."
    steps:
      - cypher: "CALL db.indexes()"
        error: "A procedure call (CALL) is Cypher, and is not compiled to SQL yet."
      - cypher: "MATCH (n) CALL apoc.nodes.get(n) YIELD node RETURN node"
        error: "A procedure call (CALL) is Cypher, and is not compiled to SQL yet."
      - note: A procedure's name is matched in its case, as Neo4j matches it.
        cypher: "CALL DB.LABELS()"
        error: "A procedure call (CALL) is Cypher, and is not compiled to SQL yet."
      - cypher: "CALL db.labels() RETURN 1"
        error: "A CALL of a procedure within a query names what it yields, as in Cypher: CALL db.labels() YIELD label."
      - cypher: "CALL db.labels() YIELD nope RETURN nope"
        error: "db.labels() yields label, not nope."
      - cypher: "CALL db.relationshipTypes('x')"
        error: "db.relationshipTypes() takes no argument."
      - note: What it yields is a new variable, as what a CALL { … } returns is.
        cypher: "WITH 'Movie' AS label CALL db.labels() YIELD label RETURN label"
        error: "The variable label is bound already, so a CALL does not return or yield it, as in Cypher: name it with AS."
      - note: In a statement that writes, too.
        cypher: "CREATE (n:Made) WITH 'Made' AS label CALL db.labels() YIELD label RETURN label"
        error: "The variable label is bound already, so a CALL does not return or yield it, as in Cypher: name it with AS."
      - cypher: "WITH 1 AS x CALL { RETURN 2 AS x } RETURN x"
        error: "The variable x is bound already, so a CALL does not return or yield it, as in Cypher: name it with AS."
      - note: Within a CALL { … } that imports it, too.
        cypher: "WITH 'Movie' AS label CALL { WITH label CALL db.labels() YIELD label RETURN label AS l } RETURN l"
        error: "The variable label is bound already, so a CALL does not return or yield it, as in Cypher: name it with AS."
      - cypher: "WITH 1 AS x CALL { WITH x CALL { CREATE (:Made) RETURN 2 AS x } RETURN x AS y } RETURN y"
        error: "The variable x is bound already, so a CALL does not return or yield it, as in Cypher: name it with AS."
      - cypher: "CALL db.labels() YIELD label WHERE label STARTS WITH 'A'"
        error: "A CALL that is the whole statement takes no WHERE, as in Cypher: follow its YIELD with WITH or RETURN, as in CALL db.labels() YIELD label WHERE … RETURN label."

  - name: "toString of a list or a map"
    description: "toString() of a value the statement makes a list or a map is refused, as Neo4j refuses it."
    steps:
      - cypher: "WITH [localdatetime('2024-03-15T10:00:00')] AS l RETURN toString(l)"
        error: "toString() takes a number, a text, a truth value or a temporal value, not a list, as in Neo4j."
      - cypher: "MATCH (n) RETURN toString(collect(n.x))"
        error: "toString() takes a number, a text, a truth value or a temporal value, not a list, as in Neo4j."
      - cypher: "MATCH (n) RETURN toString(n {.name})"
        error: "toString() takes a number, a text, a truth value or a temporal value, not a map, as in Neo4j."

  - name: "Operand of AND, OR, XOR or NOT of another kind"
    description: "AND, OR, XOR and NOT of a value the statement writes as a number, a text, a list or a map, or binds with WITH to one, are refused, as Neo4j refuses them when it plans the statement."
    steps:
      - cypher: "RETURN 123 AND true"
        error: "AND takes a truth value, not an integer, as in Neo4j."
      - cypher: "RETURN false OR 'foo'"
        error: "OR takes a truth value, not a text, as in Neo4j."
      - cypher: "RETURN [true] XOR false"
        error: "XOR takes a truth value, not a list, as in Neo4j."
      - cypher: "RETURN null AND {}"
        error: "AND takes a truth value, not a map, as in Neo4j."
      - cypher: "RETURN NOT -1.5"
        error: "NOT takes a truth value, not a float, as in Neo4j."
      - cypher: "WITH 123 AS x WITH x AS y RETURN NOT y"
        error: "NOT takes a truth value, not an integer, as in Neo4j."
      - cypher: "WITH 'a' AS x RETURN reduce(a = true, y IN [1] | a AND x)"
        error: "AND takes a truth value, not a text, as in Neo4j."

  - name: "Condition of another kind"
    description: "A WHERE, a CASE's WHEN or a list's filter that the statement writes as a value other than a truth value, or binds with WITH to one, is refused, as Neo4j refuses it."
    steps:
      - cypher: "MATCH (n) WHERE 1 RETURN n"
        error: "An integer is not a condition, as in Neo4j."
      - cypher: "WITH 'a' AS x MATCH (n) WHERE x RETURN n"
        error: "A text is not a condition, as in Neo4j."
      - cypher: "RETURN CASE WHEN [] THEN 'a' END"
        error: "A list is not a condition, as in Neo4j."
      - cypher: "RETURN [x IN [1, 2] WHERE 'a']"
        error: "A text is not a condition, as in Neo4j."
      - cypher: "RETURN any(x IN [1] WHERE 1.5)"
        error: "A float is not a condition, as in Neo4j."

  - name: "Property of a value that is no map"
    description: "A property of a value the statement writes as a number, a text, a truth value or a list, or binds with WITH to one, is refused, as Neo4j refuses it."
    steps:
      - cypher: "WITH 123 AS x RETURN x.num"
        error: "An integer has no properties."
      - cypher: "WITH 'abc' AS s MATCH (n) RETURN s.size"
        error: "A text has no properties."
      - cypher: "WITH [1] AS l RETURN l.num"
        error: "A list has no properties."
      - cypher: "WITH true AS b RETURN b.num"
        error: "A truth value has no properties."
      - cypher: "WITH 1 AS x RETURN reduce(a = 0, y IN [1] | a + x.num)"
        error: "An integer has no properties."
      - cypher: "CALL { RETURN 1 AS x UNION RETURN 2 AS x } RETURN x.num"
        error: "An integer has no properties."
      - cypher: "WITH 1 AS x CREATE (n) RETURN x.num"
        error: "An integer has no properties."

  - name: "Index of another kind"
    description: "An item of a value the statement writes as no list or map, or a list's item or a map's entry by an index of a kind it isn't indexed by, is refused, as Neo4j refuses it. An index given as a parameter is of its value's kind, where Neo4j fails when a row reaches it."
    steps:
      - cypher: "WITH true AS list, 0 AS idx RETURN list[idx]"
        error: "A truth value is not a list or a map, and is indexed as one, as in Neo4j."
      - cypher: "RETURN 'abc'[0]"
        error: "A text is not a list or a map, and is indexed as one, as in Neo4j."
      - cypher: "WITH [1, 2, 3] AS list, 4.7 AS idx RETURN list[idx]"
        error: "A list is indexed by an integer, not a float, as in Neo4j."
      - cypher: "RETURN [1, 2, 3]['1']"
        error: "A list is indexed by an integer, not a text, as in Neo4j."
      - cypher: "RETURN {a: 1}[1]"
        error: "A map is indexed by a text, not an integer, as in Neo4j."
      - cypher: "WITH [1] AS l RETURN l[$k]"
        parameters: {k: "a"}
        error: "A list is indexed by an integer, not a text, as in Neo4j."

  - name: "IN a value that is no list"
    description: "IN a value the statement writes as one other than a list, or binds with WITH to one, is refused, as Neo4j refuses it."
    steps:
      - cypher: "RETURN 1 IN 123"
        error: "IN takes a list, not an integer, as in Neo4j."
      - cypher: "WITH {x: []} AS m RETURN 1 IN m"
        error: "IN takes a list, not a map, as in Neo4j."

  - name: "range() of another kind or by a step of 0"
    description: "range() of a value the statement writes as one other than an integer is refused, as Neo4j refuses it when it plans the statement. range() by a step written or given as 0 is refused too, where Neo4j fails when a row reaches it."
    steps:
      - cypher: "RETURN range(0, 1, 1.1)"
        error: "range() takes integers, not a float, as in Neo4j."
      - cypher: "RETURN range(true, 1)"
        error: "range() takes integers, not a truth value, as in Neo4j."
      - cypher: "RETURN range(2, 8, 0)"
        error: "range() takes a step other than 0, as in Neo4j."
      - cypher: "RETURN range(2, 8, -0)"
        error: "range() takes a step other than 0, as in Neo4j."
      - cypher: "RETURN range(2, 8, $s)"
        parameters: {s: 0}
        error: "range() takes a step other than 0, as in Neo4j."

  - name: "properties() of another kind"
    description: "properties() of a value the statement writes as a number, a text, a truth value or a list, or binds with WITH to one, is refused, as Neo4j refuses it."
    steps:
      - cypher: "RETURN properties(1)"
        error: "properties() takes a node, a relationship or a map, not an integer, as in Neo4j."
      - cypher: "WITH 'Cypher' AS t RETURN properties(t)"
        error: "properties() takes a node, a relationship or a map, not a text, as in Neo4j."
      - cypher: "RETURN properties([true, false])"
        error: "properties() takes a node, a relationship or a map, not a list, as in Neo4j."

  - name: "Property set to a map"
    description: "A property set to a map written, or to a list written that holds a map or a list, is refused, where Neo4j fails when a row reaches the SET."
    steps:
      - cypher: "CREATE (a) SET a.maplist = [{num: 1}]"
        error: "A property is a number, a text, a truth value, a temporal value or a list of them, not a list of maps or lists, as in Neo4j."
      - cypher: "MATCH (a) SET a.m = {num: 1}"
        error: "A property is a number, a text, a truth value, a temporal value or a list of them, not a map, as in Neo4j."

  - name: "Variable used as two kinds"
    description: "A variable a pattern binds as a node, a relationship, a variable-length relationship's list or a path, or a WITH binds to a value written, is refused where a pattern uses it as another kind, as Neo4j refuses it. A value whose kind the statement leaves open (a property, a parameter, an unwound item) isn't refused for it."
    steps:
      - cypher: "MATCH (a)-[a]->() RETURN a"
        error: "a is a node, and is used as a relationship: a variable is of one kind, as in Neo4j."
      - cypher: "MATCH ()-[r]-(r) RETURN r"
        error: "r is a relationship, and is used as a node: a variable is of one kind, as in Neo4j."
      - cypher: "MATCH (r) MATCH ()-[r]-() RETURN r"
        error: "r is a node, and is used as a relationship: a variable is of one kind, as in Neo4j."
      - cypher: "MATCH (r)-[]-()-[r*]-() RETURN r"
        error: "r is a node, and is used as a list of relationships: a variable is of one kind, as in Neo4j."
      - cypher: "MATCH ()-[r*]-() MATCH ()-[r]-() RETURN r"
        error: "r is a list of relationships, and is used as a relationship: a variable is of one kind, as in Neo4j."
      - cypher: "MATCH p = ()-->() MATCH (p) RETURN p"
        error: "p is a path, and is used as a node: a variable is of one kind, as in Neo4j."
      - cypher: "WITH true AS n MATCH (n) RETURN n"
        error: "n is a truth value, and is used as a node: a variable is of one kind, as in Neo4j."
      - cypher: "WITH [] AS r MATCH ()-[r]-() RETURN r"
        error: "r is a list, and is used as a relationship: a variable is of one kind, as in Neo4j."
      - cypher: "WITH {x: 1} AS r MATCH ()-[r*]-() RETURN r"
        error: "r is a map, and is used as a list of relationships: a variable is of one kind, as in Neo4j."
      - note: A WITH passes a variable on as the kind it is, under its own name or another, or with *.
        cypher: "MATCH (a) WITH a AS r MATCH ()-[r]-() RETURN r"
        error: "r is a node, and is used as a relationship: a variable is of one kind, as in Neo4j."
      - cypher: "MATCH (a) WITH * MATCH ()-[a]->() RETURN a"
        error: "a is a node, and is used as a relationship: a variable is of one kind, as in Neo4j."
      - cypher: "MATCH (a) WITH 1 AS a MATCH ()-[a]->() RETURN a"
        error: "a is an integer, and is used as a relationship: a variable is of one kind, as in Neo4j."
      - note: A pattern in an expression or a subquery reads the variables around it.
        cypher: "MATCH (a) RETURN [(a)-[a]->() | 1] AS l"
        error: "a is a node, and is used as a relationship: a variable is of one kind, as in Neo4j."
      - cypher: "MATCH (a) WHERE (a)-[a]->() RETURN a"
        error: "a is a node, and is used as a relationship: a variable is of one kind, as in Neo4j."
      - cypher: "MATCH (a) WHERE EXISTS { MATCH ()-[a]->() } RETURN a"
        error: "a is a node, and is used as a relationship: a variable is of one kind, as in Neo4j."
      - cypher: "MATCH (a) RETURN COUNT { (a)-[a]->() } AS c"
        error: "a is a node, and is used as a relationship: a variable is of one kind, as in Neo4j."
      - note: A CALL { … } reads a variable its WITH or its brackets import as the kind it is, and returns one as the kind it is.
        cypher: "MATCH (a) CALL { WITH a MATCH ()-[a]->() RETURN 1 AS x } RETURN x"
        error: "a is a node, and is used as a relationship: a variable is of one kind, as in Neo4j."
      - cypher: "MATCH (a) CALL (a) { MATCH ()-[a]->() RETURN 1 AS x } RETURN x"
        error: "a is a node, and is used as a relationship: a variable is of one kind, as in Neo4j."
      - cypher: "CALL { MATCH (a) RETURN a } MATCH ()-[a]->() RETURN a"
        error: "a is a node, and is used as a relationship: a variable is of one kind, as in Neo4j."
      - cypher: "MATCH ()-[r]->() CREATE (a)-[:R]->(r)"
        error: "r is a relationship, and is used as a node: a variable is of one kind, as in Neo4j."
      - note: In a FOREACH too, where a CREATE may name a variable bound already.
        cypher: "MATCH ()-[r]->() FOREACH (x IN [1] | CREATE (r)-[:T]->())"
        error: "r is a relationship, and is used as a node: a variable is of one kind, as in Neo4j."

  - name: "Variable bound already where a pattern makes it"
    description: "A path variable bound already, a node a CREATE or a MERGE would make alone that is bound already, and a relationship one makes whose variable is bound already as anything but a relationship, or by the same CREATE, are refused, as Neo4j refuses them. A relationship bound as one before the CREATE or MERGE stays refused as not compiled yet (see \"Write not compiled yet\"). In a FOREACH, Neo4j takes a CREATE or a MERGE of a variable bound already."
    steps:
      - cypher: "MATCH p = (p)-[]-() RETURN p"
        error: "p is bound already, so a pattern binds no path to it, as in Neo4j."
      - cypher: "MATCH ()-[p]->() MATCH p = ()-->() RETURN p"
        error: "p is bound already, so a pattern binds no path to it, as in Neo4j."
      - cypher: "UNWIND [1] AS p MATCH p = ()-->() RETURN p"
        error: "p is bound already, so a pattern binds no path to it, as in Neo4j."
      - cypher: "MATCH (a) CREATE (a)"
        error: "a is bound already, so a CREATE makes no node of it, as in Neo4j."
      - cypher: "MATCH (a) MERGE (a)"
        error: "a is bound already, so a MERGE makes no node of it, as in Neo4j."
      - cypher: "CREATE (n), (n)"
        error: "n is bound already, so a CREATE makes no node of it, as in Neo4j."
      - cypher: "MATCH (a) CREATE (a)-[:R]->(b), (b)"
        error: "b is bound already, so a CREATE makes no node of it, as in Neo4j."
      - cypher: "MATCH ()-[r]->() CREATE (r)"
        error: "r is bound already, so a CREATE makes no node of it, as in Neo4j."
      - cypher: "MATCH (a) CALL { WITH a CREATE (a) } RETURN 1"
        error: "a is bound already, so a CREATE makes no node of it, as in Neo4j."
      - cypher: "MATCH (a) CALL (a) { CREATE (a) } RETURN 1"
        error: "a is bound already, so a CREATE makes no node of it, as in Neo4j."
      - cypher: "CREATE (n:Foo)-[:T1]->(), (n:Bar)-[:T2]->()"
        error: "n is bound already, so a CREATE or MERGE makes no node of it with labels or properties."
      - cypher: "CREATE (n)-[r:T]->(), ()-[r:T]->()"
        error: "r is bound already, so a CREATE makes no relationship of it, as in Neo4j."
      - cypher: "MATCH (a) CREATE (b)-[a:R]->()"
        error: "a is bound already, so a CREATE makes no relationship of it, as in Neo4j."
      - cypher: "WITH 1 AS r MERGE ()-[r:R]->()"
        error: "r is bound already, so a MERGE makes no relationship of it, as in Neo4j."

  - name: "CALL imports variables of the row"
    description: "A CALL's brackets name only variables of its row, as Neo4j has it."
    steps:
      - cypher: "MATCH (a) CALL (x) { RETURN 1 AS n } RETURN n"
        error: "x is not defined: a variable is bound by a pattern, a WITH or an UNWIND before it is used."
      - note: "An inner CALL imports from the outer CALL's scope, which holds only what the outer one imports."
        cypher: "MATCH (a), (b) CALL (a) { CALL (b) { MATCH (b)-->(d) RETURN d } RETURN d.x AS x } RETURN x"
        error: "b is not defined: a variable is bound by a pattern, a WITH or an UNWIND before it is used."
      - note: "What brackets import is in scope after a WITH that does not name it."
        cypher: "MATCH (a) CALL (a) { WITH 1 AS one CREATE (a) RETURN one } RETURN one"
        error: "a is bound already, so a CREATE makes no node of it, as in Neo4j."
      - cypher: "MATCH (a) CALL (*) { WITH 1 AS one MATCH ()-[a]->() RETURN one } RETURN one"
        error: "a is a node, and is used as a relationship: a variable is of one kind, as in Neo4j."
      - note: "A procedure's call imports each variable of the row, so after a WITH that drops one its WHERE does not read it."
        cypher: "MATCH (a) WITH 1 AS x CALL db.labels() YIELD label WHERE label = a.kind RETURN label"
        error: "a is not defined: a variable is bound by a pattern, a WITH or an UNWIND before it is used."

  - name: "Importing WITH of variables alone"
    description: "A CALL's leading WITH that names a variable of the row, or *, names nothing more, as Neo4j has it (its 42I28)."
    steps:
      - cypher: "MATCH (a), (b) CALL { WITH a, b AS c MATCH (a)-->(c) RETURN c.x AS x } RETURN x"
        error: "The importing WITH of a CALL { … } names variables of the row alone, as in Cypher: no alias, expression, DISTINCT, WHERE, ORDER BY, SKIP or LIMIT. Import them with CALL (a, b) { … }, and work on them in a WITH after."
      - cypher: "MATCH (a) CALL { WITH a AS c MATCH (c)-->(d) RETURN d.x AS x } RETURN x"
        error: "The importing WITH of a CALL { … } names variables of the row alone, as in Cypher: no alias, expression, DISTINCT, WHERE, ORDER BY, SKIP or LIMIT. Import them with CALL (a, b) { … }, and work on them in a WITH after."
      - cypher: "MATCH (a) CALL { WITH a WHERE a.x > 1 RETURN count(*) AS n } RETURN a, n"
        error: "The importing WITH of a CALL { … } names variables of the row alone, as in Cypher: no alias, expression, DISTINCT, WHERE, ORDER BY, SKIP or LIMIT. Import them with CALL (a, b) { … }, and work on them in a WITH after."
      - cypher: "MATCH (a) CALL { WITH a ORDER BY a.x LIMIT 1 MATCH (a)-->(d) RETURN d.x AS x } RETURN x"
        error: "The importing WITH of a CALL { … } names variables of the row alone, as in Cypher: no alias, expression, DISTINCT, WHERE, ORDER BY, SKIP or LIMIT. Import them with CALL (a, b) { … }, and work on them in a WITH after."
      - cypher: "MATCH (a) CALL { WITH a SKIP 0 RETURN 1 AS x } RETURN x"
        error: "The importing WITH of a CALL { … } names variables of the row alone, as in Cypher: no alias, expression, DISTINCT, WHERE, ORDER BY, SKIP or LIMIT. Import them with CALL (a, b) { … }, and work on them in a WITH after."
      - cypher: "MATCH (a) CALL { WITH DISTINCT a MATCH (a)-->(d) RETURN d.x AS x } RETURN x"
        error: "The importing WITH of a CALL { … } names variables of the row alone, as in Cypher: no alias, expression, DISTINCT, WHERE, ORDER BY, SKIP or LIMIT. Import them with CALL (a, b) { … }, and work on them in a WITH after."
      - cypher: "MATCH (a) CALL { WITH a, 1 AS one MATCH (a)-->(d) RETURN d.x + one AS x } RETURN x"
        error: "The importing WITH of a CALL { … } names variables of the row alone, as in Cypher: no alias, expression, DISTINCT, WHERE, ORDER BY, SKIP or LIMIT. Import them with CALL (a, b) { … }, and work on them in a WITH after."
      - cypher: "MATCH (a) CALL { WITH * WHERE true RETURN 1 AS x } RETURN x"
        error: "The importing WITH of a CALL { … } names variables of the row alone, as in Cypher: no alias, expression, DISTINCT, WHERE, ORDER BY, SKIP or LIMIT. Import them with CALL (a, b) { … }, and work on them in a WITH after."
      - cypher: "MATCH (a) CALL { UNWIND [1] AS x RETURN x UNION WITH a WHERE true RETURN 1 AS x } RETURN x"
        error: "The importing WITH of a CALL { … } names variables of the row alone, as in Cypher: no alias, expression, DISTINCT, WHERE, ORDER BY, SKIP or LIMIT. Import them with CALL (a, b) { … }, and work on them in a WITH after."
      - cypher: "MATCH (a) CALL { WITH a WHERE a.x > 1 SET a.y = 1 } RETURN a"
        error: "The importing WITH of a CALL { … } names variables of the row alone, as in Cypher: no alias, expression, DISTINCT, WHERE, ORDER BY, SKIP or LIMIT. Import them with CALL (a, b) { … }, and work on them in a WITH after."

  - name: "size() of a path"
    description: "size() of a path is refused, as Neo4j refuses it: length() gives a path's length."
    steps:
      - cypher: "MATCH p = (a)-[*]->(b) RETURN size(p)"
        error: "size() takes a list or a text, not a path, as in Neo4j: length() takes a path."

  - name: "Aggregate in a WHERE"
    description: "An aggregate in a WHERE is refused, as Neo4j refuses it (its 42I24, \"invalid use of aggregate function\"): of a MATCH or a WITH, a pattern comprehension, a list comprehension, a quantifier, a quantified path pattern, EXISTS { … } and COUNT { … }, in a subquery's or a CALL { … }'s query too. A subquery or a CALL that aggregates in its own projection is filtered as any WITH is (see queries.yaml, \"Aggregate beside a WHERE\")."
    steps:
      - cypher: "UNWIND [1, 2] AS i WITH i WHERE sum(i) > 1 RETURN i"
        error: "sum() aggregates, and a WHERE holds no aggregate, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - note: "Within a condition of several, too."
        cypher: "UNWIND [1, 2] AS i WITH i WHERE i > 1 AND count(*) > 0 RETURN i"
        error: "count(*) aggregates, and a WHERE holds no aggregate, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - cypher: "MATCH (n) WHERE count(*) > 1 RETURN n"
        error: "count(*) aggregates, and a WHERE holds no aggregate, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - cypher: "MATCH (n) WHERE sum(n.x) > 1 RETURN n"
        error: "sum() aggregates, and a WHERE holds no aggregate, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - cypher: "MATCH (a) WHERE a.x IN collect(a.y) RETURN a"
        error: "collect() aggregates, and a WHERE holds no aggregate, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - note: "A pattern comprehension's WHERE."
        cypher: "MATCH (n) RETURN [(n)-->(m) WHERE count(m) > 1 | m] AS ms"
        error: "count() aggregates, and a WHERE holds no aggregate, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - note: "A quantifier's WHERE."
        cypher: "UNWIND [[1, 2]] AS l RETURN all(x IN l WHERE sum(x) > 1) AS a"
        error: "sum() aggregates, and a WHERE holds no aggregate, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - note: "A list comprehension's WHERE."
        cypher: "UNWIND [[1, 2]] AS l RETURN [x IN l WHERE count(x) > 1 | x] AS a"
        error: "count() aggregates, and a WHERE holds no aggregate, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - note: "A quantified path pattern's WHERE."
        cypher: "MATCH (a) ((x)-[:R]->(y) WHERE count(x) > 1)+ (b) RETURN a"
        error: "count() aggregates, and a WHERE holds no aggregate, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - note: "The WHERE of EXISTS { … } and COUNT { … } of a pattern."
        cypher: "MATCH (n) WHERE EXISTS { (n)-->(m) WHERE count(m) > 1 } RETURN n"
        error: "count() aggregates, and a WHERE holds no aggregate, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - cypher: "MATCH (n) WHERE COUNT { (n)-->(m) WHERE count(m) > 1 } > 0 RETURN n"
        error: "count() aggregates, and a WHERE holds no aggregate, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - note: "A WHERE in a subquery's own query."
        cypher: "MATCH (n) WHERE EXISTS { MATCH (n)-->(m) WHERE count(m) > 1 RETURN m } RETURN n"
        error: "count() aggregates, and a WHERE holds no aggregate, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - cypher: "MATCH (n) RETURN COUNT { MATCH (n)-->(m) WITH m WHERE count(m) > 1 RETURN m } AS c"
        error: "count() aggregates, and a WHERE holds no aggregate, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - note: "A WHERE in a CALL { … }."
        cypher: "UNWIND [1, 2] AS i CALL (i) { WITH i WHERE sum(i) > 1 RETURN i AS j } RETURN j"
        error: "sum() aggregates, and a WHERE holds no aggregate, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - cypher: "UNWIND [1, 2] AS i CALL (i) { MATCH (n) WHERE count(n) > i RETURN n } RETURN n"
        error: "count() aggregates, and a WHERE holds no aggregate, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."
      - cypher: "UNWIND [1, 2] AS i CALL { WITH i MATCH (n) WHERE max(n.x) > i RETURN n } RETURN n"
        error: "max() aggregates, and a WHERE holds no aggregate, as in Neo4j: aggregate in a WITH first, and filter what it gives in that WITH's WHERE, as in WITH x, count(*) AS c WHERE c > 1."

  - name: "Implicit grouping key in a body or an ORDER BY"
    description: "An item that aggregates, and names, beside its aggregates or in a comprehension's, a quantifier's, a reduce()'s or a pattern's body, a variable outside each item that does not aggregate, is refused, as Neo4j refuses it (its 42I18, \"reference to non-grouping sub-expression\"); there, a key is read only where it is a variable or a variable's property, and in a pattern's parts only where it is a variable. So is a term of an ORDER BY that aggregates, after items that aggregate, and names a variable outside the items. What Neo4j takes beside them is in queries.yaml, \"Implicit grouping key\"."
    steps:
      - note: "A list comprehension's body: z is no grouping key, though x is."
        cypher: "UNWIND [1, 2] AS x UNWIND [3] AS z RETURN x, [y IN collect(z) | y + z] AS l"
        error: "l aggregates, and names z outside its aggregates, which no other item is: Cypher would group by it without being told. Aggregate in a WITH first, as in WITH z, collect(…) AS items RETURN { … }."
