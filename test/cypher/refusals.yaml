  - name: "Values a write makes, by position and form"
    description: "Each cell of writevalues.yaml that Neo4j 2026.10.1 refuses, a value in each position a CREATE or a MERGE takes one, by each form of value, refused with Neo4j's reason (liberation-data/drivine4j#814, #817): 42N59, a pattern naming a variable bound before it in a node made alone; 42I48, a subquery in a MERGE, or a pattern in its ON CREATE or ON MATCH SET; 42N29, a pattern naming a variable the clause makes; 42I58, the clause's own variable read anywhere else in what it makes; and 22N01, which Neo4j refuses when it runs, a node set as a property. The cells it stores are in writes.yaml, \"Values a write makes\"."
    steps:
      - note: "CREATE, a node made alone; a pattern naming a variable bound before: Neo4j's 42N59."
        cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'x'}), (m:CyMade {f: NOT (n)-[:NEXT]->()}) RETURN [n.id, m.f] ORDER BY n.id"
        error: "Variable `n` already declared, as in Neo4j: a pattern in the properties of a node that a CREATE or a MERGE makes with no relationship names no variable bound before it. Work the value out in a WITH before, as in WITH n, EXISTS { (n)-->() } AS f CREATE (m {f: f})."
      - note: "CREATE, a node made alone; a pattern comprehension naming a variable bound before: Neo4j's 42N59."
        cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'x'}), (m:CyMade {f: size([(n)-[:NEXT]->(x) | x])}) RETURN [n.id, m.f] ORDER BY n.id"
        error: "Variable `n` already declared, as in Neo4j: a pattern in the properties of a node that a CREATE or a MERGE makes with no relationship names no variable bound before it. Work the value out in a WITH before, as in WITH n, EXISTS { (n)-->() } AS f CREATE (m {f: f})."
      - note: "CREATE, a node made alone; a variable the clause makes, bare: Neo4j's 42I58."
        cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'x'}), (m:CyMade {f: a}) RETURN [n.id, m.f] ORDER BY n.id"
        error: "Creating an entity (a) and referencing that entity in a property definition in the same CREATE is not allowed, as in Neo4j: only reference variables created in earlier clauses. Make it in a clause before, or SET the property after."
      - note: "CREATE, a node made alone; a property of a variable the clause makes: Neo4j's 42I58."
        cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'x'}), (m:CyMade {f: a.name}) RETURN [n.id, m.f] ORDER BY n.id"
        error: "Creating an entity (a) and referencing that entity in a property definition in the same CREATE is not allowed, as in Neo4j: only reference variables created in earlier clauses. Make it in a clause before, or SET the property after."
