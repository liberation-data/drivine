          MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite)
          MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite)
          MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite)
          MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite)
          MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite)
          MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite)
          MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite)
          MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite)
          MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite)
          MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite)
          MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite)
          MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite)
          MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite)
          MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite)
          MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite)
          MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite)
          MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite)
          MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite)
          MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite)
          MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite)
          MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite)
          MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite)
          MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite)
          MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite)
          MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite)
          MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite)
          MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite)
          MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite)
          MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite)
          MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite)
          MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite)
          MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite)
          MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite)
          MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite) MERGE (:CyWrite)
          MERGE (n:CyWrite) RETURN count(n)
        rows: [1]
      - cypher: "MATCH (n:CyWrite) RETURN count(n)"
        rows: [1]

  - name: "A float with no fraction"
    description: "A float that is a whole number, such as 2.0, is written and read back as a float, from a parameter nested or past 32 KB too, and toString() of it keeps its fraction."
    steps:
      - cypher: "CREATE (n:CyWrite {f: $f, g: 3.0}) SET n += $m RETURN [n.f, n.g, n.h]"
        parameters: {f: 2.0, m: {h: 4.0}}
        rows: [[2.0, 3.0, 4.0]]
      - cypher: "MATCH (n:CyWrite) RETURN properties(n)"
        rows: [{f: 2.0, g: 3.0, h: 4.0}]
      - cypher: "MATCH (n:CyWrite) RETURN toString(n.g)"
        rows: ["3.0"]
      - cypher: "CREATE (n:CyWrite {id: 1, g: 5.0}) RETURN toString(n.g)"
        rows: ["5.0"]
      - cypher: "CREATE (n:CyWrite {id: 2, list: $p.list, big: $p.big}) RETURN n.list"
        parameters: {p: {list: [1.0, 2.5], big: 1.0e+20}}
        rows: [[1.0, 2.5]]
      - cypher: "MATCH (n:CyWrite {id: 2}) RETURN [n.list, n.big]"
        rows: [[[1.0, 2.5], 1.0e+20]]
      - cypher: "CREATE (n:CyWrite {id: 3, f: $doc.n}) RETURN n.f"
        parameters: {doc: {text: {$repeat: "y", times: 40000}, n: 2.0}}
        rows: [2.0]

  - name: "A whole float matches the whole number stored"
    description: "A float parameter that is a whole number, such as 1.0, matches the whole number a node holds, in a MATCH that writes and in a MERGE, which makes no second node."
    steps:
      - cypher: "CREATE (n:CyWrite {id: 1})"
      - cypher: "MATCH (n:CyWrite {id: $id}) SET n.seen = true RETURN n.id"
        parameters: {id: 1.0}
        rows: [1]
      - cypher: "MERGE (n:CyWrite {id: $id}) RETURN n.id"
        parameters: {id: 1.0}
        rows: [1]
      - cypher: "MATCH (n:CyWrite) RETURN [n.id, n.seen]"
        rows: [[1, true]]

  - name: "A map parameter keyed with $"
    description: "A write reads a map parameter with a key that begins with $, such as extended JSON's $numberDouble, as the map it is, alone or beside a float that is a whole number."
    steps:
      - cypher: "CREATE (n:CyWrite {id: 1}) RETURN $m"
        parameters: {m: {$numberDouble: "1"}}
        rows: [{$numberDouble: "1"}]
      - note: "Beside a float that is a whole number, which the write reads from the same parameters."
        cypher: "CREATE (n:CyWrite {id: 2, f: $f}) RETURN $l"
        parameters: {f: 2.0, l: {$numberLong: "5"}}
        rows: [{$numberLong: "5"}]

  - name: "One clock for a statement's writes"
    description: "Every row a statement writes reads the same moment from the clock."
    steps:
      - cypher: "UNWIND range(1, 200) AS i CREATE (:CyWrite {at: localdatetime()})"
        rows: []
      - cypher: "MATCH (n:CyWrite) RETURN count(DISTINCT n.at)"
        rows: [1]

  - name: "Text named like the compiler's own"
    description: "Texts and keys that read like names a compiled statement uses inside are written as they are."
    steps:
      - cypher: |
          CREATE (n:CyWrite {name: 'cy_row', s: "it's cy_value", `cy_count`: 'cy_record.item'})
          SET n.cy_id = 'cy_params'
          RETURN properties(n)
        rows: [{name: "cy_row", s: "it's cy_value", cy_count: "cy_record.item", cy_id: "cy_params"}]

  - name: "Write refused on SQL stores"
    description: "Write syntax the compiler doesn't handle yet is refused on SQL stores, naming what it is."
    steps:
      - only: [sql]
        cypher: "MATCH (a:CyWrite), (b:CyWrite) MERGE (a)-[:R*1..2]->(b)"
        error: "A variable-length relationship in CREATE or MERGE is Cypher, and is not compiled to SQL yet."
      - only: [sql]
        cypher: "CREATE (:CyWrite)-[:R]-(:CyWrite)"
        error: "A relationship that CREATE makes has a direction."

  - name: "Parameter named by a keyword in a write"
    description: "A parameter named by a keyword is read in a pattern's map, a SET and a SET +=, as any other."
    steps:
      - cypher: "CREATE (n:CyWrite {name: $create}) SET n.born = $set, n += $merge"
        parameters: {create: "Ada", set: 1815, merge: {first: true}}
      - cypher: "MATCH (n:CyWrite) RETURN properties(n)"
        rows: [{name: "Ada", born: 1815, first: true}]

  - name: "Labels and types something has now"
    description: "db.labels() and db.relationshipTypes() give only what a node or a relationship has now, as Neo4j lists them, and nothing for an empty graph."
    steps:
      - cypher: "CALL db.labels()"
        rows: []
      - cypher: "CREATE (:CyWrite:Gone)-[:GOING]->(:CyWrite:Kept)"
      - cypher: "CALL db.labels() YIELD label RETURN label ORDER BY label"
        rows: ["CyWrite", "Gone", "Kept"]
      - cypher: "CALL db.relationshipTypes()"
        rows: ["GOING"]
      - cypher: "MATCH (g:Gone) DETACH DELETE g"
      - cypher: "CALL db.labels() YIELD label RETURN label ORDER BY label"
        rows: ["CyWrite", "Kept"]
      - cypher: "CALL db.relationshipTypes()"
        rows: []

  - name: "Labels of the statement's own writes, and of odd names"
    description: "db.labels() reads the labels a write before it in the statement gave, and gives a label as it is named."
    steps:
      - cypher: "CREATE (:CyWrite:`odd label`:`a\"b`) WITH 1 AS one CALL db.labels() YIELD label RETURN label"
        unordered: true
        rows: ["CyWrite", "a\"b", "odd label"]

  - name: "Labels feeding a write"
    description: "What db.labels() yields is written by a clause after it, and its WHERE reads the variables around it in a statement that writes."
    steps:
      - cypher: "CREATE (:CyWrite:Kept)"
      - cypher: "CALL db.labels() YIELD label CREATE (:CyWrite {copy: label})"
      - cypher: "MATCH (n:CyWrite) WHERE n.copy IS NOT NULL RETURN n.copy ORDER BY n.copy"
        rows: ["CyWrite", "Kept"]
      - cypher: "CREATE (:CyWrite:Fresh) WITH 'Fresh' AS wanted CALL db.labels() YIELD label WHERE label = wanted RETURN label"
        rows: ["Fresh"]

  - name: "A random value bound by a WITH in a write"
    description: "randomUUID() bound by a WITH is one value however often a write after reads it."
    steps:
      - cypher: "CREATE (n:CyWrite) WITH n, randomUUID() AS u SET n.u = u, n.v = u"
      - cypher: "MATCH (n:CyWrite) RETURN n.u = n.v"
        rows: [true]

  - name: "Values that hold a null in a statement that writes"
    description: "A statement that writes compares a list or a map that holds a null, or a null node, item by item too."
    steps:
      - cypher: "CREATE (n:CyWrite) WITH n, [1, null] AS a, [1, null] AS b, [2, null] AS c SET n.same = coalesce(a = b, 'null'), n.other = a = c, n.unequal = a <> c RETURN [n.same, n.other, n.unequal]"
        rows: [["null", false, true]]
      - note: "Two lists that differ as JSON are compared item by item too: a pair that holds a null is null."
        cypher: "CREATE (n:CyWrite) WITH n, [null] AS a, [1] AS b SET n.eq = coalesce(a = b, 'null') RETURN n.eq"
        rows: ["null"]
      - note: "Maps, lists within lists, IN and <> compare the same way in a statement that writes."
        cypher: "CREATE (n:CyWrite) WITH n, [null, 1] AS a, [2, 1] AS b, {x: null} AS m, {x: 1} AS o, [[null], 1] AS c, [[1], 2] AS d RETURN [a = b, m = o, c = d, a <> [1, 2], a IN [b, [3]], a IN [[3]], {k: [null]} = {k: [2]}, m <> {y: 1}]"
        rows: [[null, null, false, true, null, false, null, true]]
      - note: "A node OPTIONAL MATCH finds none of is null in the list that holds it."
        cypher: "OPTIONAL MATCH (x:Nope) CREATE (n:CyWrite) WITH n, [x] AS a, [n] AS b RETURN [a = b, a = a]"
        rows: [[null, null]]
      - note: "A value of another kind than the one that holds a null is not equal to it, where a column holds values of several kinds (drivine4j#518)."
        cypher: "UNWIND [1, [1], 'x', 1.5, true, {a: 1}] AS v CREATE (:CyWrite) RETURN [v = [null], v = {a: null}, v IN [[null]], v <> [1, null]] AS r"
        only: [neo4j, sql]
        rows: [[false, false, false, true], [null, false, null, true], [false, false, false, true], [false, false, false, true], [false, false, false, true], [false, null, false, true]]

  - name: "A property stored as several kinds sorts in Cypher's order of kinds"
    description: "A property read from the store may be of any kind: ORDER BY sorts a list, then a text, a truth value, a number, and a missing property last."
    steps:
      - cypher: "CREATE (:CyWrite {v: 2}), (:CyWrite {v: 'b'}), (:CyWrite {v: true}), (:CyWrite {v: [1]}), (:CyWrite {v: 1.5}), (:CyWrite {v: 'B'}), (:CyWrite {v: false}), (:CyWrite)"
      - note: "Postgres sorts a number before a truth value, and a list last (drivine4j#307)."
        cypher: "MATCH (k:CyWrite) RETURN k.v ORDER BY k.v"
        except: [postgres]
        rows: [[1], "B", "b", false, true, 1.5, 2, null]
      - cypher: "MATCH (k:CyWrite) RETURN k.v ORDER BY k.v DESC"
        except: [postgres]
        rows: [null, 2, 1.5, true, false, "b", "B", [1]]
      - cypher: "MATCH (k:CyWrite) WITH k ORDER BY k.v SKIP 2 LIMIT 2 RETURN k.v"
        except: [postgres]
        rows: ["b", false]

  - name: "A stored text past 4000 bytes"
    description: "A stored text past 4000 bytes, read in one row, is measured and changed whole, as a short one is."
    steps:
      - cypher: "CREATE (:CyWrite {a: $t, b: $u})"
        parameters: {t: {$repeat: "x", times: 5000}, u: {$repeat: "y", times: 40000}}
      - cypher: "MATCH (n:CyWrite) WITH n.a AS x RETURN [size(x), toUpper(x), size(x + x), x STARTS WITH 'xx']"
        rows: [[5000, {$repeat: "X", times: 5000}, 10000, true]]
      - cypher: "MATCH (n:CyWrite) WITH n.b AS x RETURN [size(x), toUpper(x), size(x + x), x ENDS WITH 'yy']"
        rows: [[40000, {$repeat: "Y", times: 40000}, 80000, true]]

  - name: "Two lists ordered in a statement that writes"
    description: "Two lists are ordered item by item in a statement that writes, as in one that reads; Oracle refuses it."
    steps:
      - cypher: "CREATE (n:CyWrite {a: [1] < [2], b: [1, 'a'] < [1, 2], c: ['b'] >= ['a', 'z']}) RETURN [n.a, n.b, n.c]"
        except: [memgraph, falkordb, neptune, oracle]
        rows: [[true, null, true]]
      - only: [oracle]
        cypher: "CREATE (n:CyWrite {a: [1] < [2], b: [1, 'a'] < [1, 2], c: ['b'] >= ['a', 'z']}) RETURN [n.a, n.b, n.c]"
        error: "Two lists compared with <, <=, > or >= do not run on Oracle in a statement that writes: its block calls no function of its own from SQL."
      - cypher: "UNWIND [[2], [1, 3], [1]] AS l CREATE (:CyWrite {l: l})"
      - cypher: "MATCH (m:CyWrite) WHERE m.l < [2] SET m.small = true"
        except: [memgraph, falkordb, neptune, oracle]
      - only: [oracle]
        cypher: "MATCH (m:CyWrite) WHERE m.l < [2] SET m.small = true"
        error: "Two lists compared with <, <=, > or >= do not run on Oracle in a statement that writes: its block calls no function of its own from SQL."
      - cypher: "MATCH (m:CyWrite) WHERE m.l IS NOT NULL RETURN [m.l, m.small] ORDER BY m.l[0], size(m.l)"
        except: [memgraph, falkordb, neptune, oracle]
        rows: [[[1], true], [[1, 3], true], [[2], null]]

  - name: "NaN and the infinities written"
    description: "Neo4j and Oracle store NaN and the infinities as the floats they are, and SQLite an infinity. Postgres's JSON holds neither, and SQLite's no NaN, so they refuse a statement that writes and is given one, rather than store another value."
    steps:
      - only: [neo4j, oracle, sqlite]
        cypher: "CREATE (n:CyWrite {b: $i, c: [$n]}) RETURN [n.b, n.c, n.b = n.b]"
        parameters: {i: {$float: "Infinity"}, n: {$float: "-Infinity"}}
        rows: [[{$float: "Infinity"}, [{$float: "-Infinity"}], true]]
      - only: [neo4j, oracle, sqlite]
        cypher: "MATCH (n:CyWrite) RETURN [n.b = $i, n.b > 1e308, n.c[0] < -1e308, n.b + 1, n.b - n.b]"
        parameters: {i: {$float: "Infinity"}}
        rows: [[true, true, true, {$float: "Infinity"}, {$float: "NaN"}]]
      - only: [neo4j, oracle]
        cypher: "MATCH (n:CyWrite) SET n.a = $p RETURN [n.a, n.a = n.a, n.a = $p, n.a + 1]"
        parameters: {p: {$float: "NaN"}}
        rows: [[{$float: "NaN"}, false, false, {$float: "NaN"}]]
      - only: [postgres]
        cypher: "CREATE (n:CyWrite {b: [$i]})"
        parameters: {i: {$float: "Infinity"}}
        error: "A statement that writes is given NaN or an infinity, which Postgres's `jsonb` holds as no number: it would store another value in its place."
      - only: [sqlite]
        cypher: "CREATE (n:CyWrite {a: $p})"
        parameters: {p: {$float: "NaN"}}
        error: "A statement that writes is given NaN, which SQLite's JSON holds as no number: it would store another value in its place."
      - note: "The two infinities stored are summed to NaN by a statement given neither (drivine4j#544)."
        only: [neo4j, oracle, sqlite]
        cypher: "CREATE (:CyWrite {b: $n})"
        parameters: {n: {$float: "-Infinity"}}
      - only: [neo4j, oracle, sqlite]
        cypher: "MATCH (n:CyWrite) RETURN [min(n.b), max(n.b), sum(n.b), avg(n.b)]"
        rows: [[{$float: "-Infinity"}, {$float: "Infinity"}, {$float: "NaN"}, {$float: "NaN"}]]
      - note: "Each NaN worked out of a stored infinity is kept apart by count(DISTINCT …) and collect(DISTINCT …), as ∞ - ∞ is (drivine4j#558)."
        only: [neo4j, oracle, sqlite]
        cypher: "MATCH (n:CyWrite) WHERE n.b IS NOT NULL RETURN count(DISTINCT n.b - n.b), size(collect(DISTINCT n.b - n.b))"
        rows: [[2, 2]]

  - name: "MERGE of a null or NaN property"
    description: "A MERGE fails where it makes a node or relationship whose pattern gives a property that is null or NaN, which is equal to nothing, which no MERGE would find again; over no rows it does not fail. ON CREATE SET and ON MATCH SET write NaN, and a list that holds NaN is merged, and made again each time, though DISTINCT keeps two such lists once, and Neo4j two stored NaNs apart."
    steps:
      - note: "A SQL store made a new node on every run (drivine4j#543)."
        except: [neptune]
        cypher: "MERGE (n:CyWrite {id: 1, x: null})"
        error: true
      - except: [neptune]
        cypher: "MERGE (n:CyWrite {id: 1, x: $p})"
        parameters: {p: null}
        error: true
      - cypher: "CREATE (:CyWrite {id: 1})"
      - except: [neptune]
        cypher: "MATCH (s:CyWrite {id: 1}) MERGE (n:CyWrite {x: s.none})"
        error: true
      - except: [neptune]
        cypher: "MATCH (s:CyWrite {id: 1}) MERGE (s)-[:R {x: null}]->(:CyWrite {id: 2})"
        error: true
      - except: [neptune]
        cypher: "UNWIND [2, null] AS v MERGE (:CyWrite {id: v})"
        error: true
      - except: [neptune]
        cypher: "MATCH (s:CyWrite {id: 9}) MERGE (n:CyWrite {x: null}) RETURN n.x"
        rows: []
      - cypher: "MATCH (n) RETURN count(n)"
        rows: [1]
      - only: [neo4j, oracle]
        cypher: "MERGE (n:CyWrite {x: $p})"
        parameters: {p: {$float: "NaN"}}
        error: true
      - only: [neo4j, oracle]
        cypher: "MATCH (s:CyWrite {id: 1}) MERGE (s)-[:R {x: $i - $i}]->(:CyWrite {id: 2})"
        parameters: {i: {$float: "Infinity"}}
        error: true
      - only: [neo4j, oracle, sqlite]
        cypher: "MATCH (s:CyWrite {id: 1}) SET s.a = $i, s.b = -$i"
        parameters: {i: {$float: "Infinity"}}
      - only: [neo4j, oracle, sqlite]
        cypher: "MATCH (s:CyWrite {id: 1}) MERGE (n:CyWrite {x: s.a + s.b})"
        error: true
      - cypher: "MATCH (n) RETURN count(n)"
        rows: [1]
      - only: [neo4j, oracle]
        cypher: "MERGE (n:CyWrite {id: 3}) ON CREATE SET n.x = $p RETURN n.x"
        parameters: {p: {$float: "NaN"}}
        rows: [{$float: "NaN"}]
      - only: [neo4j, oracle]
        cypher: "MERGE (n:CyWrite {id: 3}) ON MATCH SET n.y = $p RETURN [n.x, n.y]"
        parameters: {p: {$float: "NaN"}}
        rows: [[{$float: "NaN"}, {$float: "NaN"}]]
      - only: [neo4j, oracle]
        cypher: "UNWIND [1, 2] AS i MERGE (n:CyWrite {l: [$p]}) RETURN n.l"
        parameters: {p: {$float: "NaN"}}
        rows: [[{$float: "NaN"}], [{$float: "NaN"}]]
      - only: [neo4j, oracle]
        cypher: "MATCH (n:CyWrite) WHERE n.l IS NOT NULL RETURN count(n)"
        rows: [2]
      - note: "Two stored lists that hold NaN are one value to count(DISTINCT …) and collect(DISTINCT …), and the NaNs in them two, as Neo4j has it (drivine4j#558)."
        only: [neo4j, oracle]
        cypher: "MATCH (n:CyWrite) WHERE n.l IS NOT NULL RETURN count(DISTINCT n.l), size(collect(DISTINCT n.l))"
        rows: [[1, 1]]
      - note: "Neo4j keeps two stored NaNs apart. Oracle keeps them once where the statement works out no NaN: testing every value it reads for NaN made count(DISTINCT …) 2.6 times as slow (drivine4j#558)."
        only: [neo4j]
        cypher: "MATCH (n:CyWrite) WHERE n.l IS NOT NULL RETURN count(DISTINCT n.l[0]), size(collect(DISTINCT n.l[0]))"
        rows: [[2, 2]]
      - only: [oracle]
        cypher: "MATCH (n:CyWrite) WHERE n.l IS NOT NULL RETURN count(DISTINCT n.l[0]), size(collect(DISTINCT n.l[0]))"
        rows: [[1, 1]]

  - name: "NaN worked out from stored infinities"
    description: "NaN that a statement given no NaN or infinity works out, from infinities stored, is the float it is, as NaN given is: equal to nothing and ordered with nothing, kept by `+`, written by toString() as Java writes it, no map, sorted after every number, and NaN in a sum and a max(). SQLite's JSON holds no NaN, so its rows give it back from the value it stands in for it (see host.yaml), and it refuses a write of it. Postgres stores no infinity to start from."
    steps:
      - only: [neo4j, oracle, sqlite]
        cypher: "CREATE (:CyWrite {b: $i, c: [$n], s: 'a'})"
        parameters: {i: {$float: "Infinity"}, n: {$float: "-Infinity"}}
      - only: [neo4j, oracle, sqlite]
        cypher: "MATCH (n:CyWrite) WITH n.b + n.c[0] AS x RETURN [x, x = x, x <> x, x > 1.0, x IN [x], [x] = [x], {k: x} = {k: x}, [x, 1] < [x, 2], [1, x] < [2, x]]"
        rows: [[{$float: "NaN"}, false, true, false, false, false, false, null, true]]
      - only: [neo4j, oracle, sqlite]
        cypher: "MATCH (n:CyWrite) WITH n, n.b + n.c[0] AS x RETURN [x + 1, n.s + x, x + n.s, n.b + 1, [x] + x, toString(x), toString(n.b)]"
        rows: [[{$float: "NaN"}, "aNaN", "NaNa", {$float: "Infinity"}, [{$float: "NaN"}, {$float: "NaN"}], "NaN", "Infinity"]]
      - note: "keys() of a float fails, as of any value that is no map, node or relationship."
        only: [neo4j, oracle, sqlite]
        cypher: "MATCH (n:CyWrite) WITH n.b + n.c[0] AS x RETURN keys(x)"
        error: true
      - only: [neo4j, oracle, sqlite]
        cypher: "MATCH (n:CyWrite) UNWIND [n.b + n.c[0], n.b, 1.0, n.c[0]] AS x RETURN x ORDER BY x"
        rows: [{$float: "-Infinity"}, 1.0, {$float: "Infinity"}, {$float: "NaN"}]
      - only: [neo4j, oracle, sqlite]
        cypher: "MATCH (n:CyWrite) UNWIND [[n.b + n.c[0]], [n.b], [1.0], [n.c[0]], [1.0, n.b + n.c[0]]] AS l RETURN l ORDER BY l"
        rows: [[{$float: "-Infinity"}], [1.0], [1.0, {$float: "NaN"}], [{$float: "Infinity"}], [{$float: "NaN"}]]
      - only: [neo4j, oracle, sqlite]
        cypher: "MATCH (n:CyWrite) UNWIND [n.b + n.c[0], 1.0, 2.0] AS x RETURN [min(x), max(x), sum(x), count(x)]"
        rows: [[1.0, {$float: "NaN"}, {$float: "NaN"}, 3]]
      - only: [neo4j, oracle, sqlite]
        cypher: "MATCH (n:CyWrite) RETURN [round(n.b, 2, 'HALF_DOWN'), round(n.c[0], 0, 'UP')]"
        rows: [[{$float: "Infinity"}, {$float: "-Infinity"}]]
      - only: [neo4j, oracle]
        cypher: "MATCH (n:CyWrite) SET n.x = n.b + n.c[0] RETURN [n.x, n.x = n.x]"
        rows: [[{$float: "NaN"}, false]]
      - note: "The store fails as the statement runs: \"A statement that writes works out NaN, which SQLite's JSON holds as no number: it would store another value in its place.\""
        only: [sqlite]
        cypher: "MATCH (n:CyWrite) SET n.x = n.b + n.c[0]"
        error: true
      - note: "As above."
        only: [sqlite]
        cypher: "MATCH (n:CyWrite) CREATE (:CyWrite {l: [n.b + n.c[0]]})"
        error: true
      - only: [sqlite]
        cypher: "MATCH (n) RETURN [count(n), collect(n.x)]"
        rows: [[1, []]]

  - name: "Relationships as APOC's export writes them"
    description: "apoc.export.cypher writes each batch of relationships as an UNWIND of rows that names its nodes start and end by a key of spaces, and the stores make them (drivine4j#635, drivine4j#617)."
    steps:
      - cypher: "UNWIND [{_id: 1, properties: {name: 'Ada'}}, {_id: 2, properties: {name: 'Bob'}}, {_id: 3, properties: {name: 'Cy'}}] AS row CREATE (n:CyWrite:`UNIQUE IMPORT LABEL` {`UNIQUE IMPORT ID`: row._id}) SET n += row.properties"
      - cypher: "UNWIND [{start: {_id: 1}, end: {_id: 2}, properties: {since: 2020}}, {start: {_id: 2}, end: {_id: 3}, properties: {}}, {start: {_id: 3}, end: {_id: 9}, properties: {}}] AS row MATCH (start:`UNIQUE IMPORT LABEL` {`UNIQUE IMPORT ID`: row.start._id}) MATCH (end:`UNIQUE IMPORT LABEL` {`UNIQUE IMPORT ID`: row.end._id}) CREATE (start)-[r:KNOWS]->(end) SET r += row.properties"
      - note: "A row whose node isn't there makes nothing."
        cypher: "MATCH (a:CyWrite)-[r:KNOWS]->(b:CyWrite) RETURN [a.name, r.since, b.name] ORDER BY a.name"
        rows: [["Ada", 2020, "Bob"], ["Bob", null, "Cy"]]

  - name: "Schema: a uniqueness constraint"
    description: "A uniqueness constraint made by Neo4j's DDL refuses a second node of its key; made again IF NOT EXISTS it gives no rows, and without it fails; dropped by its name, it refuses no more, and dropped again it fails unless IF EXISTS. The SQL stores apply the DDL through Drivine's schema machinery."
    steps:
      - only: [neo4j, sql]
        cypher: "DROP CONSTRAINT cy_ddl_key IF EXISTS"
        rows: []
      - only: [neo4j, sql]
        cypher: "CREATE CONSTRAINT cy_ddl_key IF NOT EXISTS FOR (n:CyDdl) REQUIRE n.key IS UNIQUE"
        rows: []
      - only: [neo4j, sql]
        cypher: "CREATE CONSTRAINT cy_ddl_key IF NOT EXISTS FOR (n:CyDdl) REQUIRE n.key IS UNIQUE"
        rows: []
      - only: [neo4j, sql]
        note: "Without IF NOT EXISTS, over a constraint that is there, the statement fails, as Neo4j fails it."
        cypher: "CREATE CONSTRAINT cy_ddl_key FOR (n:CyDdl) REQUIRE n.key IS UNIQUE"
        error: true
      - only: [neo4j, sql]
        cypher: "CREATE (:CyDdl {key: 1})"
      - only: [neo4j, sql]
        cypher: "CREATE (:CyDdl {key: 1})"
        error: true
      - only: [neo4j, sql]
        cypher: "MATCH (n:CyDdl) RETURN count(n)"
        rows: [1]
      - only: [neo4j, sql]
        cypher: "DROP CONSTRAINT cy_ddl_key"
        rows: []
      - only: [neo4j, sql]
        cypher: "CREATE (:CyDdl {key: 1})"
      - only: [neo4j, sql]
        cypher: "MATCH (n:CyDdl) RETURN count(n)"
        rows: [2]
      - only: [neo4j, sql]
        cypher: "DROP CONSTRAINT cy_ddl_key"
        error: true
      - only: [neo4j, sql]
        cypher: "DROP CONSTRAINT cy_ddl_key IF EXISTS"
        rows: []

  - name: "Schema: a range index"
    description: "A range index made by Neo4j's DDL is waited for by db.awaitIndexes, which gives no rows, and a query reads through it as without it; dropped by its name, it is gone."
    steps:
      - only: [neo4j, sql]
        cypher: "DROP INDEX cy_ddl_name IF EXISTS"
        rows: []
      - only: [neo4j, sql]
        cypher: "CREATE INDEX cy_ddl_name IF NOT EXISTS FOR (n:CyDdl) ON (n.name)"
        rows: []
      - only: [neo4j, sql]
        cypher: "CALL db.awaitIndexes(300)"
        rows: []
      - only: [neo4j, sql]
        cypher: "CREATE (:CyDdl {name: 'Ada'}), (:CyDdl {name: 'Bob'})"
      - only: [neo4j, sql]
        cypher: "MATCH (n:CyDdl) WHERE n.name = 'Bob' RETURN n.name"
        rows: ["Bob"]
      - only: [neo4j, sql]
        cypher: "MATCH (n:CyDdl {name: $name}) RETURN n.name"
        parameters: {name: "Ada"}
        rows: ["Ada"]
      - only: [neo4j, sql]
        cypher: "DROP INDEX cy_ddl_name"
        rows: []
      - only: [neo4j, sql]
        cypher: "DROP INDEX cy_ddl_name IF EXISTS"
        rows: []

  - name: "Schema: names in backticks"
    description: "A constraint named in backticks, with spaces and a doubled backtick in its name, on a label and a property named in backticks, is made, refuses a second node of its key, and is dropped by that name."
    steps:
      - only: [neo4j, sql]
        cypher: "DROP CONSTRAINT `cy ddl ``quoted`` key` IF EXISTS"
        rows: []
      - only: [neo4j, sql]
        cypher: "CREATE CONSTRAINT `cy ddl ``quoted`` key` IF NOT EXISTS FOR (n:`CyDdl Thing`) REQUIRE (n.`the key`) IS UNIQUE"
        rows: []
      - only: [neo4j, sql]
        cypher: "CREATE (:`CyDdl Thing` {`the key`: 'a'})"
      - only: [neo4j, sql]
        cypher: "CREATE (:`CyDdl Thing` {`the key`: 'a'})"
        error: true
      - only: [neo4j, sql]
        cypher: "DROP CONSTRAINT `cy ddl ``quoted`` key`"
        rows: []
      - only: [neo4j, sql]
        cypher: "CREATE (:`CyDdl Thing` {`the key`: 'a'})"
      - only: [neo4j, sql]
        cypher: "MATCH (n:`CyDdl Thing`) RETURN count(n)"
        rows: [2]
      - only: [neo4j, sql]
        cypher: "DROP CONSTRAINT `cy ddl ``quoted`` key` IF EXISTS"
        rows: []

  - name: "NaN and the infinities worked out and written"
    description: "Neo4j and Oracle store NaN and the infinities a statement works out, as the floats they are, and MERGE of NaN fails as of NaN given. SQLite's JSON holds no NaN, so SQLite refuses a statement that writes NaN it works out, and stores nothing in its place; it stores an infinity."
    steps:
      - only: [neo4j, oracle]
        cypher: "CREATE (n:CyWrite {a: 0.0 / 0.0, b: 1.0 / 0.0, l: [0.0 / 0.0]}) RETURN [n.a, n.b, n.l]"
        rows: [[{$float: "NaN"}, {$float: "Infinity"}, [{$float: "NaN"}]]]
      - note: "Oracle held a stored NaN equal to NaN."
        only: [neo4j, oracle]
        cypher: "MATCH (n:CyWrite) RETURN [n.a = n.a, n.a <> n.a, n.a > 1.0, n.a < 1.0, n.b > 1e308, n.a + 1, n.b - 1, n.l = n.l, n.a IN n.l]"
        rows: [[false, true, false, false, true, {$float: "NaN"}, {$float: "Infinity"}, false, false]]
      - note: "Neo4j: 22N31."
        only: [neo4j, oracle]
        cypher: "MATCH (n:CyWrite) MERGE (:CyWrite {x: n.a})"
        error: true
      - only: [neo4j, oracle]
        cypher: "MATCH (n) RETURN count(n)"
        rows: [1]
      - note: "The store fails as the statement runs: \"A statement that writes works out NaN, which SQLite's JSON holds as no number: it would store another value in its place.\""
        only: [sqlite]
        cypher: "CREATE (n:CyWrite {a: 0.0 / 0.0})"
        error: true
      - only: [sqlite]
        cypher: "MATCH (n) RETURN count(n)"
        rows: [0]
      - only: [sqlite]
        cypher: "CREATE (n:CyWrite {b: 1.0 / 0.0, l: [-1.0 / 0.0]}) RETURN [n.b, n.l]"
        rows: [[{$float: "Infinity"}, [{$float: "-Infinity"}]]]
      - only: [sqlite]
        cypher: "MATCH (n:CyWrite) SET n.a = n.b + n.l[0]"
        error: true
      - only: [sqlite]
        cypher: "MATCH (n:CyWrite) RETURN [n.a, n.b + n.l[0]]"
        rows: [[null, {$float: "NaN"}]]

  - name: "NaN and the infinities given to SET and MERGE"
    description: "Postgres's JSON holds neither NaN nor an infinity, and SQLite's no NaN, so each refuses a statement given one that SET, ON CREATE SET or a MERGE's pattern would write, as it refuses a CREATE given one, and stores nothing."
    steps:
      - only: [postgres, sqlite]
        cypher: "CREATE (:CyWrite {id: 1})"
      - only: [postgres]
        cypher: "MATCH (n:CyWrite {id: 1}) SET n.a = $p"
        parameters: {p: {$float: "NaN"}}
        error: "A statement that writes is given NaN or an infinity, which Postgres's `jsonb` holds as no number: it would store another value in its place."
      - only: [postgres]
        cypher: "MERGE (n:CyWrite {id: 2}) ON CREATE SET n.a = [$i]"
        parameters: {i: {$float: "-Infinity"}}
        error: "A statement that writes is given NaN or an infinity, which Postgres's `jsonb` holds as no number: it would store another value in its place."
      - only: [sqlite]
        cypher: "MATCH (n:CyWrite {id: 1}) SET n.a = $p"
        parameters: {p: {$float: "NaN"}}
        error: "A statement that writes is given NaN, which SQLite's JSON holds as no number: it would store another value in its place."
      - only: [sqlite]
        cypher: "MERGE (n:CyWrite {id: 2}) ON CREATE SET n.a = [$p]"
        parameters: {p: {$float: "NaN"}}
        error: "A statement that writes is given NaN, which SQLite's JSON holds as no number: it would store another value in its place."
      - only: [postgres]
        cypher: "MERGE (n:CyWrite {id: 3, a: $p})"
        parameters: {p: {$float: "Infinity"}}
        error: "A statement that writes is given NaN or an infinity, which Postgres's `jsonb` holds as no number: it would store another value in its place."
      - only: [sqlite]
        cypher: "MERGE (n:CyWrite {id: 3, a: $p})"
        parameters: {p: {$float: "NaN"}}
        error: "A statement that writes is given NaN, which SQLite's JSON holds as no number: it would store another value in its place."
      - only: [postgres, sqlite]
        cypher: "MATCH (n:CyWrite) RETURN [count(n), collect(n.a)]"
        rows: [[1, []]]

  - name: "A long text a function gives a property of"
    description: "A text past 32 KB that is a property of a node a function or an index gives, or of its properties() map, is read whole, on each of several rows."
    steps:
      - cypher: "UNWIND [1, 2] AS i CREATE (:CyWrite {i: i, t: $t})"
        parameters: {t: {$repeat: "x", times: 40001}}
      - note: "Oracle closed the session (drivine4j#531)."
        cypher: "MATCH (n:CyWrite) WITH n ORDER BY n.i RETURN [n.i, size(head([n]).t), size([n][0].t), size(properties(n).t)]"
        rows: [[1, 40001, 40001, 40001], [2, 40001, 40001, 40001]]
      - cypher: "MATCH (n:CyWrite) WHERE head([n]).t ENDS WITH 'x' RETURN count(*)"
        rows: [2]

  - name: "A stored empty text searched for and measured"
    description: "A stored empty text starts with, ends with and holds the empty text, and no other; its size is 0. Oracle's empty text is null as SQL text (drivine4j#416)."
    steps:
      - cypher: "CREATE (:CyWrite {k: 0, name: 'ab'}), (:CyWrite {k: 1, name: ''}), (:CyWrite {k: 2, name: 'xy'}), (:CyWrite {k: 3, name: 5})"
      - only: [neo4j, sql]
        cypher: "MATCH (a:CyWrite) WHERE a.name STARTS WITH '' RETURN a.name ORDER BY a.k"
        rows: ["ab", "", "xy"]
      - only: [neo4j, sql]
        cypher: "MATCH (a:CyWrite) WHERE a.name ENDS WITH $e RETURN a.name ORDER BY a.k"
        parameters: {e: ""}
        rows: ["ab", "", "xy"]
      - only: [neo4j, sql]
        cypher: "MATCH (a:CyWrite) WHERE a.name CONTAINS '' RETURN a.name ORDER BY a.k"
        rows: ["ab", "", "xy"]
      - only: [neo4j, sql]
        cypher: "MATCH (a:CyWrite) WHERE NOT a.name CONTAINS 'b' RETURN a.name ORDER BY a.k"
        rows: ["", "xy"]
      - only: [neo4j, sql]
        cypher: "MATCH (a:CyWrite), (b:CyWrite {k: 1}) WHERE a.name STARTS WITH b.name RETURN a.name ORDER BY a.k"
        rows: ["ab", "", "xy"]
      - only: [neo4j, sql]
        cypher: "MATCH (a:CyWrite {k: 1}), (b:CyWrite) WHERE a.name ENDS WITH b.name RETURN b.name ORDER BY b.k"
        rows: [""]
      - only: [neo4j, sql]
        cypher: "MATCH (a:CyWrite) WHERE a.k < 3 RETURN a.name, size(a.name) ORDER BY a.k"
        rows: [["ab", 2], ["", 0], ["xy", 2]]
      - note: "Written by SET, as a statement that writes reads it."
        only: [neo4j, sql]
        cypher: "MATCH (a:CyWrite {k: 1}) SET a.s = size(a.name), a.c = 'ab' CONTAINS a.name RETURN [a.s, a.c]"
        rows: [[0, true]]
