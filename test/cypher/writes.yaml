          226, 227, 228, 229, 230, 231, 232, 233, 234, 235, 236, 237, 238, 239, 240, 241, 242, 243, 244, 245, 246, 247, 248, 249, 250
        ]
      - cypher: "MATCH (n:CyWrite) SET n.j = n.i RETURN count(*)"
        rows: [250]
      - cypher: "MATCH (n:CyWrite) RETURN [count(n), sum(n.j)]"
        rows: [[250, 31375]]

  - name: "A write that returns a row past 32 KB"
    description: "A statement that writes returns a row past 32 KB whole: a text of 40,000 characters it stores, alone, and one it works out of 80,000, in a list. On Oracle a compiled write's block returns each row as JSON, which a driver may read in parts of 32 KB. Two rows are covered once an Oracle fix ships (drivine4j#670)."
    steps:
      - cypher: "CREATE (n:CyWrite {i: 1, t: $t}) RETURN n.t"
        parameters: {t: {$repeat: "x", times: 40000}}
        rows: [{$repeat: "x", times: 40000}]
      - cypher: "MATCH (n:CyWrite {i: 1}) SET n.t = n.t + n.t RETURN [n.i, n.t]"
        rows: [[1, {$repeat: "x", times: 80000}]]
      - cypher: "MATCH (n:CyWrite) RETURN [n.i, size(n.t)] ORDER BY n.i"
        rows: [[1, 80000]]

