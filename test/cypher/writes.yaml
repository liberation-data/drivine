# Cypher that writes, run from an empty graph, and the rows each store gives as it goes. See README.md.
label: CyWrite

cases:
  - name: "CREATE"
    description: "CREATE makes its nodes and relationships, and returns what it made."
    steps:
      - cypher: "CREATE (a:CyWrite:Person {name: 'Ada', tags: ['x', 'y'], none: null})-[:KNOWS {since: 2020}]->(b:CyWrite {name: 'Bob'}) RETURN a.name, b.name"
        rows: [["Ada", "Bob"]]
      - cypher: |
          MATCH (a:CyWrite)-[r:KNOWS]->(b:CyWrite)
          RETURN {from: a.name, since: r.since, to: b.name, tags: a.tags, person: a:Person, none: a.none IS NULL}
        rows: [{from: "Ada", since: 2020, to: "Bob", tags: ["x", "y"], person: true, none: true}]
      - note: A pattern of nodes bound before it makes only its relationship.
        cypher: "MATCH (a:CyWrite {name: 'Ada'}), (b:CyWrite {name: 'Bob'}) CREATE (b)-[:KNOWS]->(a)"
      - cypher: "MATCH (n:CyWrite)-[:KNOWS]->(:CyWrite) RETURN n.name ORDER BY n.name"
        rows: ["Ada", "Bob"]
      - cypher: "MATCH (n:CyWrite) RETURN count(n)"
        rows: [2]

  - name: "CREATE from a map"
    description: "CREATE from a map leaves out its nulls; a write with no RETURN gives no rows."
    steps:
      - cypher: "CREATE (n:CyWrite $props)"
        parameters: {props: {name: "Ada", age: 36, gone: null}}
        rows: []
      - cypher: "MATCH (n:CyWrite) RETURN properties(n)"
        rows: [{name: "Ada", age: 36}]

  - name: "coalesce() of one argument in a write"
    description: "coalesce() of one argument sets and returns that argument, null where it is null."
    steps:
      - cypher: "CREATE (n:CyWrite {a: 1, t: 'x'}) SET n.b = coalesce(n.a), n.c = coalesce(n.missing), n.u = toUpper(coalesce(n.t)) RETURN [coalesce(n.b), n.c IS NULL, n.u]"
        rows: [[1, true, "X"]]
      - cypher: "MATCH (n:CyWrite) RETURN properties(n)"
        rows: [{a: 1, t: "x", b: 1, u: "X"}]

  - name: "A null in a written row and a missing key are one null"
    description: "A write's rows, read after it, group a map's null and a missing key as one null, and keep it once by DISTINCT."
    steps:
      - cypher: "UNWIND $rows AS r CREATE (:CyWrite {b: 9}) RETURN r.a AS a, count(*) AS c"
        only: [neo4j, sql]
        parameters: {rows: [{a: null}, {b: 1}]}
        rows: [[null, 2]]
      - cypher: "UNWIND [{a: null}, {b: 1}] AS r CREATE (:CyWrite {b: 9}) WITH r RETURN DISTINCT r.a AS a"
        only: [neo4j, sql]
        rows: [null]
      - cypher: "MATCH (n:CyWrite) RETURN n.b AS b, count(*) AS c"
        only: [neo4j, sql]
        rows: [[9, 4]]

  - name: "MERGE"
    description: "MERGE finds what exists, or what an earlier row made, and makes it once."
    steps:
      - cypher: |
          UNWIND ['x', 'y', 'x'] AS k
          MERGE (n:CyWrite {key: k})
          ON CREATE SET n.made = true
          ON MATCH SET n.seen = coalesce(n.seen, 0) + 1
          RETURN n.key
        rows: ["x", "y", "x"]
      - cypher: "MATCH (n:CyWrite) RETURN properties(n) ORDER BY n.key"
        rows: [{key: "x", made: true, seen: 1}, {key: "y", made: true}]
      - note: A relationship merged between two nodes is made once.
        cypher: "MATCH (x:CyWrite {key: 'x'}), (y:CyWrite {key: 'y'}) MERGE (x)-[r:NEXT]->(y) ON CREATE SET r.made = true"
      - cypher: "MATCH (x:CyWrite {key: 'x'}), (y:CyWrite {key: 'y'}) MERGE (x)-[r:NEXT]->(y) ON CREATE SET r.made = true"
      - cypher: "MATCH (:CyWrite {key: 'x'})-[r:NEXT]->(:CyWrite {key: 'y'}) RETURN r.made"
        rows: [true]
      - note: One merged either way is found either way, and made from the pattern's earlier node.
        cypher: "MATCH (x:CyWrite {key: 'x'}), (y:CyWrite {key: 'y'}) MERGE (y)-[:NEXT]-(x)"
      - cypher: "MATCH (:CyWrite)-[r:NEXT]->(:CyWrite) RETURN count(r)"
        rows: [1]
      - cypher: "MATCH (x:CyWrite {key: 'x'}), (y:CyWrite {key: 'y'}) MERGE (y)-[:BACK]-(x)"
      - cypher: "MATCH (a:CyWrite)-[:BACK]->(:CyWrite) RETURN a.key"
        rows: ["y"]

  - name: "MERGE then SET +="
    description: "MERGE on a parameter's key then SET += the parameter, as Drivine's repositories write."
    steps:
      - cypher: "MERGE (t:CyWrite {id: $task.id}) SET t += $task RETURN properties(t)"
        parameters: {task: {id: "t1", title: "Write", tags: ["a"], done: false}}
        rows: [{id: "t1", title: "Write", tags: ["a"], done: false}]
      - cypher: "MERGE (t:CyWrite {id: $task.id}) SET t += $task RETURN properties(t)"
        parameters: {task: {id: "t1", title: "Written", done: true}}
        rows: [{id: "t1", title: "Written", tags: ["a"], done: true}]
      # Read on its own, the node the MERGE updated in place: Oracle keeps it as OSON version 2, which a thin driver reads
      # only where the host asks for oracleReencodeJson (#165).
      - cypher: "MATCH (t:CyWrite) RETURN properties(t)"
        rows: [{id: "t1", title: "Written", tags: ["a"], done: true}]
      - cypher: "MATCH (t:CyWrite) RETURN count(t)"
        rows: [1]

  - name: "Typical app round trip"
    description: "Rows from a parameter are merged, related, read back as a view, and detach deleted, as apps do."
    steps:
      - cypher: "UNWIND $rows AS row MERGE (n:CyWrite {id: row.id}) SET n += row.props RETURN n.id ORDER BY n.id"
        parameters:
          rows:
            - {id: "a", props: {id: "a", name: "O'Brien \"q\" ünï 😀", score: 1.5, tags: ["x", "y"], ok: true}}
            - {id: "b", props: {id: "b", name: "Bea", score: 2, tags: [], ok: false}}
        rows: ["a", "b"]
      - cypher: "MATCH (n:CyWrite {id: $id}) RETURN properties(n)"
        parameters: {id: "a"}
        rows: [{id: "a", name: "O'Brien \"q\" ünï 😀", score: 1.5, tags: ["x", "y"], ok: true}]
      - cypher: "CREATE (p:CyWrite) SET p = $props RETURN properties(p)"
        parameters: {props: {id: "c", name: "C", gone: null}}
        rows: [{id: "c", name: "C"}]
      - cypher: "MATCH (a:CyWrite {id: $a}), (b:CyWrite {id: $b}) MERGE (a)-[r:CyKNOWS]->(b) ON CREATE SET r.since = $s RETURN count(r)"
        parameters: {a: "a", b: "b", s: 2020}
        rows: [1]
      - cypher: "MATCH (a:CyWrite {id: $a}), (b:CyWrite {id: $b}) MERGE (a)-[r:CyKNOWS]->(b) ON MATCH SET r.again = true"
        parameters: {a: "a", b: "b"}
      - cypher: |
          MATCH (person:CyWrite {id: $id})
          WITH person, [(person)-[r:CyKNOWS]->(f:CyWrite) | f {.id, .name, since: r.since, again: r.again}] AS friends
          RETURN { person: properties(person), friends: friends, labels: labels(person) }
        parameters: {id: "a"}
        rows:
          - person: {id: "a", name: "O'Brien \"q\" ünï 😀", score: 1.5, tags: ["x", "y"], ok: true}
            friends: [{id: "b", name: "Bea", since: 2020, again: true}]
            labels: ["CyWrite"]
      - cypher: "MATCH (n:CyWrite) WHERE 'x' IN n.tags AND toLower(n.name) CONTAINS toLower($q) RETURN n.id"
        parameters: {q: "o'b"}
        rows: ["a"]
      - cypher: "OPTIONAL MATCH (n:CyWrite {id: 'zz'}) RETURN n"
        rows: [null]
      - cypher: "MATCH (n:CyWrite) RETURN {total: count(n), best: max(n.score)}"
        rows: [{total: 3, best: 2}]
      - cypher: "MATCH (n:CyWrite) RETURN n.id ORDER BY n.id SKIP $s LIMIT $l"
        parameters: {s: 1, l: 1}
        rows: ["b"]
      - cypher: "MATCH (n:CyWrite {id: 'b'}) RETURN {n: coalesce(n.missing, n.name), c: CASE WHEN size(n.tags) = 0 THEN 'none' ELSE 'some' END}"
        rows: [{n: "Bea", c: "none"}]
      - cypher: "MATCH (n:CyWrite) WHERE EXISTS { (n)-[:CyKNOWS]->(:CyWrite) } RETURN n.id"
        rows: ["a"]
      - cypher: "MATCH (n:CyWrite) WITH n ORDER BY n.id LIMIT 2 RETURN collect(n.name)"
        rows: [["O'Brien \"q\" ünï 😀", "Bea"]]
      - cypher: "UNWIND $rels AS rel MATCH (a:CyWrite {id: rel.from}), (b:CyWrite {id: rel.to}) MERGE (a)-[:CyLIKES {w: rel.w}]->(b)"
        parameters: {rels: [{from: "b", to: "c", w: 1}, {from: "c", to: "a", w: 2}]}
      - cypher: "MATCH (a)-[r:CyLIKES]->(b) RETURN [a.id, b.id, r.w] ORDER BY r.w"
        rows: [["b", "c", 1], ["c", "a", 2]]
      - cypher: "MATCH (n:CyWrite) WHERE n.id IN $ids DETACH DELETE n"
        parameters: {ids: ["a", "b"]}
      - cypher: "MATCH (n:CyWrite) RETURN n.id"
        rows: ["c"]
      - cypher: "MATCH ()-[r:CyKNOWS]->() RETURN count(r)"
        rows: [0]
      - note: "A whole number beyond 2^53 is kept whole: a library whose language reads JSON's numbers as doubles skips the last three steps."
        cypher: "CREATE (n:CyWrite) SET n = $p RETURN properties(n)"
        parameters: {p: {id: "big", n: 9007199254740993, f: 0.1, neg: -42, s: "1e3", long: {$repeat: "x", times: 3000}, e: ""}}
        rows: [{id: "big", n: 9007199254740993, f: 0.1, neg: -42, s: "1e3", long: {$repeat: "x", times: 3000}, e: ""}]
      - cypher: "MATCH (n:CyWrite {id: 'big'}) RETURN n.n + 1"
        rows: [9007199254740994]
      - cypher: "MATCH (n:CyWrite) WHERE n.n = $n RETURN n.id"
        parameters: {n: 9007199254740993}
        rows: ["big"]

  - name: "Text that holds a dollar quote"
    description: "A write whose text holds $cy$, or another dollar-quote tag, writes it as text."
    steps:
      - cypher: "CREATE (n:CyWrite {name: 'a$cy$b', other: '$cy1$ $$ $cy_$'}) RETURN [n.name, n.other]"
        rows: [["a$cy$b", "$cy1$ $$ $cy_$"]]
      - cypher: "MATCH (n:CyWrite) RETURN [n.name, n.other]"
        rows: [["a$cy$b", "$cy1$ $$ $cy_$"]]

  - name: "SET and REMOVE on nodes"
    description: "SET writes properties, maps (null removes a key) and labels; REMOVE takes them away."
    steps:
      - cypher: "CREATE (:CyWrite {id: 1, a: 'a', b: 'b'})"
      - cypher: "MATCH (n:CyWrite {id: 1}) SET n.a = toUpper(n.a), n.c = 3, n.b = null RETURN properties(n)"
        rows: [{id: 1, a: "A", c: 3}]
      - cypher: "MATCH (n:CyWrite {id: 1}) SET n += $more RETURN properties(n)"
        parameters: {more: {c: null, d: "d"}}
        rows: [{id: 1, a: "A", d: "d"}]
      - cypher: "MATCH (n:CyWrite {id: 1}) SET n = $whole RETURN properties(n)"
        parameters: {whole: {id: 2, gone: null}}
        rows: [{id: 2}]
      - cypher: "MATCH (n:CyWrite {id: 2}) SET n:Done:Seen RETURN n:Done, n:Seen"
        rows: [[true, true]]
      - cypher: "MATCH (n:CyWrite {id: 2}) SET n:Done RETURN n:Done"
        rows: [true]
      - cypher: "MATCH (n:CyWrite {id: 2}) REMOVE n:Done, n.id SET n.x = 1 REMOVE n.x RETURN n:Done, n:Seen, n.id"
        rows: [[false, true, null]]

  - name: "SET and REMOVE on relationships"
    description: "SET and REMOVE work on relationship properties, and a node can be set from them."
    steps:
      - cypher: "CREATE (:CyWrite {name: 'a'})-[:R {x: 1, y: 2}]->(:CyWrite {name: 'b'})"
      - cypher: "MATCH (:CyWrite)-[r:R]->() SET r += {y: null, z: 3} RETURN properties(r)"
        rows: [{x: 1, z: 3}]
      - cypher: "MATCH (:CyWrite)-[r:R]->() SET r = {w: 4, gone: null} RETURN properties(r)"
        rows: [{w: 4}]
      - cypher: "MATCH (:CyWrite)-[r:R]->() REMOVE r.w SET r.v = 5 RETURN properties(r)"
        rows: [{v: 5}]
      - cypher: "MATCH (a:CyWrite {name: 'a'})-[r:R]->() SET a = properties(r) RETURN properties(a)"
        rows: [{v: 5}]

  - name: "Paged write, DELETE of null"
    description: "A write's RETURN pages by parameters; DELETE of a null from an optional match does nothing."
    steps:
      - cypher: "UNWIND [3, 1, 2] AS i CREATE (n:CyWrite {i: i}) RETURN n.i ORDER BY n.i SKIP $from LIMIT $most"
        parameters: {from: 1, most: 1}
        rows: [2]
      - cypher: "MATCH (n:CyWrite {i: 1}) OPTIONAL MATCH (n)-[r:NONE]->() DELETE r RETURN n.i"
        rows: [1]
      - cypher: "MATCH (n:CyWrite) RETURN count(n)"
        rows: [3]

  - name: "DELETE and DETACH DELETE"
    description: "DELETE takes relationships and unconnected nodes; DETACH DELETE takes a node with its relationships."
    steps:
      - cypher: "CREATE (:CyWrite {name: 'a'})-[:R]->(:CyWrite {name: 'b'})-[:R]->(:CyWrite {name: 'c'})"
      - note: A node with relationships is not deleted, and the statement leaves nothing it did behind.
        cypher: "CREATE (:CyWrite {name: 'temp'}) WITH 1 AS one MATCH (n:CyWrite {name: 'b'}) DELETE n"
        error: true
      - cypher: "MATCH (n:CyWrite) RETURN n.name ORDER BY n.name"
        rows: ["a", "b", "c"]
      - note: The relationships a clause deletes are gone before its nodes are.
        cypher: "MATCH (a:CyWrite {name: 'a'})-[r:R]->(b) DELETE r, a"
      - cypher: "MATCH (n:CyWrite) RETURN n.name ORDER BY n.name"
        rows: ["b", "c"]
      - cypher: "MATCH (n:CyWrite {name: 'b'}) DETACH DELETE n"
      - cypher: "MATCH (n:CyWrite) RETURN n.name"
        rows: ["c"]
      - cypher: "MATCH (:CyWrite)-[r]-() RETURN r"
        rows: []

  - name: "A write whose returned rows fail as they are read"
    description: "A statement that writes and returns a row that fails as the statement runs keeps nothing it wrote or deleted. On Oracle a compiled write's block returned its rows by a cursor whose query ran only as the host read it, after the block's writes were done, and so kept them (liberation-data/drivine-cypher-spec#292)."
    steps:
      - cypher: "CREATE (:CyWrite {num: 1})"
      - note: "keys() of a number read from data fails as the statement runs."
        cypher: "MATCH (n:CyWrite) SET n.x = 1 RETURN keys(n.num)"
        error: true
      - cypher: "MATCH (n:CyWrite) RETURN n.x"
        rows: [null]
      - cypher: "MATCH (n:CyWrite) WITH n, n.num AS num DETACH DELETE n RETURN keys(num)"
        error: true
      - cypher: "MATCH (n:CyWrite) RETURN count(n)"
        rows: [1]
      - note: "A sort key that fails fails the statement as well, though it isn't returned: on Oracle the block reads the rows in their order."
        only: [neo4j, sql]
        cypher: "MATCH (n:CyWrite) SET n.x = 1 RETURN n.num ORDER BY left('a', -n.num)"
        error: true
      - only: [neo4j, sql]
        cypher: "MATCH (n:CyWrite) RETURN n.x"
        rows: [null]
      - note: "Rows that don't fail are still returned in their order, a null one as null."
        cypher: "UNWIND [2, 3] AS i CREATE (n:CyWrite {num: i}) RETURN n.none, n.num ORDER BY n.num DESC"
        rows: [[null, 3], [null, 2]]
      - cypher: "MATCH (n:CyWrite) SET n.x = n.num RETURN n.none ORDER BY n.num"
        rows: [null, null, null]

  - name: "A write that returns a value made anew each time it is read"
    description: "On Oracle a write's returned rows, a row each, are worked out once in its block, to check them, and then again as the host reads them (liberation-data/drivine-cypher-spec#292). What the statement wrote is written once, and what it returns of it is what it wrote; a value made anew, as randomUUID(), is made anew."
    steps:
      - only: [neo4j, sql]
        cypher: "UNWIND range(1, 3) AS i CREATE (n:CyWrite {i: i, u: randomUUID()}) RETURN [size(n.u), size(randomUUID())]"
        rows: [[36, 36], [36, 36], [36, 36]]
      - only: [neo4j, sql]
        cypher: "MATCH (n:CyWrite) RETURN count(n), count(DISTINCT n.u)"
        rows: [[3, 3]]
      - only: [neo4j, sql]
        cypher: "MATCH (n:CyWrite {i: 1}) SET n.v = randomUUID() RETURN n.v = n.v, size(n.v)"
        rows: [[true, 36]]

  - name: "A write after a DELETE"
    description: "What a statement makes after it deletes is made anew, with no id of what it deleted, and a read after the DELETE finds none of it."
    steps:
      - cypher: "CREATE (:CyWrite {num: 1}), (:CyWrite {num: 2})"
      - note: A MERGE after a DELETE finds nothing it deleted, and makes its node with an id of its own (drivine4j#713).
        cypher: "MATCH (a:CyWrite) WITH a, elementId(a) AS old DELETE a MERGE (a2:CyWrite) RETURN a2.num, old = elementId(a2)"
        only: [neo4j, sql]
        rows: [[null, false], [null, false]]
      - cypher: "MATCH (a:CyWrite) RETURN count(a)"
        rows: [1]
      - note: So too in a later part of the statement.
        cypher: "MATCH (a:CyWrite) WITH a, elementId(a) AS old DELETE a WITH collect(old) AS olds MERGE (b:CyWrite {num: 4}) RETURN b.num, elementId(b) IN olds"
        only: [neo4j, sql]
        rows: [[4, false]]
      - note: And inside a FOREACH.
        cypher: "MATCH (a:CyWrite) WITH a, elementId(a) AS old DELETE a FOREACH (x IN [1] | MERGE (:CyWrite {num: 5})) WITH old MATCH (b:CyWrite) RETURN b.num, old = elementId(b)"
        only: [neo4j, sql]
        rows: [[5, false]]
      - note: A match after the DELETE finds none of what it deleted.
        cypher: "MATCH (a:CyWrite) DELETE a WITH count(*) AS c OPTIONAL MATCH (b:CyWrite) RETURN c, count(b)"
        rows: [[1, 0]]

  - name: "A relationship written after a DELETE"
    description: "A relationship a statement makes after it deletes one, or a node with its relationships, takes no id of what it deleted."
    steps:
      - cypher: "CREATE (a:CyWrite {k: 'a'}), (b:CyWrite {k: 'b'}) CREATE (a)-[:T {name: 'rel1'}]->(b), (a)-[:T {name: 'rel2'}]->(b)"
      - note: A MERGE after a DELETE of relationships finds neither, and makes one (drivine4j#713).
        cypher: "MATCH (a:CyWrite)-[t:T]->(b:CyWrite) WITH a, b, t, elementId(t) AS old DELETE t MERGE (a)-[t2:T {name: 'rel3'}]->(b) RETURN t2.name, old = elementId(t2)"
        only: [neo4j, sql]
        rows: [["rel3", false], ["rel3", false]]
      - cypher: "MATCH (:CyWrite)-[t:T]->(:CyWrite) RETURN t.name"
        rows: ["rel3"]
      - note: A node and a relationship made after a DETACH DELETE take neither the node's id nor its relationship's.
        cypher: "MATCH (a:CyWrite)-[t:T]->(b:CyWrite {k: 'b'}) WITH a, b, elementId(b) AS nb, elementId(t) AS nt DETACH DELETE b CREATE (a)-[s:T]->(c:CyWrite {k: 'c'}) RETURN nb = elementId(c), nt = elementId(s)"
        only: [neo4j, sql]
        rows: [[false, false]]
      - cypher: "MATCH (:CyWrite {k: 'a'})-[:T]->(c:CyWrite) RETURN c.k"
        rows: ["c"]

  - name: "A node read after the statement deletes it"
    description: "A property or the labels of a node the statement deleted earlier fail, as Neo4j fails them, where the node is there to delete; the node itself is still bound, with no keys and no properties (liberation-data/drivine4j#420). Over no rows nothing fails."
    steps:
      - cypher: "MATCH (n:CyWrite) DELETE n RETURN n.num"
        rows: []
      - cypher: "MATCH (n:CyWrite) DELETE n RETURN labels(n)"
        rows: []
      - cypher: "CREATE (:CyWrite {num: 1})"
      - note: "A SQL store gave null (drivine4j#420). Neo4j 2026.10.1: Node with id N has been deleted in this transaction."
        only: [neo4j, sql]
        cypher: "MATCH (n:CyWrite) DELETE n RETURN n.num"
        error: true
      - note: "The statement failed, so the node is still there; Oracle kept it deleted until liberation-data/drivine-cypher-spec#292."
        only: [neo4j, sql]
        cypher: "MATCH (n:CyWrite) RETURN count(n)"
        rows: [1]
      - cypher: "MATCH (n:CyWrite) DETACH DELETE n"
      - cypher: "CREATE (:CyWrite {num: 1})"
      - only: [neo4j, sql]
        cypher: "MATCH (n:CyWrite) DELETE n WITH n RETURN n.num"
        error: true
      - cypher: "MATCH (n:CyWrite) DETACH DELETE n"
      - cypher: "CREATE (:CyWrite {num: 1})"
      - only: [neo4j, sql]
        cypher: "MATCH (n:CyWrite) DELETE n RETURN labels(n)"
        error: true
      - cypher: "MATCH (n:CyWrite) DETACH DELETE n"
      - cypher: "CREATE (:CyWrite {num: 1})"
      - note: "A SQL store gave null for each of these (drivine4j#420)."
        only: [neo4j, sql]
        cypher: "MATCH (n:CyWrite) DELETE n RETURN keys(n)"
        rows: [[]]
      - cypher: "CREATE (:CyWrite {num: 1})"
      - only: [neo4j, sql]
        cypher: "MATCH (n:CyWrite) DELETE n RETURN properties(n)"
        rows: [{}]
      - cypher: "CREATE (:CyWrite {num: 1})"
      - only: [neo4j, sql]
        cypher: "MATCH (n:CyWrite) DELETE n RETURN n"
        rows: [{}]
      - cypher: "MATCH (n:CyWrite) RETURN count(n)"
        rows: [0]

  - name: "A relationship read after the statement deletes it"
    description: "type() of a relationship the statement deleted earlier, or whose node it deleted with DETACH DELETE, is still its type, and a property of it fails, as in Neo4j (liberation-data/drivine4j#420, liberation-data/drivine4j#427). Over no rows nothing fails."
    steps:
      - cypher: "MATCH (:CyWrite)-[r]->() DELETE r RETURN type(r)"
        rows: []
      - cypher: "MATCH (:CyWrite)-[r]->() DELETE r RETURN r.num"
        rows: []
      - cypher: "CREATE (:CyWrite)-[:T {num: 1}]->(:CyWrite)"
      - note: "A SQL store gave null (drivine4j#420). Neo4j 2026.10.1: Relationship with id N has been deleted in this transaction."
        only: [neo4j, sql]
        cypher: "MATCH (:CyWrite)-[r]->() DELETE r RETURN r.num"
        error: true
      - note: "The statement failed, so the relationship is still there; Oracle kept it deleted until liberation-data/drivine-cypher-spec#292."
        only: [neo4j, sql]
        cypher: "MATCH (:CyWrite)-[r]->() RETURN count(r)"
        rows: [1]
      - cypher: "MATCH (n:CyWrite) DETACH DELETE n"
      - cypher: "CREATE (:CyWrite)-[:T {num: 1}]->(:CyWrite)"
      - only: [neo4j, sql]
        cypher: "MATCH (a:CyWrite)-[r]->() DETACH DELETE a RETURN r.num"
        error: true
      - cypher: "MATCH (n:CyWrite) DETACH DELETE n"
      - cypher: "CREATE (:CyWrite)-[:T {num: 1}]->(:CyWrite)"
      - note: "A SQL store gave null: its rows held the relationship's id alone, and its row was gone (drivine4j#427)."
        only: [neo4j, sql]
        cypher: "MATCH (a:CyWrite)-[r]->() DETACH DELETE a RETURN type(r)"
        rows: ["T"]
      - cypher: "CREATE (:CyWrite)-[:T {num: 1}]->(:CyWrite)"
      - only: [neo4j, sql]
        cypher: "MATCH (:CyWrite)-[r]->() DELETE r RETURN type(r)"
        rows: ["T"]
      - cypher: "CREATE (:CyWrite)-[:T {num: 1}]->(:CyWrite)"
      - note: "A SQL store gave null here too: the type is held by the relationship, whatever name a WITH gives it."
        only: [neo4j, sql]
        cypher: "MATCH (:CyWrite)-[r]->() DELETE r WITH r AS x RETURN type(x)"
        rows: ["T"]
      - cypher: "CREATE (:CyWrite {num: 2})-[:T {num: 1}]->(:CyWrite)"
      - note: "A node the statement didn't delete still reads, and so does a relationship OPTIONAL MATCH found none of."
        only: [neo4j, sql]
        cypher: "MATCH (a:CyWrite {num: 2})-[r]->() OPTIONAL MATCH (a)-[s:NONE]->() DELETE r, s RETURN [a.num, s.num, type(s)]"
        rows: [[2, null, null]]
      - cypher: "MATCH (:CyWrite)-[r]->() RETURN count(r)"
        rows: [0]

  - name: "An id is not used again by a later statement"
    description: "On the SQL stores, a node or relationship made after another was deleted, in a later statement, never takes the deleted one's id."
    steps:
      - note: The node that keeps the ids is made first, so the deleted node is the last one made, the one whose id a store that hands out the next id after the greatest would give again.
        cypher: "CREATE (:CyWrite:CyKeep) CREATE (a:CyWrite {k: 'a'})-[:T]->(b:CyWrite {k: 'b'})"
      - note: The deleted node's and relationship's ids are kept on the node that stays (drivine4j#713).
        cypher: "MATCH (k:CyKeep), (a:CyWrite {k: 'a'})-[t:T]->(b:CyWrite {k: 'b'}) SET k.node = elementId(b), k.rel = elementId(t) DETACH DELETE b"
      - cypher: "MATCH (a:CyWrite {k: 'a'}) CREATE (a)-[:T]->(:CyWrite {k: 'c'})"
      - note: "Neo4j doesn't promise this across statements: its ids may be used again once a delete is committed. Drivine's SQL stores never hand an id out twice."
        only: [sql]
        cypher: "MATCH (k:CyKeep), (:CyWrite {k: 'a'})-[t:T]->(c:CyWrite {k: 'c'}) RETURN k.node = elementId(c), k.rel = elementId(t)"
        rows: [[false, false]]

  - name: "Read after write"
    description: "A read later in the statement sees what the write made."
    steps:
      - cypher: "CREATE (:CyWrite {name: 'Ada'})"
      - cypher: |
          MATCH (a:CyWrite {name: 'Ada'})
          CREATE (a)-[:WROTE]->(:CyWrite:Paper {title: $title})
          WITH a
          MATCH (a)-[:WROTE]->(p:Paper)
          RETURN p.title, count(*)
        parameters: {title: "Notes"}
        rows: [["Notes", 1]]

  - name: "Reading clauses straight after a write"
    description: "A reading clause straight after a writing clause, with no WITH between them, reads the rows the write leaves."
    steps:
      - cypher: "CREATE (n:CyWrite {name: 'A'}) UNWIND [1, 2, 3] AS x RETURN count(x)"
        rows: [3]
      - cypher: "MATCH (n:CyWrite) SET n.seen = true UNWIND [n.name, 'B'] AS x RETURN x ORDER BY x"
        rows: ["A", "B"]
      - cypher: "MERGE (n:CyWrite {name: 'A'}) UNWIND [1, 2] AS x CREATE (:CyWrite {name: n.name + toString(x)})"
      - cypher: "CREATE (n:CyWrite {name: 'C'}) WITH n MATCH (m:CyWrite) RETURN count(m)"
        rows: [4]
      - cypher: "CREATE (n:CyWrite {name: 'D'}) MATCH (m:CyWrite) RETURN count(m)"
        rows: [5]
      - cypher: "MATCH (n:CyWrite {name: 'D'}) DELETE n UNWIND [1] AS x MATCH (m:CyWrite) RETURN count(m)"
        rows: [4]

  - name: "Row order through writes"
    description: "Rows keep their order through writes; a WITH between writes orders, filters and counts them."
    steps:
      - cypher: "UNWIND ['c', 'a', 'b'] AS k CREATE (n:CyWrite {k: k}) SET n.seen = true RETURN n.k"
        rows: ["c", "a", "b"]
      - cypher: "MATCH (n:CyWrite) WITH n ORDER BY n.k DESC WHERE n.k <> 'a' SET n.last = true RETURN n.k"
        rows: ["c", "b"]
      - cypher: "MATCH (n:CyWrite) SET n.x = 1 WITH count(n) AS c CREATE (m:CyWrite {c: c}) WITH m MATCH (l:CyWrite {last: true}) WITH m.c AS c, count(l) AS l RETURN [c, l]"
        rows: [[3, 2]]
      - note: A match that finds nothing leaves no row to write for.
        cypher: "MATCH (n:CyWrite {k: 'none'}) CREATE (n)-[:R]->(:CyWrite) RETURN n"
        rows: []
      - cypher: "MATCH (n:CyWrite) RETURN count(n)"
        rows: [4]

  - name: "Writes around grouping"
    description: "Writes before or after a RETURN that groups by a parameter or subquery key."
    steps:
      - cypher: "UNWIND ['a', 'b', 'a'] AS k CREATE (n:CyWrite {k: k}) WITH n RETURN n.k + $x AS k, count(*) AS c ORDER BY k"
        parameters: {x: "!"}
        rows: [["a!", 2], ["b!", 1]]
      - cypher: "MATCH (a:CyWrite {k: 'b'}) CREATE (a)-[:R]->(:CyWrite {k: 'c'})"
      - cypher: |
          MATCH (n:CyWrite)
          WITH [(n)-[:R]->(m) | m.k] AS ks, count(*) AS c
          CREATE (t:CyWrite:Tally {c: c})
          RETURN ks, t.c ORDER BY t.c DESC
        rows: [[[], 3], [["c"], 1]]

  - name: "MERGE of a whole pattern"
    description: "MERGE of a whole pattern makes all of it once; a pattern found twice gives a row for each."
    steps:
      - cypher: "MERGE (a:CyWrite {k: 'a'})-[:R]->(b:CyWrite {k: 'b'}) ON CREATE SET a.made = 1 ON MATCH SET a.made = a.made + 1"
      - cypher: "MERGE (a:CyWrite {k: 'a'})-[:R]->(b:CyWrite {k: 'b'}) ON CREATE SET a.made = 1 ON MATCH SET a.made = a.made + 1"
      - cypher: "MATCH (a:CyWrite {k: 'a'})-[r:R]->(:CyWrite {k: 'b'}) WITH a.made AS made, count(r) AS r RETURN [made, r]"
        rows: [[2, 1]]
      - cypher: "MATCH (a:CyWrite {k: 'a'}) CREATE (a)-[:R]->(:CyWrite {k: 'b'})"
      - cypher: "MERGE (a:CyWrite {k: 'a'})-[r:R]->(b:CyWrite {k: 'b'}) ON MATCH SET a.made = a.made + 1, b.hit = true WITH a.made AS made, count(b) AS found RETURN [made, found]"
        rows: [[4, 2]]
      - cypher: "MATCH (b:CyWrite {hit: true}) RETURN count(b)"
        rows: [2]

  - name: "Drivine's stamp property"
    description: "Drivine's stamp property is written and read like any other property, via maps too."
    steps:
      - cypher: "CREATE (:CyWrite $props)"
        parameters: {props: {id: 1, "__drivine.stamp": "a:b"}}
      - cypher: "MATCH (n:CyWrite {id: 1}) RETURN n.`__drivine.stamp`"
        rows: ["a:b"]
      - cypher: "MATCH (n:CyWrite {id: 1}) SET n += $more"
        parameters: {more: {x: 1}}
      - cypher: "MATCH (n:CyWrite {id: 1}) RETURN n.`__drivine.stamp`"
        rows: ["a:b"]
      - cypher: "MATCH (n:CyWrite {id: 1}) SET n += $more"
        parameters: {more: {"__drivine.stamp": "c:d"}}
      - cypher: "MATCH (n:CyWrite {id: 1}) RETURN properties(n)"
        rows: [{id: 1, x: 1, "__drivine.stamp": "c:d"}]
      - cypher: "MATCH (n:CyWrite {id: 1}) SET n = {id: 1}"
      - cypher: "MATCH (n:CyWrite {id: 1}) RETURN properties(n)"
        rows: [{id: 1}]
      - cypher: "MATCH (n:CyWrite {id: 1}) RETURN n.`__drivine.stamp`"
        rows: [null]

  - name: "A key worked out at run time in a write"
    description: "A node or a relationship a write makes, matches or merges is read by a key an expression gives, the stamp's too, and a text past 32 KB read so is read whole, over two rows (drivine4j#417)."
    steps:
      - note: "Graph7 [2] and [3]."
        cypher: "CREATE (n:CyWrite {name: 'Apa'}) RETURN n['nam' + 'e']"
        rows: ["Apa"]
      - cypher: "CREATE (n:CyWrite {name: 'Bea'}) RETURN n[$idx]"
        parameters: {idx: "name"}
        rows: ["Bea"]
      - cypher: "MATCH (n:CyWrite) WITH n, 'name' AS k SET n.copy = n[k] + '!' RETURN n.copy ORDER BY n.copy"
        rows: ["Apa!", "Bea!"]
      - cypher: "MERGE (n:CyWrite {name: 'Apa'}) WITH n, 'copy' AS k RETURN n[k]"
        rows: ["Apa!"]
      - note: "Merge6 [3]."
        cypher: "MATCH (a:CyWrite {name: 'Apa'}), (b:CyWrite {name: 'Bea'}) MERGE (a)-[r:TYPE]->(b) ON CREATE SET r.name = 'foo'"
      - cypher: "MATCH (:CyWrite)-[r:TYPE]->(:CyWrite) RETURN [key IN keys(r) | key + '->' + r[key]]"
        rows: [["name->foo"]]
      - cypher: "MATCH (:CyWrite)-[r:TYPE]->(:CyWrite) DELETE r"
      - note: "Merge6 [6], from the node's properties, as Cypher 25 has it."
        cypher: "MATCH (a:CyWrite {name: 'Apa'}), (b:CyWrite {name: 'Bea'}) MERGE (a)-[r:TYPE]->(b) ON CREATE SET r = properties(a)"
      - cypher: "MATCH (:CyWrite)-[r:TYPE]->(:CyWrite) RETURN [key IN keys(r) | key + '->' + r[key]]"
        unorderedLists: true
        rows: [["copy->Apa!", "name->Apa"]]
      - cypher: "MATCH (:CyWrite)-[r:TYPE]->(:CyWrite) DELETE r"
      - note: "Merge6 [7]."
        cypher: "MATCH (a:CyWrite {name: 'Apa'}), (b:CyWrite {name: 'Bea'}) MERGE (a)-[r:TYPE]->(b) ON CREATE SET r += {name: 'bar', name2: 'baz'}"
      - cypher: "MATCH (:CyWrite)-[r:TYPE]->(:CyWrite) RETURN [key IN keys(r) | key + '->' + r[key]]"
        unorderedLists: true
        rows: [["name->bar", "name2->baz"]]
      - cypher: "MATCH (a:CyWrite {name: 'Apa'}) MERGE (a)-[:TYPE2 {k: a['na' + 'me']}]->(c:CyWrite {made: true}) RETURN c.made"
        rows: [true]
      - cypher: "MATCH (:CyWrite)-[r:TYPE2]->(:CyWrite) RETURN r.k"
        rows: ["Apa"]
      - cypher: "UNWIND $rows AS row MERGE (n:CyWrite {id: row['i' + 'd']}) SET n.v = row[$k] RETURN [n.id, n.v] ORDER BY n.id"
        parameters: {rows: [{id: 1, v: "a"}, {id: 2, v: "b"}], k: "v"}
        rows: [[1, "a"], [2, "b"]]
      - note: "The stamp is a property as any other, read by a key worked out too."
        cypher: "CREATE (n:CyWrite $props) WITH n, '__drivine.stamp' AS k RETURN [n[k], n.`__drivine.stamp`]"
        parameters: {props: {id: 3, "__drivine.stamp": "a:b"}}
        rows: [["a:b", "a:b"]]
      - cypher: "MATCH (n:CyWrite {id: 3}) WITH n, '__drivine.stamp' AS k RETURN [n[k], properties(n)[k]]"
        rows: [["a:b", "a:b"]]
      - cypher: "UNWIND [1, 2] AS i CREATE (:CyWrite {i: i, long: $big})"
        parameters: {big: {$repeat: "x", times: 40000}}
      - cypher: "MATCH (n:CyWrite) WHERE n.long IS NOT NULL WITH n, 'long' AS k RETURN [size(n[k]), n[k] = n.long, n[k] STARTS WITH 'xx'] ORDER BY n.i"
        rows: [[40000, true, true], [40000, true, true]]
      - cypher: "MATCH (n:CyWrite) WHERE n.long IS NOT NULL WITH n, 'long' AS k RETURN n[k] ORDER BY n.i"
        rows: [{$repeat: "x", times: 40000}, {$repeat: "x", times: 40000}]
      - cypher: "MATCH (n:CyWrite) WHERE n.long IS NOT NULL RETURN [k IN keys(n) | n[k]] ORDER BY n.i"
        unorderedLists: true
        rows: [[1, {$repeat: "x", times: 40000}], [2, {$repeat: "x", times: 40000}]]
      - cypher: "MATCH (n:CyWrite) WHERE n.long IS NOT NULL WITH properties(n) AS m, 'long' AS k RETURN size(m[k]) ORDER BY m.i"
        rows: [40000, 40000]
      - cypher: "MATCH (n:CyWrite) WHERE n.long IS NOT NULL WITH n, 'long' AS k SET n.copy = n[k] RETURN size(n.copy) ORDER BY n.i"
        rows: [40000, 40000]
      - cypher: "UNWIND $ms AS m WITH m, 'long' AS k RETURN size(m[k])"
        parameters: {ms: [{long: {$repeat: "x", times: 40000}}, {long: {$repeat: "y", times: 40000}}]}
        rows: [40000, 40000]
      - note: "A text read so beside NaN and an infinity: the node's other entries are written out with it."
        only: [neo4j, oracle]
        cypher: "CREATE (n:CyWrite {nan: $nan, inf: $inf, s: 'x', d: 2.0}) WITH n, 's' AS k RETURN [n[k], n['na' + 'n'], n['in' + 'f'], n['d' + '']]"
        parameters: {nan: {$float: "NaN"}, inf: {$float: "Infinity"}}
        rows: [["x", {$float: "NaN"}, {$float: "Infinity"}, 2.0]]
      - note: "In a FOREACH."
        cypher: "MATCH (n:CyWrite {name: 'Apa'}) FOREACH (k IN ['name'] | SET n.each = n[k]) RETURN n.each"
        rows: ["Apa"]

  - name: "SET from COUNT and EXISTS"
    description: "COUNT { } and EXISTS { } in a SET read the row being written."
    steps:
      - cypher: "CREATE (a:CyWrite {id: 'a'})-[:NEXT]->(b:CyWrite {id: 'b'})-[:NEXT]->(:CyWrite {id: 'c'}), (a)-[:NEXT]->(:CyWrite {id: 'd'})"
      - cypher: "MATCH (n:CyWrite) SET n.degree = COUNT { (n)--() }, n.leaf = NOT EXISTS { MATCH (n)-[:NEXT]->() } RETURN [n.id, n.degree, n.leaf] ORDER BY n.id"
        rows: [["a", 2, false], ["b", 2, false], ["c", 1, true], ["d", 1, true]]

  - name: "SET from a pattern as a condition"
    description: "A SET's value holds a pattern as a condition, as Neo4j 2026.10.1 takes it (liberation-data/drivine4j#714): as a value it is refused (see refusals.yaml, \"Pattern used as a value\")."
    steps:
      - cypher: "CREATE (a:CyWrite {id: 'a'})-[:NEXT]->(b:CyWrite {id: 'b'})-[:NEXT]->(:CyWrite {id: 'c'}), (a)-[:NEXT]->(:CyWrite {id: 'd'})"
      - cypher: "MATCH (n:CyWrite) SET n.f = NOT (n)-->() RETURN count(n)"
        rows: [4]
      - cypher: "MATCH (n:CyWrite) RETURN [n.id, n.f] ORDER BY n.id"
        rows: [["a", false], ["b", false], ["c", true], ["d", true]]

  - name: "Work a read out in a WITH before the write"
    description: "A read of the graph that a CREATE or a MERGE would make a property of, worked out in a WITH before it, as the refusal of one in its properties says (liberation-data/drivine4j#814): the WITH reads the graph over its rows before the write makes any, as Neo4j 2026.10.1 does, so the SQL stores give its rows. Each from the graph alone."
    steps:
      - cypher: "CREATE (a:CyWrite {id: 'a'})-[:NEXT]->(b:CyWrite {id: 'b'})-[:NEXT]->(:CyWrite {id: 'c'}), (a)-[:NEXT]->(:CyWrite {id: 'd'})"
      - cypher: "UNWIND [1, 2, 3] AS i WITH i, COUNT { (:CyMade) } AS c CREATE (m:CyMade {c: c}) RETURN m.c ORDER BY m.c"
        rows: [0, 0, 0]
      - cypher: "MATCH (x) DETACH DELETE x"
      - cypher: "CREATE (a:CyWrite {id: 'a'})-[:NEXT]->(b:CyWrite {id: 'b'})-[:NEXT]->(:CyWrite {id: 'c'}), (a)-[:NEXT]->(:CyWrite {id: 'd'})"
      - cypher: "MATCH (n:CyWrite) WITH n, COUNT { ()-[:CyR]->() } AS c CREATE (n)-[r:CyR {c: c}]->(:CyMade) RETURN [n.id, r.c] ORDER BY n.id"
        rows: [["a", 0], ["b", 0], ["c", 0], ["d", 0]]
      - cypher: "MATCH (x) DETACH DELETE x"
      - cypher: "CREATE (a:CyWrite {id: 'a'})-[:NEXT]->(b:CyWrite {id: 'b'})-[:NEXT]->(:CyWrite {id: 'c'}), (a)-[:NEXT]->(:CyWrite {id: 'd'})"
      - cypher: "MATCH (n:CyWrite) WITH n, NOT (n)-->() AS f MERGE (n)-[r:CyR {f: f}]->(m) RETURN [n.id, r.f] ORDER BY n.id"
        rows: [["a", false], ["b", false], ["c", true], ["d", true]]
      - cypher: "MATCH (x) DETACH DELETE x"
      - cypher: "CREATE (a:CyWrite {id: 'a'})-[:NEXT]->(b:CyWrite {id: 'b'})-[:NEXT]->(:CyWrite {id: 'c'}), (a)-[:NEXT]->(:CyWrite {id: 'd'})"
      - cypher: "MATCH (n:CyWrite {id: 'a'}) WITH n, EXISTS { (:CyNew) } AS f CREATE (a:CyNew {name: 'x'}), (m:CyMade {f: f}) RETURN m.f"
        rows: [false]
      - cypher: "MATCH (x) DETACH DELETE x"
      - cypher: "CREATE (a:CyWrite {id: 'a'})-[:NEXT]->(b:CyWrite {id: 'b'})-[:NEXT]->(:CyWrite {id: 'c'}), (a)-[:NEXT]->(:CyWrite {id: 'd'})"
      - cypher: "MATCH (n:CyWrite) FOREACH (i IN [1] | CREATE (m:CyMade {c: i})) WITH count(*) AS k UNWIND [1, 2] AS j WITH j, COUNT { (:CyMade) } AS c CREATE (:CyMade {c: c}) RETURN c ORDER BY c"
        rows: [4, 4]

  - name: "When a write reads a property its own rows set"
    description: "A plain read of a property in what a CREATE or a MERGE makes or sets, of a node the same statement changes, gives Neo4j 2026.10.1's rows (liberation-data/drivine4j#814): a CREATE reads every row's before the SET after it writes any, and a MERGE reads, a row at a time, what the rows before it set, in the properties it matches and in its ON CREATE and ON MATCH SET. Each from the graph alone."
    steps:
      - cypher: "CREATE (a:CyWrite {id: 'a'})-[:NEXT]->(b:CyWrite {id: 'b'})-[:NEXT]->(:CyWrite {id: 'c'}), (a)-[:NEXT]->(:CyWrite {id: 'd'})"
      - note: "A SET after a CREATE reads the graph after the CREATE has made every row's node."
        cypher: "UNWIND [1, 2] AS i CREATE (m:CyMade {i: i}) SET m.c = COUNT { (:CyMade) } RETURN [m.i, m.c] ORDER BY m.i"
        rows: [[1, 2], [2, 2]]
      - cypher: "MATCH (x) DETACH DELETE x"
      - cypher: "CREATE (a:CyWrite {id: 'a'})-[:NEXT]->(b:CyWrite {id: 'b'})-[:NEXT]->(:CyWrite {id: 'c'}), (a)-[:NEXT]->(:CyWrite {id: 'd'})"
      - note: "A CREATE reads a property before the SET after it changes it, on every row, and the SET reads what the row before it set."
        cypher: "MATCH (n:CyWrite {id: 'a'}) UNWIND [1, 2] AS i CREATE (m:CyMade {f: coalesce(n.c, 0)}) SET n.c = coalesce(n.c, 0) + 1 RETURN [i, m.f, n.c] ORDER BY i"
        rows: [[1, 0, 2], [2, 0, 2]]
      - cypher: "MATCH (x) DETACH DELETE x"
      - cypher: "CREATE (a:CyWrite {id: 'a'})-[:NEXT]->(b:CyWrite {id: 'b'})-[:NEXT]->(:CyWrite {id: 'c'}), (a)-[:NEXT]->(:CyWrite {id: 'd'})"
      - note: "A MERGE's node reads what the row before set in its ON CREATE SET."
        cypher: "MATCH (n:CyWrite {id: 'a'}) UNWIND [1, 2] AS i MERGE (m:CyMade {f: coalesce(n.c, 0)}) ON CREATE SET n.c = coalesce(n.c, 0) + 1 RETURN [i, m.f, n.c] ORDER BY i"
        rows: [[1, 0, 2], [2, 1, 2]]
      - cypher: "MATCH (x) DETACH DELETE x"
      - cypher: "CREATE (a:CyWrite {id: 'a'})-[:NEXT]->(b:CyWrite {id: 'b'})-[:NEXT]->(:CyWrite {id: 'c'}), (a)-[:NEXT]->(:CyWrite {id: 'd'})"
      - note: "A MERGE's relationship likewise."
        cypher: "MATCH (n:CyWrite {id: 'a'}) UNWIND [1, 2] AS i MERGE (n)-[r:CyR {f: coalesce(n.c, 0)}]->(m:CyMade) ON CREATE SET n.c = coalesce(n.c, 0) + 1 RETURN [i, r.f, n.c] ORDER BY i"
        rows: [[1, 0, 2], [2, 1, 2]]
      - cypher: "MATCH (x) DETACH DELETE x"
      - cypher: "CREATE (a:CyWrite {id: 'a'})-[:NEXT]->(b:CyWrite {id: 'b'})-[:NEXT]->(:CyWrite {id: 'c'}), (a)-[:NEXT]->(:CyWrite {id: 'd'})"
      - note: "An ON CREATE SET reads what its own items before set, and what the row before set."
        cypher: "MATCH (n:CyWrite {id: 'a'}) UNWIND [1, 2] AS i MERGE (m:CyMade {k: i}) ON CREATE SET n.c = coalesce(n.c, 0) + 1, m.c = n.c RETURN [m.k, m.c, n.c] ORDER BY m.k"
        rows: [[1, 1, 2], [2, 2, 2]]
      - cypher: "MATCH (x) DETACH DELETE x"
      - cypher: "CREATE (a:CyWrite {id: 'a'})-[:NEXT]->(b:CyWrite {id: 'b'})-[:NEXT]->(:CyWrite {id: 'c'}), (a)-[:NEXT]->(:CyWrite {id: 'd'})"
      - note: "An ON MATCH SET reads what the row before set in its ON CREATE SET."
        cypher: "MATCH (n:CyWrite {id: 'a'}) UNWIND [1, 2] AS i MERGE (m:CyMade {k: 1}) ON CREATE SET n.c = 1, m.c = 0 ON MATCH SET m.c = n.c RETURN [i, m.c] ORDER BY i"
        rows: [[1, 1], [2, 1]]

  - name: "Values a write makes: CREATE, a node made alone"
    description: "Each cell of writevalues.yaml in this position that Neo4j 2026.10.1 stores and the SQL stores compile, with its rows, each from the graph alone (liberation-data/drivine4j#814, #817): the cells refused are in refusals.yaml, \"Values a write makes, by position and form\", \"Variable a write makes, read inside a pattern or a comprehension in its properties\" and \"Pattern or subquery in the properties of a CREATE or a MERGE\"."
    steps:
      - cypher: "CREATE (a:CyWrite {id: 'a'})-[:NEXT]->(b:CyWrite {id: 'b'})-[:NEXT]->(:CyWrite {id: 'c'}), (a)-[:NEXT]->(:CyWrite {id: 'd'})"
      - note: "a variable bound before, plainly."
        cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'x'}), (m:CyMade {f: n.id}) RETURN [n.id, m.f] ORDER BY n.id"
        rows: [["a", "a"], ["b", "b"], ["c", "c"], ["d", "d"]]

  - name: "Values a write makes: CREATE, a relationship's endpoint"
    description: "Each cell of writevalues.yaml in this position that Neo4j 2026.10.1 stores and the SQL stores compile, with its rows, each from the graph alone (liberation-data/drivine4j#814, #817): the cells refused are in refusals.yaml, \"Values a write makes, by position and form\", \"Variable a write makes, read inside a pattern or a comprehension in its properties\" and \"Pattern or subquery in the properties of a CREATE or a MERGE\"."
    steps:
      - cypher: "CREATE (a:CyWrite {id: 'a'})-[:NEXT]->(b:CyWrite {id: 'b'})-[:NEXT]->(:CyWrite {id: 'c'}), (a)-[:NEXT]->(:CyWrite {id: 'd'})"
      - note: "a variable bound before, plainly."
        cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'x'})-[:CyR]->(m:CyMade {f: n.id}) RETURN [n.id, m.f] ORDER BY n.id"
        rows: [["a", "a"], ["b", "b"], ["c", "c"], ["d", "d"]]

  - name: "Values a write makes: CREATE, a relationship"
    description: "Each cell of writevalues.yaml in this position that Neo4j 2026.10.1 stores and the SQL stores compile, with its rows, each from the graph alone (liberation-data/drivine4j#814, #817): the cells refused are in refusals.yaml, \"Values a write makes, by position and form\", \"Variable a write makes, read inside a pattern or a comprehension in its properties\" and \"Pattern or subquery in the properties of a CREATE or a MERGE\"."
    steps:
      - cypher: "CREATE (a:CyWrite {id: 'a'})-[:NEXT]->(b:CyWrite {id: 'b'})-[:NEXT]->(:CyWrite {id: 'c'}), (a)-[:NEXT]->(:CyWrite {id: 'd'})"
      - note: "a variable bound before, plainly."
        cypher: "MATCH (n:CyWrite) CREATE (a:CyNew {name: 'x'})-[r:CyR {f: n.id}]->(m:CyMade) RETURN [n.id, r.f] ORDER BY n.id"
        rows: [["a", "a"], ["b", "b"], ["c", "c"], ["d", "d"]]

  - name: "Values a write makes: FOREACH CREATE, a node made alone"
